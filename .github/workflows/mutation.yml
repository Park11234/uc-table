name: mutation

# v1.10.0 개발자 12: '점검의 점검'(돌연변이 앱 60여 쌍)은 오래 걸려 매 push가 아니라 매주 한 번과 손으로 실행할 때만 돌린다.
# 매 push에서는 test.yml(정적 분석·빌드 재현·단위 점검·Playwright 점검·화면 비교)만 돈다.
on:
  schedule:
    - cron: '17 18 * * 0'   # 매주 월요일 03:17(한국 시각)
  workflow_dispatch:

# 개선점 9: 기본 토큰 권한을 읽기로 줄인다(이 작업은 저장소에 쓰지 않는다)
permissions:
  contents: read

jobs:
  mutation:
    # Playwright 1.56은 우분투 26.04(ubuntu-latest)에 브라우저를 설치하지 못해 24.04로 고정(2026-11-20)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: 의존성 설치 (package-lock.json 그대로)
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 점검의 점검 (일부러 망가뜨린 앱을 점검이 잡는지)
        run: npm run test:mutation
      - name: 실패 로그 업로드
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-logs
          path: .test-out/mutants/
          retention-days: 7
