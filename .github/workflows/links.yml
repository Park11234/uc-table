name: links

# v1.8.0 정기 점검: 매달 1일 참고문헌·레시피 링크가 열리는지, 근거 확인일이 1년을 넘지 않았는지 확인한다.
on:
  schedule:
    - cron: '17 0 1 * *'
  workflow_dispatch:

# 개선점 9: 기본 토큰 권한을 읽기로 줄인다(이 작업은 저장소에 쓰지 않는다)
permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: 근거 확인일 점검(1년 넘은 근거 목록)
        run: python3 tools/stale_check.py --warn | tee stale-report.txt
      - name: 링크 점검(실제로 열어 보기)
        run: python3 tools/link_check.py --online --report link-report.md
      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: link-and-stale-report
          path: |
            link-report.md
            stale-report.txt
          retention-days: 30
