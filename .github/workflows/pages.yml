name: pages

# v1.9.0 G-1: main에 올리면 public/(PWA: index.html·app.js·vendor·sw.js·처리방침·접근성 안내)을 GitHub Pages로 배포한다.
# 저장소 설정 > Pages > Build and deployment > Source를 'GitHub Actions'로 한 번 바꿔야 한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 앱 만들기(커밋된 생성 데이터 → 앱 → PWA·오프라인 파일)
        run: |
          python3 src/data/build_app.py
          python3 tools/build_offline.py
      - name: 배포 파일 확인
        run: |
          test -f public/index.html && test -f public/app.js && test -f public/sw.js
          test -f public/privacy.html && test -f public/accessibility.html
          ls -la public public/vendor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
