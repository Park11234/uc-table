name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 개선점 9: 기본 토큰 권한을 읽기로 줄인다(이 작업은 저장소에 쓰지 않는다)
permissions:
  contents: read

jobs:
  check:
    # Playwright 1.56은 우분투 26.04(ubuntu-latest)에 브라우저를 설치하지 못해 24.04로 고정(2026-11-20)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: 의존성 설치 (package-lock.json 그대로)
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 정적 분석 (ESLint, 경고 0 유지)
        run: npm run lint
      - name: 타입 검사 (TypeScript checkJs, 오류 0 유지)
        run: npm run typecheck
      - name: 빌드 재현 확인 (생성 스크립트 결과가 커밋된 앱과 같은지)
        run: |
          cp src/app/index.html /tmp/committed.html
          cp public/index.html /tmp/committed_pwa.html
          cp public/app.js /tmp/committed_app.js
          cp public/sw.js /tmp/committed_sw.js
          python3 src/data/build_app.py
          python3 tools/build_offline.py
          diff -q /tmp/committed.html src/app/index.html
          diff -q /tmp/committed_pwa.html public/index.html
          diff -q /tmp/committed_app.js public/app.js
          diff -q /tmp/committed_sw.js public/sw.js
      - name: 데이터 생성 코드 단위 점검 (Python unittest)
        run: python3 -m unittest discover -s tests/python -v
      - name: 근거 확인일·링크 형식·문구 말투 점검 (내려받기 없이)
        run: |
          python3 tools/stale_check.py
          python3 tools/link_check.py
          python3 tools/tone_check.py
      - name: 점검 실행 (Playwright)
        run: npm test
      - name: 화면 비교 점검 (기준 화면과 픽셀 비교)
        run: node tests/visual/visual.cjs
      - name: 문서 숫자 점검 (README·docs의 숫자가 지금 빌드와 같은지, v1.11.0 M7)
        run: node tools/doc_numbers.cjs
      - name: 실패 로그 업로드
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs
          path: .test-out/
          include-hidden-files: true   # v1.12.0 C-08: .test-out은 숨김 폴더라 이것이 없으면 아무것도 올라가지 않음
          retention-days: 7

  # v1.11.0 M11: 아이폰 사파리와 같은 엔진(WebKit)으로 첫 실행·홈·빠른 기록·음식 검색·백업 불러오기·입력칸 글자 크기를 확인
  webkit:
    # Playwright 1.56은 우분투 26.04(ubuntu-latest)에 브라우저를 설치하지 못해 24.04로 고정(2026-11-20)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: 의존성 설치 (WebKit)
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps webkit
      - name: 오프라인 단일 파일 만들기 (CSP 점검용, 4차)
        run: python3 tools/build_offline.py
      - name: WebKit 흐름 점검
        run: node tests/webkit/webkit.cjs
      - name: 실패 로그 업로드
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webkit-logs
          path: .test-out/
          include-hidden-files: true
          retention-days: 7
