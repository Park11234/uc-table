@font-face{font-family:"UC Table Sans";src:url("fonts/uc-table-sans.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
:root{
  /* v1.12.0 후속 디자인 '바다'(사용자 확정 시안 D, 2026-10-19): 맑은 물빛 바탕, 짙은 바다 파랑 머리 띠(--band)와 강조. 그림자 없이 바탕색 차이로 구역 */
  --bg:#EAF4F8; --bg2:#EAF4F8; --surface:#FFFFFF; --card:#FFFFFF; --surface-2:#DCEEF7; --ink:#0B2540; --muted:#46607A; --line:#D3E5EE; --line-strong:#5F86A3;
  --accent:#0B5E96; --accent-deep:#053B72; --accent-soft:#DCEEF7; --on-soft:#053B72; --fill:#0B5E96; --fill-ink:#FFFFFF; --accent-ink:#FFFFFF; --field:#DCEEF7;
  --deco:#0B5E96; --deco-soft:#DCEEF7; --food-tint:#DCEEF7;
  --band:linear-gradient(180deg,#053B72 0%,#0B5E96 100%); --band-top:#053B72; --band-bot:#0B5E96; --band-ink:#FFFFFF; --band-ink2:#CFE8F5; --band-line:#FFFFFF; --band-pop:#8EE0F0; --band-thr:#FFD97A;
  --band-glass:rgba(255,255,255,.14); --band-btn:#FFFFFF; --band-btn-ink:#053B72; --logo:#FFFFFF; --tabbar:#FFFFFF;
  --peb-river:#C2E4F3; --peb-on:#9DD3EA; --peb-dash:rgba(255,255,255,.85); --peb-empty:rgba(255,255,255,.6);   /* 25차 조약돌 강 */
  /* v1.12.0 C-22: 판정 색을 적록 색약도 구분하게(좋음은 청록 쪽, 주의는 노란 호박, 피하기는 진홍, 다음 단계는 남회색). 글자 4.5:1 이상 */
  --ok:#0B6E55; --ok-soft:#E2F3EC; --ok-ink:#0B6E55; --warn:#8C6400; --warn-soft:#FFF3D1; --warn-fill:#B88200; --warn-ink:#8C6400; --later:#4A5785; --later-soft:#ECEEF7; --avoid:#9B2335; --avoid-soft:#FCE4E6; --ban-bg:#6E1420; --ban-ink:#FFFFFF;
  --crit:#A8261B; --crit-soft:#FCE6E3; --crit-ink:#9B2335; --danger-fill:#A8261B;   /* 이유 글자(crit-t)는 색약 모의에서 주의 글자와 색 차이 12 이상: 피하기 색과 같은 #9B2335 */
  --shadow:none; --scrim:rgba(5,30,60,.45); --fab-shadow:none; --ridge-area:rgba(255,255,255,.16);
  /* v1.11.0 글꼴: Pretendard(OFL-1.1)를 앱 글자 + KS X 1001 한글로 줄여 이름을 바꾼 'UC Table Sans'를 앱 안에 넣어 웹·PWA·오프라인·안드로이드가 같은 모양 */
  --display:"UC Table Sans","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;
  --body:"UC Table Sans","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;
  /* v1.9.0 색 토큰: 하드코딩 색을 옮김(즐겨찾기 별, 근거 종류 칩) — 별은 흰 바탕 3.96:1 */
  --star:#A87700; --rt-s-bg:#E6F4EA; --rt-s-ink:#1E6B3A; --rt-h-bg:#FFF1E0; --rt-h-ink:#8A4B08; --rt-2-bg:#F1ECF8; --rt-2-ink:#5B3A8C; --pc-bg:#EDEEF0;
  --r:12px; color-scheme:light;
}
/* 화면 모드: 앱 설정(data-app-theme)이 뷰어 테마(data-theme)보다 우선 */

  :root:not([data-theme="light"]):not([data-app-theme="light"]){
  --bg:#0D1647; --bg2:#0D1647; --surface:#16205E; --card:#16205E; --surface-2:#222E7A; --ink:#F2F4FF; --muted:#B8C0EE; --line:#2A3690; --line-strong:#7D8BE0;
  --accent:#F6E7A8; --accent-deep:#FFF1C2; --accent-soft:#222E7A; --on-soft:#F6E7A8; --fill:#F6E7A8; --fill-ink:#0D1647; --accent-ink:#0D1647; --field:#101A55;
  --deco:#F6E7A8; --deco-soft:#222E7A; --food-tint:#222E7A;
  --band:#070F36; --band-top:#070F36; --band-bot:#070F36; --band-ink:#F2F4FF; --band-ink2:#B8C0EE; --band-line:#E9ECFF; --band-pop:#F6E7A8; --band-thr:#8FA2FF;
  --band-glass:rgba(255,255,255,.10); --band-btn:#F6E7A8; --band-btn-ink:#0D1647; --logo:#F6E7A8; --tabbar:#0A1240;
  --peb-river:#1C2A70; --peb-on:#2B3D96; --peb-dash:rgba(233,236,255,.3); --peb-empty:rgba(255,255,255,.06);
  --ok:#55D2AC; --ok-soft:#12302A; --ok-ink:#55D2AC; --warn:#F2C94C; --warn-soft:#3A2E10; --warn-fill:#E8B830; --warn-ink:#F2C94C; --later:#B0BCCD; --later-soft:#232D3B; --avoid:#FF8A8A; --avoid-soft:#3D1A1E; --ban-bg:#FFB4AB; --ban-ink:#3B0A06;   /* v1.12.0 C-22: 절대 금지 바탕은 페이지·카드와 3:1 이상 */
  --crit:#FF8E80; --crit-soft:#3D1A16; --crit-ink:#FF8E80; --danger-fill:#C62839;
  --shadow:none; --scrim:rgba(0,0,0,.6); --fab-shadow:none; color-scheme:dark; --ridge-area:rgba(233,236,255,.14);
  --star:#F0B347; --rt-s-bg:#1E3A28; --rt-s-ink:#9FDDB2; --rt-h-bg:#3D2A12; --rt-h-ink:#F4C58A; --rt-2-bg:#2E2440; --rt-2-ink:#CDB8F0; --pc-bg:#050A24;
  }
}
:root[data-theme="dark"]:not([data-app-theme="light"]),:root[data-app-theme="dark"]{
  --bg:#0D1647; --bg2:#0D1647; --surface:#16205E; --card:#16205E; --surface-2:#222E7A; --ink:#F2F4FF; --muted:#B8C0EE; --line:#2A3690; --line-strong:#7D8BE0;
  --accent:#F6E7A8; --accent-deep:#FFF1C2; --accent-soft:#222E7A; --on-soft:#F6E7A8; --fill:#F6E7A8; --fill-ink:#0D1647; --accent-ink:#0D1647; --field:#101A55;
  --deco:#F6E7A8; --deco-soft:#222E7A; --food-tint:#222E7A;
  --band:#070F36; --band-top:#070F36; --band-bot:#070F36; --band-ink:#F2F4FF; --band-ink2:#B8C0EE; --band-line:#E9ECFF; --band-pop:#F6E7A8; --band-thr:#8FA2FF;
  --band-glass:rgba(255,255,255,.10); --band-btn:#F6E7A8; --band-btn-ink:#0D1647; --logo:#F6E7A8; --tabbar:#0A1240;
  --peb-river:#1C2A70; --peb-on:#2B3D96; --peb-dash:rgba(233,236,255,.3); --peb-empty:rgba(255,255,255,.06);
  --ok:#55D2AC; --ok-soft:#12302A; --ok-ink:#55D2AC; --warn:#F2C94C; --warn-soft:#3A2E10; --warn-fill:#E8B830; --warn-ink:#F2C94C; --later:#B0BCCD; --later-soft:#232D3B; --avoid:#FF8A8A; --avoid-soft:#3D1A1E; --ban-bg:#FFB4AB; --ban-ink:#3B0A06;   /* v1.12.0 C-22: 절대 금지 바탕은 페이지·카드와 3:1 이상 */
  --crit:#FF8E80; --crit-soft:#3D1A16; --crit-ink:#FF8E80; --danger-fill:#C62839;
  --shadow:none; --scrim:rgba(0,0,0,.6); --fab-shadow:none; color-scheme:dark; --ridge-area:rgba(233,236,255,.14);
  --star:#F0B347; --rt-s-bg:#1E3A28; --rt-s-ink:#9FDDB2; --rt-h-bg:#3D2A12; --rt-h-ink:#F4C58A; --rt-2-bg:#2E2440; --rt-2-ink:#CDB8F0; --pc-bg:#050A24;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.6;padding-inline:16px;padding-block:0 112px;min-height:100%}   /* v1.11.0 R-01: 기본 여백 8px이 실제 앱에만 남아 화면이 16px 넘치고 좌우가 좁았음 */
.wrap{max-width:560px;margin:0 auto}
/* 수정 요청서 v2 항목 2: 홈 맨 아래 두 안내 글(.plan-note·.foot-note)을 모두 가운데 정렬, 좌우 여백 같게(8px). 아이콘은 글 위 가운데 */
.plan-note{display:block;text-align:center;margin:0 8px 16px}
.hint.plan-note{margin:0 8px}
.bc-cam{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3}
.bc-cam video{width:100%;height:100%;object-fit:cover;display:block}
.bc-cam i{position:absolute;left:10%;right:10%;top:50%;height:2px;background:#ff4d4d;box-shadow:0 0 8px #ff4d4d}
.why-sum{margin:12px 0 0;font-weight:600}
.why-more{margin:8px 0 8px;background:var(--surface-2);border-radius:12px;padding:4px 12px}
.why-more summary{min-height:44px;display:flex;align-items:center;font-size:0.8125rem;font-weight:600;color:var(--accent);cursor:pointer}
.why-more p{margin:0 0 8px;font-size:0.875rem}
.why-list{margin:0 0 8px;padding-left:16px;font-size:0.8125rem}
.fsize{display:block;margin-top:4px}
.alt-box{margin:4px 0 12px;display:flex;flex-direction:column;gap:8px}
.alt-row{display:flex;flex-direction:column;gap:8px}
.alt-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 8px;min-height:48px;text-align:left;color:inherit}
.alt-chip span:nth-child(2){flex:1;min-width:0;font-weight:600;font-size:0.875rem}
.alt-chip .fic{width:34px;height:34px}
.plan-note .ic{display:block;width:16px;height:16px;margin:0 auto 4px}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;align-items:center;gap:4px;min-height:56px;margin-inline:-16px;padding:4px 8px 4px 16px;background:var(--bg);box-shadow:0 1px 0 var(--line)} /* v1.9.0 D-11: 불투명 + 아래 구분선(본문이 비치지 않게) */
.appbar h1{font-family:var(--display);font-size:1.375rem;font-weight:600;letter-spacing:-.02em}
/* v1.8.0 앱 이름 로고 */
.appbar h1.brand{display:flex;align-items:center;line-height:1}
.appbar .logo{display:block;color:var(--accent)}
.appbar .logo svg{display:block;height:24px;width:auto}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
body.pushed .appbar{padding-left:8px}
body.pushed .appbar h1{font-size:1.0625rem}
.grow{flex:1}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;flex:0 0 auto}
.icon-btn:active{background:var(--surface-2)}
.icon-btn.soft{background:var(--surface-2);color:var(--accent)}
.icon-btn:disabled{opacity:.35}
.tab span{line-height:1}
.hint{font-size:0.8125rem;color:var(--muted);margin:0}
.pad{padding:0 8px}
.sec-title h2{font-size:1.0625rem}
.sec-label{font-size:0.8125rem;font-weight:600;color:var(--muted);margin:8px 8px -8px}
.hero .glass{border:1px solid var(--line);color:var(--ink);font-weight:600;font-family:var(--body)}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.lrow,.mrow,.hrow,.swrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;background:transparent;text-align:left;color:inherit;border-top:1px solid var(--line);min-height:62px;font:inherit}
.list>:first-child{border-top:0}
.list>input[hidden]+*{border-top:1px solid var(--line)}
.lt{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.35}
.lt b{font-size:0.9375rem;font-weight:600;text-wrap:balance}   /* 6차: 큰 글씨에서 '관해 기준에 / 해당'처럼 한 낱말만 넘어가던 목록 제목 */
.lt small{font-size:0.8125rem;color:var(--muted)}
.lr{font-size:0.8125rem;color:var(--muted);white-space:nowrap}
.chev{width:18px;height:18px;color:var(--muted);opacity:.7}
.lic{width:24px;height:24px;display:grid;place-items:center;flex:0 0 auto;background:transparent!important;color:var(--muted)!important}   /* 17차: 색 칸 없이 옅은 글씨 색(t-* 색보다 앞섬) */
.lic .ic{width:20px;height:20px}
.t-amber{background:var(--warn-soft);color:var(--warn)!important}
.wrow>summary{list-style:none;cursor:pointer}.wrow>summary::-webkit-details-marker{display:none}
.wrow>summary .chev{transform:rotate(90deg)}.wrow[open]>summary .chev{transform:rotate(-90deg)}
@media (prefers-reduced-motion: no-preference){.wrow>summary .chev{transition:transform .15s}}
.wtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.wtag{flex:0 0 auto;font-size:0.75rem;font-weight:600;color:var(--warn-ink);background:var(--warn-soft);border-radius:999px;padding:4px 8px;white-space:nowrap}
.wbody{padding:0 16px 16px 64px;font-size:0.875rem;line-height:1.6;color:var(--ink)}
.list>.wrow:first-child>summary{border-top:0}
.t-warm{background:var(--deco-soft);color:var(--deco)!important} .t-coral{background:var(--avoid-soft);color:var(--avoid)!important} .t-rose{background:var(--accent-soft);color:var(--accent)!important} .t-food{background:var(--food-tint);color:var(--accent)!important} .t-sage{background:var(--deco-soft);color:var(--deco)!important} .t-plain{background:var(--surface-2);color:var(--ink)!important}
.fic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;color:var(--accent)}
.fic .ic{width:25px;height:25px;stroke-width:1.6}
.fic.lg{width:60px;height:60px;border-radius:12px} .fic.lg .ic{width:30px;height:30px}
.fic.xl{width:84px;height:84px;border-radius:12px} .fic.xl .ic{width:42px;height:42px;stroke-width:1.4}
.lrow,.mrow,.hrow,.fcard,.tile,.aicard,.bigact,.btn,.opts button{transition:transform .12s ease,background .15s,border-color .15s}
button.lrow:active,label.lrow:active,.mrow:active,.hrow:active,.fcard:active,.tile:active,.aicard:active,.bigact:active,.btn:active,.opts button:active{transform:scale(.98)}
.lrow.static{cursor:default}
.lrow:disabled{opacity:.5}
.lrow.danger b{color:var(--crit)} .lrow.danger .lic{color:var(--crit)!important} .lic.t-amber{color:var(--warn)!important}
.done{width:26px;height:26px;border-radius:50%;background:var(--fill);color:var(--fill-ink);display:grid;place-items:center;flex:0 0 auto}
.done .ic{width:15px;height:15px;stroke-width:2.6}
.mrow .slot{align-self:flex-start;margin-bottom:4px}
.refn{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:0.8125rem;flex:0 0 auto}
.swrow{cursor:pointer}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line-strong);position:relative;flex:0 0 auto;transition:background .2s;margin:0;cursor:pointer;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw:checked{background:var(--fill)}
.sw:checked::after{transform:translateX(20px)}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.aicard{display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:left;color:inherit;background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);font:inherit}
.aicard:disabled{opacity:.55}
.bigacts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigact{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);cursor:pointer}
.bigact .lic{width:48px;height:48px;border-radius:12px}
.bigact small{color:var(--muted);font-size:0.8125rem;margin-top:-8px}
.segctl{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.segctl button{flex:1;border:0;background:transparent;border-radius:12px;padding:8px 4px;min-height:44px;font-weight:600;font-size:0.875rem;color:var(--muted)}
.segctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(42,26,28,.12)}
.seg3{display:flex;gap:8px}
.seg3 button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;min-height:44px;font-size:0.875rem;font-weight:600}
.seg3 button[aria-pressed="true"]{background:var(--fill);border-color:var(--fill);color:var(--fill-ink)}
.seg3 button:disabled{opacity:.4}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:2px 16px;box-shadow:var(--shadow);color:var(--muted);border:1px solid var(--line-strong)}
.searchbar:focus-within{outline:2px solid var(--accent);outline-offset:2px} /* v1.9.0 A-8: 캐럿만 보이던 검색칸에 초점 표시 */
.searchbar input{background:transparent!important;border:0!important;padding:12px 0!important}
.bottom-bar{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:4;display:grid;gap:8px;padding-top:8px}
.bottom-bar.two{grid-template-columns:auto minmax(50%,1fr)}   /* 6차: 1fr 2fr이면 보조 단추('그림 PDF'·'모두 앱 계산으로')가 좁아 두 줄로 꺾였다 */
.bottom-bar .btn{padding:16px;font-size:0.9375rem;border-radius:12px}
.bottom-bar .btn:not(.primary){background:var(--surface);box-shadow:var(--shadow);border-color:transparent}
.wz-progress{height:6px;border-radius:8px;background:var(--line);overflow:hidden}
.wz-progress i{display:block;height:100%;background:var(--fill);border-radius:8px;transition:width .3s}
.wz{display:flex;flex-direction:column;gap:16px;padding:12px 2px 8px;min-height:54vh}
.wz-q{font-family:var(--display);font-size:1.5rem;font-weight:600;letter-spacing:-.02em;line-height:1.32}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:2px solid transparent;border-radius:12px;padding:16px 16px;font-size:1rem;font-weight:600;box-shadow:var(--shadow);text-align:left}

/* 화면이 밀려 들어오는 동안(옆으로 26px) 문서 폭이 잠깐 넓어져 가로 스크롤이 생기지 않게. 움직임이 끝나면 JS가 a-* 클래스를 떼어 실제 넘침은 그대로 드러난다 */
.view.a-push,.view.a-fwd,.view.a-bwd{overflow-x:clip}
.a-bwd>:not(.bottom-bar){animation:pop .26s cubic-bezier(.2,.8,.2,1)}
.a-fade>:not(.bottom-bar){animation:fadein .22s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){.a-push>*,.a-fwd>*,.a-bwd>*,.a-fade>*,.sheet{animation:none!important}}
/* v1.8.0 근거 표시: 문단마다 '근거' 하나(모아서) / 번호 / 숨기기 */
sup.ref.grp{min-width:0;padding:0 8px;height:20px;font-size:0.75rem;font-weight:600;white-space:nowrap}
:root[data-ref="hide"] sup.ref{display:none!important}
.reftag{display:flex;gap:8px;align-items:center;margin:4px 0 2px;font-size:0.8125rem}
.rt{display:inline-block;padding:1px 8px;border-radius:999px;font-weight:600;font-size:0.75rem;background:var(--surface-2);color:var(--ink)}
.rt-g{background:var(--accent-soft);color:var(--accent-deep)} .rt-s{background:var(--rt-s-bg);color:var(--rt-s-ink)} .rt-h{background:var(--rt-h-bg);color:var(--rt-h-ink)} .rt-2{background:var(--rt-2-bg);color:var(--rt-2-ink)}
/* v1.8.0 홈: 한 줄 요약·계획/먹은 양 두 막대·접히는 안내 */
.sumline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 8px;width:100%;background:var(--surface);border-radius:12px;padding:8px 8px 8px 4px;box-shadow:var(--shadow);margin:0 0 12px;min-height:56px}
/* v1.9.0 D-1: 좁은 화면·큰 글자에서는 '+1잔'이 다음 줄로 내려가고, 요약 칸도 줄바꿈된다(겹치지 않게) */
.sumline .sl-main{flex:1 1 15rem;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;text-align:left;padding:8px 8px 8px 8px;border-radius:12px;color:inherit}
.sumline .sl-ks{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 0}
.sumline .sl-ks .sl-k{padding:0 8px}.sumline .sl-ks .sl-k:first-child{padding-left:0}.sumline .sl-ks .sl-k+.sl-k{border-left:1px solid var(--line)}
.sumline>.btn{margin-left:auto}
.sumline .sl-main .chev{flex:none}
.sumline .sl-k{display:flex;flex-direction:column;line-height:1.2;white-space:nowrap} .sumline .sl-k small{font-size:0.75rem;color:var(--muted)} .sumline .sl-k b{font-size:1rem} .sumline .sl-k b small{font-size:0.75rem;font-weight:600}
.sumline .btn{white-space:nowrap;padding:8px 12px;min-height:44px;flex:none}
.banner.row-b{display:flex;align-items:center;gap:8px} .banner.row-b .grow{flex:1} .banner.row-b .btn{flex:none;white-space:nowrap}
.sumline .sl-sep{width:1px;align-self:stretch;background:var(--line)}
.sumline .grow{flex:1}
.legend{display:flex;gap:12px;font-size:0.8125rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:7px;border-radius:8px;margin-right:4px;vertical-align:middle}
.tipbox{position:relative;padding-right:32px}
.tipbox .tip-x{position:absolute;top:-6px;right:-8px;width:44px;height:44px;border:0;background:none;color:var(--muted);font-size:1.125rem}
.tip-i{border:0;background:none;color:var(--accent-deep);font-size:0.8125rem;font-weight:600;padding:8px 4px;min-height:44px}
.ratio{display:inline-flex;gap:4px;margin-left:4px}
.ratio button{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:0.8125rem;min-height:44px;min-width:44px}
.ratio button[aria-pressed="true"]{background:var(--fill);border-color:var(--fill);color:var(--fill-ink)}
.star{border:0;background:none;font-size:1.375rem;line-height:1;min-width:44px;min-height:44px;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--star)}
.fsv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
.fsv>div{border-radius:12px;padding:8px 8px;text-align:center;background:var(--surface-2);font-size:0.8125rem;line-height:1.3}
.fsv>div b{display:block;font-size:0.875rem;color:var(--ink)}
.fsv .lo{box-shadow:inset 0 3px 0 var(--ok)} .fsv .mid{box-shadow:inset 0 3px 0 var(--warn-fill)} .fsv .hi{box-shadow:inset 0 3px 0 var(--avoid)}
.onb-steps{display:flex;gap:8px;margin:0 0 12px} .onb-steps i{flex:1;height:5px;border-radius:8px;background:var(--line)} .onb-steps i.on{background:var(--fill)}
.chips.wrap-chips{flex-wrap:wrap}
#errbar{position:fixed;left:0;right:0;top:0;z-index:60;margin:0 auto;max-width:592px;padding:8px 16px}
.qrow{display:flex;align-items:center;gap:8px}
.qrow input[type=checkbox]{width:26px;height:26px;flex:none}
.qrow .lt.is-done b{text-decoration:line-through;color:var(--muted)}   /* 전역 .done(먹은 끼니 표식)과 겹치지 않게 is-done(2026-10-15) */
.wbasis{font-size:0.75rem;color:var(--muted);font-weight:500}

h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:600} h3{font-size:1.0625rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:0.8125rem}
small{font-size:max(.8333em,.75rem)}   /* 2026-10-25 5차: 따로 크기를 안 정한 작은 글씨가 13px 줄 안에서 10.8px까지 작아지던 것(꽃송이 3/4컵·목표 30g) → 앱의 가장 작은 글씨 12px에 맞춤 */
.num{font-variant-numeric:tabular-nums}

/* header */
.top{padding-block:20px 8px}
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello .date{font-size:0.8125rem;color:var(--muted);font-weight:500}
.hello h1{font-size:1.5rem;font-weight:600;margin-top:2px}
.avatar{width:46px;height:46px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;flex:0 0 auto}
.avatar svg{width:22px;height:22px;stroke:var(--accent-deep);fill:none;stroke-width:1.8}
.brandline{font-size:0.8125rem;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:4px}
.stages{display:flex;gap:4px;margin-top:16px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.stage{flex:1;padding:8px 4px;border-radius:999px;text-align:center;font-size:0.8125rem;color:var(--muted);line-height:1.2}
.stage b{font-weight:600;margin-right:4px}
.stage.on{background:var(--fill);color:var(--fill-ink)}
.stage-note{margin:8px 4px 0;font-size:0.8125rem;color:var(--muted)}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:4px 8px env(safe-area-inset-bottom,0px)}
.tabs-in{display:flex;justify-content:space-between;gap:2px;max-width:560px;margin:0 auto}
.tab{flex:1;background:none;border:0;border-radius:12px;padding:8px 2px 8px;font-size:0.75rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab[aria-current="page"] svg{stroke-width:2.2}

section.view{display:flex;flex-direction:column;gap:16px;padding-top:12px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.flat{background:var(--surface-2);border-radius:12px;padding:12px 16px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:8px 4px -4px}
.sec-title h2{font-size:1.125rem}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 16px;font-weight:600;font-size:0.875rem}
label.btn{display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}   /* 파일 고르기처럼 label로 만든 버튼도 글자를 가운데로 */
.btn.primary{background:var(--fill);border-color:var(--fill);color:var(--fill-ink)}
.btn.dark{background:var(--fill);border-color:var(--fill);color:var(--fill-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-deep)}
.btn.sm{padding:8px 12px;font-size:0.8125rem;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.full{width:100%}
a.btn.full{display:flex;align-items:center;justify-content:center;text-decoration:none}   /* 링크로 된 넓은 단추(크롬으로 열기 등)도 단추처럼 가운데·밑줄 없이 */

.banner{border-radius:12px;padding:12px 16px;border:1px solid}
.banner.crit{background:var(--crit-soft);border-color:var(--crit);border-width:2px;color:var(--ink)}
.banner.urgent{background:var(--warn-soft);border-color:var(--warn,#E8A33D);border-width:2px;color:var(--ink)}
.banner.urgent strong{color:var(--warn-ink,#9A5B00)}
.banner{position:relative;z-index:1}
.banner .b-act{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.banner .b-act .btn{min-height:44px;padding:0 16px}
.banner.crit strong{color:var(--crit)}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.info{background:var(--accent-soft);border-color:transparent}

/* hero summary */
.hero{color:var(--ink);padding:2px 0 0}
.cal-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:12px}
.cal-head b{font-family:var(--display);font-size:1.75rem;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.cal-head span{font-family:var(--display);font-size:0.9375rem;font-weight:600;color:var(--muted)}
.cal-head .glass{margin-left:auto}
.hero .days{gap:4px;justify-content:space-between} @media (max-width:359px){.hero .days{padding-right:40px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}}
.hero .day{background:transparent;box-shadow:none;color:var(--ink);width:auto;flex:1 0 44px;min-width:44px;border-radius:999px;padding:8px 0}
.hero .day span{color:var(--muted)}
.hero .day[aria-pressed="true"]{background:transparent;color:var(--accent-ink)}
.hero .day[aria-pressed="true"] span{color:var(--accent);opacity:1;font-weight:600}
.hero .day[aria-pressed="true"] b{background:var(--fill);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;margin:2px auto 0;color:var(--accent-ink)}
.hero .day b{width:36px;max-width:100%;aspect-ratio:1;height:auto;display:grid;place-items:center;margin:2px auto 0}
.overlap{position:relative}
.big-date{font-family:var(--display);font-size:1.5rem;font-weight:600;letter-spacing:-.02em}
.big-date small{font-weight:600;color:var(--muted);font-size:0.9375rem;margin-left:4px}
.fab{position:fixed;right:20px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--fill);color:var(--fill-ink);box-shadow:var(--fab-shadow);display:grid;place-items:center;z-index:5}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.hero .muted,.hero .small{color:var(--muted)}
.hero-row{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:118px;height:118px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.15}
.ring .v b{font-family:var(--display);font-size:1.5rem;display:block}
.ring .v span{font-size:0.75rem;color:var(--muted)}
.ring .v b{color:var(--ink)}
.hbar{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;font-size:0.8125rem;padding-block:4px}
.hbar .t{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.hero .sub{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hero .sub h3{font-size:1rem;color:var(--ink)}
.hero .glass{background:var(--surface);border-radius:999px;padding:4px 12px;font-size:0.8125rem}

/* v1.9.0 D-3 오늘 할 일 */
.tasks{display:flex;flex-direction:column;gap:2px}
.task{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:8px 0;border-top:1px solid var(--line)}
.tasks>.row+.task{border-top:0}
.tk-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:600;font-size:0.875rem;flex:none}
.tk-n .ic{width:16px;height:16px;stroke-width:2.6}
.task.is-done .tk-n{background:var(--ok-soft);color:var(--ok)}
.tk-main{display:flex;align-items:center;gap:12px;flex:1 1 12rem;min-width:0}
.tk-act{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;flex:0 1 auto;max-width:100%;justify-content:flex-end} /* v1.10.0 버튼이 셋이어도 큰 글자에서 줄바꿈 */
.tk-act .btn{white-space:nowrap}
.tk-act .btn.sm{min-height:44px}
/* quick tiles */
.tiles.t3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border-radius:var(--r);overflow:hidden}   /* 17차: 색 칸 세 개 → 한 판 */
.tile{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:0.8125rem;color:var(--ink);padding:12px 4px;min-height:72px;text-align:center}
.tile+.tile{box-shadow:inset 1px 0 0 var(--line)} .tiles.t3 .tile:active{transform:none;background:var(--surface-2)} .tile:focus-visible{outline-offset:-3px}
.tile i{display:grid;place-items:center;font-style:normal;background:none;color:var(--muted)}
.tile svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* day strip */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.day{flex:0 0 auto;width:52px;border:0;background:var(--surface);border-radius:12px;padding:8px 0;text-align:center;line-height:1.25;box-shadow:var(--shadow)}
.day b{display:block;font-size:1.125rem;font-family:var(--display)}
.day span{font-size:0.75rem;color:var(--muted);display:block}
.day[aria-pressed="true"]{background:var(--fill);color:var(--fill-ink)}
.day[aria-pressed="true"] span{color:inherit;opacity:.85}

/* meal cards */
.meal{display:grid;grid-template-columns:58px 1fr;gap:16px;background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.thumb{width:58px;height:58px;border-radius:12px;background:var(--food-tint);display:grid;place-items:center;font-size:1.75rem}
.meal:nth-of-type(3n+2) .thumb{background:var(--deco-soft)} .meal:nth-of-type(3n) .thumb{background:var(--accent-soft)}
.slot{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 8px;font-size:0.75rem;font-weight:600}
.meal h4{margin:8px 0 0;font-size:1.0625rem;font-weight:600;font-family:var(--display)}
.btn.eat{background:var(--fill);border-color:var(--fill);color:var(--fill-ink);font-weight:600}
.items{margin:4px 0 0;padding:0;list-style:none;font-size:0.8125rem;color:var(--muted)}
.items li{display:inline}
.items li+li::before{content:" · "}
.why{margin:8px 0 0;font-size:0.875rem;background:var(--surface-2);border-radius:12px;padding:8px 12px}
.why b{color:var(--accent);font-size:0.8125rem;display:block;margin-bottom:1px}
sup.ref{font-size:0.75rem;color:var(--accent-deep);font-weight:600;cursor:pointer;margin-left:1px;padding:0 2px;background:var(--accent-soft);border-radius:8px}
.eaten{font-size:0.8125rem;color:var(--ok);font-weight:600}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 8px;font-size:0.8125rem;font-weight:600;white-space:nowrap}
.today-card .qtag{margin-top:8px;white-space:normal}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.caution{background:var(--warn-soft);color:var(--warn)}
.pill.later{background:var(--later-soft);color:var(--later)}
.pill.avoid{background:var(--avoid-soft);color:var(--avoid)}
/* v1.9.0 절대 금지(아질산염 가공육 등): 진한 빨강 바탕에 흰 글자, X 모양 */
.pill.ban{background:var(--ban-bg);color:var(--ban-ink);font-weight:600}
.pill::before{content:"";width:9px;height:9px;flex:0 0 auto;background:currentColor}
.pill.ok::before{border-radius:50%}
.pill.caution::before{clip-path:polygon(50% 0,100% 100%,0 100%)}
.pill.later::before{border-radius:2px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.pill.avoid::before{clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.pill.ban::before{width:10px;height:10px;clip-path:polygon(20% 0,50% 30%,80% 0,100% 20%,70% 50%,100% 80%,80% 100%,50% 70%,20% 100%,0 80%,30% 50%,0 20%)}
.pill.neutral::before,.pill.info::before{display:none}
.pill.neutral{background:var(--accent-soft);color:var(--on-soft)}

/* forms */
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:0.8125rem;color:var(--muted);font-weight:500}   /* v1.11.0 R-02: '성별'(div.f)도 다른 칸 제목과 같게 */
input[type=text],input[type=number],input[type=date],input[type=search],input[type=time],input[type=email],input[type=password],input[type=tel],input[type=url],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:12px;padding:8px 12px;min-height:48px;color:var(--ink);font-size:1rem}   /* 17차: 여백 4px 단계로 줄인 만큼 높이를 지켜 44px 넘게 */
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button,.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:0.8125rem;min-width:44px}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--on-soft);border-color:var(--accent);font-weight:600}
.seg button:disabled{opacity:.4}
.q{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q-t{font-weight:600;font-size:0.875rem}
.stepper{display:inline-flex;align-items:center;background:var(--surface-2);border-radius:12px;overflow:hidden}
.stepper button{border:0;background:transparent;width:44px;height:44px;font-size:1.25rem;color:var(--accent-deep)}
.stepper output{min-width:52px;text-align:center;font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);height:44px;margin:0} /* v1.9.0 A-9: 슬라이더 높이 16px → 44px */
.check{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:0.875rem}
.check:first-child{border-top:0}
.check input{margin-top:2px;width:24px;height:24px;accent-color:var(--accent)}
.tagx{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:999px;padding:0 0 0 12px;font-size:0.8125rem}
.tagx button{border:0;background:none;width:44px;height:44px;border-radius:50%;color:var(--muted);font-size:1.125rem}

/* nutrition */
.meter{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:8px;font-size:0.8125rem;padding-block:8px}
.bar{height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar i.low{background:var(--warn-fill)}
.cups{display:flex;flex-wrap:wrap;gap:8px}
.cup{width:44px;height:52px;border:2px solid var(--accent);border-radius:8px 8px 12px 12px;background:transparent;padding:0}
.cup.full{background:linear-gradient(to top,var(--accent) 80%,transparent 80%)}

/* food list rows (details) */
.food{display:flex;justify-content:space-between;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.food:first-child{border-top:0}
.food p{margin:2px 0 0;font-size:0.8125rem;color:var(--muted)}
.food .pill{flex-shrink:0;align-self:flex-start;margin-top:2px}

/* food grid */
.cats{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:2px} /* v1.9.0 D-8: 가로로 잘리던 칩을 줄바꿈 */
.cats .chip{flex:0 0 auto;white-space:nowrap}
.subnav{margin-top:0}
.subnav .stage{border:0;background:none;font-weight:600;font-size:0.8125rem}
.subnav .stage.on{background:var(--fill);color:var(--fill-ink)}
/* v1.10.0 디자인 4: 검색 결과는 한 줄 목록(그림·이름·종류와 1회 양·판정) */
.fgrid{display:flex;flex-direction:column;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.fcard{position:relative;text-align:left;border:0;background:transparent;padding:8px 16px;display:flex;flex-direction:row;align-items:center;gap:12px;min-width:0;min-height:60px;color:inherit}
.fcard+.fcard{border-top:1px solid var(--line)}
.fcard .lt{flex:1;min-width:0;display:flex;flex-direction:column}
.fcard .lt small{color:var(--muted);font-size:0.75rem;line-height:1.35}
.fcard .pill{flex:none;margin:0}
.ftools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ftools .chip{min-height:44px;display:inline-flex;align-items:center;gap:8px}
.ftools .chip .ic{width:16px;height:16px}
.ftools .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--on-soft);font-weight:600}
.fcard .thumb{width:50px;height:50px;font-size:1.5rem;border-radius:12px}
.fcard:nth-child(4n+1) .thumb{background:var(--food-tint)} .fcard:nth-child(4n+2) .thumb{background:var(--deco-soft)} .fcard:nth-child(4n+3) .thumb{background:var(--accent-soft)} .fcard:nth-child(4n) .thumb{background:var(--surface-2)}
.fcard .chev{position:absolute;right:12px;bottom:14px;color:var(--muted);font-size:1.125rem;line-height:1}
.fcard b{font-size:0.875rem;line-height:1.35;overflow-wrap:anywhere}
.fcard .dot{position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%}
.dot.ok{background:var(--ok)} .dot.caution{background:var(--warn-fill)} .dot.later{background:var(--later)} .dot.avoid{background:var(--avoid)}

/* table */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:0.8125rem}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:500}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:12px 12px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:44px;height:5px;border-radius:8px;background:var(--line);margin:0 auto 16px}
/* v1.11.0 R-11: 시트 맨 끝 버튼 줄(닫기·오늘 먹었습니다 등)은 시트 아래에 붙여 내용을 내리지 않아도 보이게 */
/* v1.12.0 검토 C-18: :has()를 모르는 옛 브라우저가 규칙 전체를 버리지 않게, :has() 규칙과 넓은 버튼 규칙을 따로 둔다 */
.sheet>.grid2:last-child:has(>.btn){position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));z-index:1;background:var(--surface);margin-left:-16px;margin-right:-16px;margin-bottom:calc(-24px - env(safe-area-inset-bottom,0px));padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -1px 0 var(--line)}
.sheet>.btn.full:last-child{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));z-index:1;background:var(--surface);margin-left:-16px;margin-right:-16px;margin-bottom:calc(-24px - env(safe-area-inset-bottom,0px));padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -1px 0 var(--line);width:calc(100% + 32px)}
.refitem{padding-block:8px;border-top:1px solid var(--line);font-size:0.875rem}
.refitem:first-of-type{border-top:0}
.refitem .n{display:inline-block;min-width:28px;margin-right:8px;font-weight:600;color:var(--accent-deep)}
.refitem .cite{font-size:0.8125rem;color:var(--muted);margin-top:4px}
/* v1.9.0 D-6: 알림(토스트)은 아래 조작 영역을 가리지 않게 위쪽 전용 영역에 5초 동안. 누르거나 초점이 가면 멈춘다. 영역은 늘 있어(aria-live) 화면 읽기가 알림을 읽는다 */
/* v1.10.0 디자인 10: 알림은 아래쪽(메뉴 바로 위)에 띄워 화면 제목을 가리지 않는다. 메뉴가 없는 화면(설정·기록 마법사)은 화면 아래 버튼 위 */
.toasts{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);z-index:30;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
body.pushed .toasts:not(.top),body.welcome .toasts:not(.top){bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
.toast{pointer-events:auto;display:flex;align-items:center;max-width:528px;background:var(--ink);color:var(--bg);padding:4px;border-radius:12px;font-size:0.875rem;box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:1;transition:opacity .2s}
/* 수정 요청서 v2 항목 4: 글자는 알약 가운데. 왼쪽에 × 버튼과 같은 너비(44px)의 빈칸(::before)을 둬 좌우가 대칭.
   되돌리기 같은 동작 버튼이 있는 알림은 글자 칸이 좁아지지 않게 빈칸 없이 글자 칸 안에서 가운데 */
.toast::before{content:"";flex:none;width:44px}
.toast .t-msg{flex:1;min-width:0;text-align:center;padding:8px 4px}
.toast .t-btns{display:flex;flex:none}
.toast.has-act::before{display:none}
.toast.has-act{padding-left:12px}
.toast button{flex:none;min-height:44px;min-width:44px;border:0;background:transparent;color:inherit;font:inherit;font-weight:600;padding:0 8px;border-radius:12px}
.toast button.t-act{text-decoration:underline;text-underline-offset:3px}
.toast button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.toast.out{opacity:0}
.toasts.top{top:calc(env(safe-area-inset-top,0px) + 10px);bottom:auto}   /* v1.11.0 L4: 끼니 버튼 위를 가리지 않게 */
.fg-h .fg-n{white-space:nowrap}   /* v1.11.0 L2 */
.low-t{color:var(--warn-ink,var(--ink));font-size:0.75rem;font-weight:600}   /* v1.11.0 A-15 */
.gloss-all summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
/* v1.11.0 R-23: summary를 flex로 바꾸면 기본 펼침 삼각형이 사라지므로 오른쪽에 펼침 화살표를 그린다(열리면 위로) */
.why-more>summary::after,.qa-ev>summary::after,.rcard details>summary::after,.gloss-all>summary::after,.oss>summary::after{content:"";flex:0 0 auto;width:8px;height:8px;margin:0 8px 0 auto;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .15s}
.why-more[open]>summary::after,.qa-ev[open]>summary::after,.rcard details[open]>summary::after,.gloss-all[open]>summary::after,.oss[open]>summary::after{transform:translateY(2px) rotate(-135deg)}
@media (prefers-reduced-motion: reduce){.why-more>summary::after,.qa-ev>summary::after,.rcard details>summary::after,.gloss-all>summary::after,.oss>summary::after{transition:none}}
.oss>summary{font-size:0.8125rem;color:var(--accent-deep);min-height:44px;display:flex;align-items:center;cursor:pointer}.oss-txt{white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:8px 12px;max-height:50vh;overflow:auto;margin:4px 0 0}   /* v1.11.0 R-18 */   /* v1.11.0 U-2: 용어 풀이 모음 */
.gloss-dl{margin:8px 0 0}.gloss-dl dt{font-weight:600;margin-top:8px}.gloss-dl dd{margin:2px 0 0;color:var(--muted);font-size:0.875rem}
/* v1.9.0 F-9: 화면이 막 바뀐 직후 같은 자리 버튼은 잠깐 비활성으로 보인다(연타로 다음 화면 버튼이 눌리지 않게) */
.cool{opacity:.45!important;transition:opacity .15s}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.progress{font-size:0.8125rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:600}

/* report (pdf) */
#report{position:fixed;left:-10000px;top:0;width:760px;background:#fff;color:#111;font-family:var(--body);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
#report .blk{padding:16px 34px}
#report h1{font-family:var(--display);font-size:25px;margin:0 0 4px}
#report h2{font-size:15.5px;font-family:var(--body);font-weight:700;color:#12305E;margin:0 0 10px;padding:0 0 0 10px;border-left:4px solid #2F6FED;border-bottom:0;line-height:1.3}
#report .cover{border:1px solid #111;border-radius:12px;padding:18px 20px;background:#fff}   /* 진료기록 시안 v7 */
#report .cover .meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12.5px;color:#333}
#report .cover .meta b{color:#12305E}
#report table{font-size:12px;width:100%;border-collapse:collapse;border:1px solid #D7DEE9;border-radius:8px;overflow:hidden}
#report th,#report td{border-bottom:1px solid #E2E7EF;white-space:normal;color:#111;padding:6px 8px;vertical-align:top}
#report tbody tr:nth-child(even) td{background:#FAFBFD}
#report tbody tr:last-child td,#report tbody tr:last-child th{border-bottom:0}
#report thead th{background:#EAF0FA;color:#12305E;font-weight:700;border-bottom:1px solid #C9D6EA;text-align:left}
#report tbody th{background:#F2F5FA;color:#12305E;font-weight:600;text-align:left;width:26%}
#report td.n{text-align:right;font-variant-numeric:tabular-nums}
#report th.n{text-align:right}
#report .note{font-size:11px;color:#555;margin-top:6px}
#report table.fx{table-layout:fixed}
#report .nw{white-space:nowrap}
#report h3{font-size:14px;margin:4px 0 6px;color:#111}   /* 22차: 음식 이름 */
#report :is(b,strong,h1,h3,h4),#printDoc :is(b,strong,h1,h3,h4){font-weight:700}   /* 17차: 화면 굵기를 600으로 낮춰도 PDF·인쇄는 그대로 */
/* v1.9.0 F-2 글자 PDF(인쇄): 화면에서는 숨기고, 인쇄할 때만 PDF 문서만 보인다 */
#printDoc{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  html,body{background:#fff!important}
  body{padding:0!important;min-height:0!important}
  body>*:not(#printDoc){display:none!important}
  #printDoc{display:block!important;color:#111;font-family:var(--body);font-size:10.5pt;line-height:1.55;word-break:keep-all;overflow-wrap:break-word}
  #printDoc .blk{padding:0 0 10pt}
  #printDoc .blk:not(:has(table)){break-inside:avoid}   /* 제목만 쪽 끝에 남지 않게(표가 없는 짧은 블록은 통째로). 표 블록은 행 단위로 이어짐 */
  #printDoc h1{font-size:18pt;margin:0 0 4pt}
  #printDoc h2{font-size:12pt;font-family:var(--body);font-weight:700;color:#12305E;margin:0 0 6pt;padding:0 0 0 8px;border-left:4px solid #2F6FED;break-after:avoid}
  #printDoc .cover{border:1px solid #111;border-radius:10pt;padding:12pt 14pt;background:#fff}   /* 진료기록 시안 v7 */
  #printDoc .cover .meta{display:flex;flex-wrap:wrap;gap:4pt 14pt;margin-top:8pt;font-size:9.5pt}
  #printDoc .cover .meta b{color:#12305E}
  #printDoc table{width:100%;border-collapse:collapse;font-size:9pt;border:1px solid #D7DEE9}
  #printDoc th,#printDoc td{border-bottom:1px solid #E2E7EF;padding:4pt 6pt;text-align:left;vertical-align:top;white-space:normal;color:#111}
  #printDoc thead{display:table-header-group}
  #printDoc thead th{background:#EAF0FA;color:#12305E;font-weight:700}
  #printDoc tbody th{background:#F2F5FA;color:#12305E;font-weight:600;width:26%}
  #printDoc tr{break-inside:avoid}
  #printDoc td.n,#printDoc th.n{text-align:right}
  #printDoc .note{font-size:8.5pt;color:#555;margin-top:4pt}
  #printDoc .nw{white-space:nowrap}
  #printDoc table.fx{table-layout:fixed}
  #printDoc h3{font-size:11pt;margin:2pt 0 4pt;break-after:avoid}
  #printDoc .foot{font-size:8pt;color:#666;margin-top:8pt}
}
/* ===== v1.11.0 디자인 A '잔잔한 능선' · 맑은 파랑 — 부품 모양 =====
   참고(세션 조사): 파노라(레드닷 2026, 능선 그래프), Gentler Streak(애플 디자인 어워드 2024, 범위 띠·다정한 문장), Harvee(애플 디자인 어워드 2026 후보, 상태를 말로)
   원칙: 그림자·테두리 대신 바탕색 차이, 버튼은 알약 모양, 카드 모서리 22px, 판정은 색 + ●▲■✕ 모양 */
body{-webkit-font-smoothing:antialiased}
.appbar{box-shadow:none;background:var(--bg)}
.card,.list,.fgrid,.bigact,.sumline,.day,.searchbar{box-shadow:none}
.card{border-radius:var(--r)}
.list{border-radius:var(--r)}
.fgrid{border-radius:var(--r)}
.btn{border:0;background:var(--surface-2);color:var(--ink);border-radius:999px;min-height:46px;padding:8px 16px;font-weight:600}
.btn>.ic{vertical-align:middle}.btn:has(>.ic){display:inline-flex;align-items:center;justify-content:center;gap:8px}   /* v1.11.0 R-09: 아이콘이 글자보다 위로 뜨지 않게 */
.btn.sm{min-height:44px;padding:8px 16px;border-radius:999px}
.btn.primary,.btn.dark,.btn.eat{background:var(--fill);color:var(--fill-ink)}
.btn.ghost{background:transparent;color:var(--accent-deep)}
.btn.danger{background:var(--danger-fill);color:#fff}
.card .btn:not(.primary):not(.ghost):not(.danger),.sheet .btn:not(.primary):not(.ghost):not(.danger){background:var(--surface-2)}
.banner{border-radius:12px;border-color:transparent}
.banner.crit{border-color:var(--crit)}
.segctl{background:var(--field);border-radius:12px}
.segctl button{border-radius:12px;font-weight:600}
.segctl button[aria-pressed="true"]{box-shadow:none;font-weight:600}
.searchbar{border:0;border-radius:12px;min-height:52px;background:var(--surface)}
.chip{border-radius:999px}
.fic{border-radius:12px}
.t-food{background:var(--food-tint);color:var(--accent)!important}
.pill{font-weight:600}
.tabs{border-top:0;background:var(--surface)}
.tab[aria-current="page"],.tab.on{color:var(--accent)}
.sheet{border-radius:12px 12px 0 0}
.mate{border:0;background:var(--accent-soft);color:var(--ink)}
.mate.on{background:var(--fill);color:var(--fill-ink)}
.mate.on svg{color:var(--fill-ink)}
.mwrap{border-top-color:var(--line)}
.sec-title h2,.fgroup :is(h2,h3).fg-h{font-size:1.0625rem;font-weight:600;letter-spacing:-.01em}
:is(h1,h2,h3,h4) :is(.pill,.hint,small){letter-spacing:0}   /* 17차: 16px보다 작은 글씨는 자간을 좁히지 않음. 2026-10-25 5차: 제목의 좁은 자간(-0.34px)이 13px 작은 글씨(좋음·1,236개)까지 물려 빽빽하던 것 → 본문 자간 */
.tasks .tk-n{background:transparent;box-shadow:inset 0 0 0 2.5px var(--line-strong);color:transparent;width:26px;height:26px;border-radius:50%;font-size:0}
.tasks .is-done .tk-n{background:var(--fill);box-shadow:none;color:var(--fill-ink)}
.tasks .tk-n svg{width:16px;height:16px}
.tasks .tk-n.part{background:conic-gradient(var(--accent) 0 var(--p,0%),transparent 0)}
/* 홈 맨 위 상태 띠: 오늘 상태 한 문장 + 최근 2주 증상 점수 능선 + 기록 버튼 */
.ridge{background:var(--field);border-radius:12px;padding:16px 16px 16px;margin:2px 0 4px;color:var(--ink)}
.ridge .r-top{display:flex;align-items:center;gap:8px 8px;justify-content:space-between;flex-wrap:wrap}   /* v1.11.0 R-24: 좁으면 칩이 날짜 아래 줄로 */
.ridge .r-date{font-size:0.8125rem;color:var(--muted);margin:0;white-space:nowrap}
.ridge .r-stage{display:inline-flex;align-items:baseline;flex-wrap:wrap;gap:0 8px;max-width:100%;min-height:44px;padding:0;border:0;border-radius:0;background:none;color:inherit;font:inherit;letter-spacing:inherit;text-align:left;cursor:pointer}   /* 28차(사용자 요청): 홈 맨 위 '현재 식단 단계: 저잔사식'(누르면 식단 단계 화면) */
.ridge .r-lab{font-family:var(--body);font-size:1rem;letter-spacing:0}
.ridge .r-stage .chev{width:20px;height:20px;align-self:center}
.ridge .r-head{font-family:var(--display);font-size:1.75rem;font-weight:600;letter-spacing:-.035em;line-height:1.25;margin:8px 0 0}
.ridge .r-sub{font-size:0.9375rem;margin:4px 0 0}
.ridge .r-chart{display:block;width:100%;height:auto;margin:12px 0 4px;overflow:visible}
.ridge .r-chart .area{fill:var(--ridge-area)}
.ridge .r-chart .line{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ridge .r-chart .dot{fill:var(--accent);stroke:var(--field);stroke-width:3}
.ridge .r-chart .qdot{fill:var(--field);stroke:var(--accent);stroke-width:2}
.ridge .r-chart text{font-family:var(--body);font-size:12px;fill:var(--muted)}
.ridge .r-chart .bl{font-size:12px;fill:var(--accent-deep);font-weight:600;paint-order:stroke;stroke:var(--field);stroke-width:4px;stroke-linejoin:round}   /* v1.11.0 R-20 */
.ridge .r-chart .r-empty{font-size:13px;fill:var(--muted)}
.ridge .r-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ridge .r-btns .btn{flex:1 1 auto;min-height:46px}
.ridge .r-btns .btn.primary{flex:1 1 100%}
.ridge .r-btns .btn:not(.primary){background:var(--surface);color:var(--ink)}
.ridge .r-note{font-size:0.8125rem;color:var(--muted);margin:8px 0 0}
/* ===== v1.12.0 후속 디자인 '바다'(밝게)·'한밤'(어둡게) — 사용자 확정 시안(2026-10-19) =====
   제목 막대와 홈 상태 띠를 짙은 머리 띠 한 덩어리로 잇고(--band), 바로 아래 오늘 끼니를 큰 글자 카드로. 판정 색·모양은 그대로 */
.appbar{background:var(--band-top);color:var(--band-ink);box-shadow:none}
.appbar .logo{color:var(--logo)}
.appbar .icon-btn{color:var(--band-ink)}
.appbar .icon-btn:active{background:var(--band-glass)}
.appbar .bar-btn{min-height:44px;padding:0 12px;border:0;border-radius:999px;background:var(--band-glass);color:var(--band-ink);font-family:inherit;font-size:0.8125rem;font-weight:600;cursor:pointer;flex:0 0 auto}   /* 29차: 홈 오른쪽 위 '사용 방법' */
.howto .peb-badge .ic{width:22px;height:22px;color:var(--accent)}
.appbar :focus-visible,.ridge :focus-visible{outline-color:var(--band-ink)}
.ridge{background:var(--band);color:var(--band-ink);border-radius:0;margin:0 -16px 16px;padding:4px 16px 16px}
.view>.ridge:first-child{margin-top:-12px}   /* 제목 막대와 틈 없이 잇기(.view 위 여백만큼) */
.ridge .r-date,.ridge .r-sub,.ridge .r-note{color:var(--band-ink2)}
.ridge .r-lab{color:var(--band-ink2)}
.ridge .r-stage .chev{color:var(--band-ink2)}
.ridge .r-chart .bdot{fill:var(--band-thr);stroke:var(--band-bot);stroke-width:2}   /* 22차: 혈변이 있던 날 */
.ridge .r-chart .line{stroke:var(--band-line)}
.ridge .r-chart .dot{fill:var(--band-pop);stroke:var(--band-bot)}
.ridge .r-chart .qdot{fill:var(--band-bot);stroke:var(--band-line)}
.ridge .r-chart text,.ridge .r-chart .r-empty{fill:var(--band-ink2)}
.ridge .r-chart .bl{fill:var(--band-thr);stroke:var(--band-bot)}
.ridge .r-btns .btn:not(.primary){background:var(--band-glass);color:var(--band-ink)}
.ridge .r-btns .btn.primary{background:var(--band-btn);color:var(--band-btn-ink)}
.tabs{background:var(--tabbar);border-top:1px solid var(--line)}
.tab[aria-current="page"],.tab.on{background:var(--accent-soft);color:var(--accent)}
#meals h2{font-size:1.375rem}
.list.meals{background:transparent;overflow:visible;display:flex;flex-direction:column;gap:8px}
.list.meals>.mwrap{background:var(--card);border:0;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
.list.meals .mrow b{font-size:1.25rem;font-weight:600;letter-spacing:-.02em;line-height:1.3}
/* 음식 정보: 세 칸 요약, 차분한 회색 상자, FODMAP 띠 */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0 2px}
.facts>div{background:var(--surface-2);border-radius:12px;padding:8px 12px;min-width:0}
.facts small{display:block;font-size:0.75rem;color:var(--muted)}
.facts b{display:block;font-size:1.0625rem;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.why-card{background:var(--surface-2)}
.why-card b{color:var(--ink)}
.fsv>div{background:var(--surface);border-radius:12px}
.why-card .fsv>div{box-shadow:none}
.fsv .lo:not(.na){background:var(--ok-soft);color:var(--ok-ink)}.fsv .lo:not(.na) b,.fsv .lo:not(.na) small{color:var(--ok-ink)}
.fsv .na{color:var(--muted)}
.fsv .mid{box-shadow:inset 0 3px 0 var(--warn-fill)}.fsv .hi{box-shadow:inset 0 3px 0 var(--avoid)}
a.lrow,a.lrow b,a.lrow small{text-decoration:none}
.card a:not(.btn):not(.lrow),.hint a,.info-body a,.banner a{color:var(--accent-deep);text-underline-offset:3px}
/* v1.10.0 PC(넓은 화면): PC 전용 화면을 따로 만들지 않고, 휴대폰과 같은 화면을 가운데 휴대폰 너비로 보인다(사용자 요청).
   고정 위치 요소(메뉴·아래 버튼·알림·시트·+버튼)도 같은 너비 안에 둔다 */
:root{--phone:640px}   /* 사용자가 보여 준 예시(PC에서 연 휴대폰 앱)처럼 가운데 640px 세로 띠 */
@media (min-width:700px){
  html{background:var(--pc-bg)}
  body{width:var(--phone);margin:0 auto;min-height:100vh;box-shadow:0 0 0 1px var(--line)}
  .wrap{max-width:none}
  .tabs,.toasts,#errbar,body.pushed .bottom-bar,body.welcome .bottom-bar{left:calc(50% - var(--phone)/2);right:calc(50% - var(--phone)/2);max-width:none}
  .tabs-in{max-width:none}
  .fab{right:calc(50% - var(--phone)/2 + 20px)}
  .sheet{max-width:var(--phone)}
  .plan-note,.hint,.card{word-break:keep-all}
}
/* ===== v1.13.0 17차 화면 다듬기: unslop by Damir Sokolovsky (@heydamir), CC BY 4.0 =====
   방향: 차분함·정확함·조금 다정함. 굵기는 600까지(크기와 색으로 위계), 여백은 4px 단계, 아이콘은 글씨 색, 색은 뜻이 있을 때만 */
b,strong{font-weight:600}
h1,h2,h3,h4,th{font-weight:600}
.today-card>.kv{margin:-8px 0 0}
.tipbox p{margin:0} .tipbox p+p{margin-top:4px} .tipbox:has(>p){padding-right:0} .tipbox>p:first-child{padding-right:32px}   /* 닫기 ×는 첫 문단 옆에만 자리 */
.kv-list{margin:8px 0 0} .kv-list .kv b{font-weight:600}
.sdots{display:inline-flex;flex:none;gap:4px;margin-right:8px;vertical-align:1px}
.sdots i{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor}
.sdots i.on{background:currentColor}
.stn{white-space:nowrap}   /* 단계 눈금과 식사 이름은 함께(눈금만 윗줄에 남지 않게) */

/* ===== 24차(v1.13.0, 2026-11-17): AI 기본 모양 덜기·처음 쓰는 환자(진단 14가지) =====
   모서리는 8·12px·알약·원 네 가지로(위 규칙의 값을 바꿈), 화면 제목 20px·하위 화면 제목 막대 16px(1.25배 이상),
   입력칸 안내 글자는 --muted(대비 4.5:1 이상), 음식 그림 칸 없앰, 음식 상세는 판정 이유 먼저·숫자는 칸 없이 */
::placeholder{color:var(--muted);opacity:1}
body.pushed .appbar h1{font-size:1rem}
.sec-title h2,.fgroup :is(h2,h3).fg-h{font-size:1.25rem}
.chkrow{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;background:var(--card);border-radius:12px;font-weight:600;cursor:pointer}
.chkrow input{width:24px;height:24px;margin:0;flex:none;accent-color:var(--fill)}
.consent-hint{margin:0 4px;text-align:center}
.restore-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 4px}
.onb-note{margin:0 4px}
.f-err{display:block;margin-top:4px;color:var(--crit);font-size:0.8125rem;font-weight:600}
input[aria-invalid="true"]{border-color:var(--crit)!important;box-shadow:0 0 0 1px var(--crit)}
.empty-state{display:flex;flex-direction:column;gap:8px;padding:16px 4px;text-align:left}
.intro-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.intro-list li{display:grid;grid-template-columns:5.5em 1fr;gap:8px;line-height:1.5}
.intro-list b{font-weight:600}
/* 27차(사용자 결정, 시안 C): 첫 화면 맨 아래 판 위로 달이가 내다본다(조약돌 탭과 같은 구도). 확인 칸과 '시작하기'는 판 안에 두고 화면 아래에 붙이지 않는다 */
.intro-dock{margin:8px -16px 0;display:flex;flex-direction:column;align-items:center}
.intro-dock .dari-n{position:relative;width:156px;aspect-ratio:400/369;margin-bottom:-32px}
.intro-cap{position:relative;z-index:1;display:block;width:100%;height:40px;margin-bottom:-1px}
.intro-cap path{fill:var(--card)}
.intro-panel{position:relative;z-index:1;align-self:stretch;background:var(--card);padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.intro-panel h2{margin:0 0 4px;font-size:1rem;text-align:center}
.intro-panel .chkrow{background:var(--surface-2)}
.intro-panel .btn{padding:16px;font-size:0.9375rem;border-radius:12px}
body.welcome:has(.intro-dock){padding-block-end:0}   /* 아래에 붙은 단추가 없으니 그 자리 여백도 없앤다 */
.empty-state p{margin:0;color:var(--muted);font-size:0.875rem;line-height:1.6}
body.welcome{padding-block-end:max(110px,calc(var(--bbh,0px) + 16px))}
.why-top{margin:12px 0 0;font-size:0.9375rem;font-weight:600;line-height:1.55}
.why-top p{margin:0}
.why-top ul{margin:0;padding-left:1.2em}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;margin:12px 0 4px}
.facts>div{background:none;border-radius:0;padding:0}
.facts small{display:inline;margin-right:4px}
.facts b{display:inline;font-size:0.9375rem}
.why-more{background:none;border-radius:0;padding:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.nutgrid{grid-template-columns:1fr 1fr;gap:0 16px}
.nutgrid div{background:none;border-radius:0;padding:8px 0;border-bottom:1px solid var(--line);flex-direction:row-reverse;justify-content:space-between;align-items:baseline}
.alt-chip{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0;background:none}
/* 화면 덩어리 사이 간격은 8(제목과 그 내용)·16(덩어리)·24(묶음 사이) 세 가지 */
.sec-title{margin-bottom:-8px}
.view>.ridge{margin-bottom:8px}
.sumline{margin-bottom:0}
/* ===== 조약돌 탭(v1.13.0 25차, 결정 57): 강을 따라 30칸, 아래 판 위로 수달 '달이'가 내다본다. 그림은 앱 안의 WebP(DARI, pebCss)
   모서리는 8·12px·알약·원, 간격은 4px 단계(결정 49·54). 판 위 둥근 언덕은 모서리가 아니라 그림(peb-cap)이다 ===== */
.peb{display:flex;flex-direction:column;gap:16px;min-height:calc(100vh - 196px);min-height:calc(100dvh - 196px)}
.peb-sum{display:flex;align-items:center;gap:12px;padding:12px 16px}
.peb-sum b,.peb-steps b,.peb-stage b{display:block;font-size:0.9375rem;font-weight:600}
.peb-sum small,.peb-steps small,.peb-stage small{display:block;font-size:0.8125rem;color:var(--muted);line-height:1.45}
.peb-ic,.peb-img,.dari{display:block;flex:none;background-position:center;background-size:contain;background-repeat:no-repeat}   /* 그림 주소는 pebCss가 넣으므로 background 묶음 속성으로 지우지 않게 */
.peb-ic{width:44px;aspect-ratio:168/121}
.peb-ic.peb-big{width:92px}
.peb-badge{width:48px;height:48px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.peb-badge .peb-ic{width:36px}
.peb-lap{display:flex;align-items:center;justify-content:space-between;gap:8px}
.peb-lap b{font-size:1rem;font-weight:600}
.peb-lap .icon-btn{width:44px;height:44px;background:var(--surface)}
.peb-lap .icon-btn:disabled{opacity:.45}
.peb-cnt{margin-left:8px;padding:4px 12px;border-radius:999px;background:var(--surface);color:var(--on-soft);font-size:0.8125rem;font-weight:600}
.peb-river{position:relative;width:100%;aspect-ratio:390/315}
.peb-river>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.peb-river .peb-rv{fill:none;stroke:var(--peb-river);stroke-width:24;stroke-linecap:round;stroke-linejoin:round}
.peb-river .peb-rv.pt-on{stroke:var(--peb-on)}
.peb-river .peb-rv.pt-dot{stroke:var(--peb-dash);stroke-width:2;stroke-dasharray:2 10}
.peb-slot{position:absolute;width:10.77%;aspect-ratio:168/121;transform:translate(-50%,-50%);display:grid;place-items:center}
.peb-img{position:relative;width:100%;height:100%}
.peb-off::before{content:"";position:absolute;inset:6% 4%;border:2px dashed var(--line-strong);border-radius:50%;background:var(--peb-empty)}
.peb-no{position:relative;font-style:normal;font-size:0.75rem;color:var(--muted)}
.peb-mark::before,.peb-today::before,.peb-next::before{content:"";position:absolute;inset:-22% -18%;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.peb-today::before{border:2px dashed var(--accent);opacity:.95}
.peb-next::before{border:2px dashed var(--ok);background:var(--peb-empty)}
.peb-next .peb-img{opacity:.55}
.peb-dots{position:relative;display:flex;gap:4px;font-style:normal}
.peb-dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--accent);background:var(--surface)}
.peb-dots i.pt-eat{background:var(--accent)}
.peb-lb{position:absolute;top:calc(122% + 2px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:0.75rem;line-height:1;font-weight:600;color:var(--on-soft)}   /* 37차: 둘레(위 ::before, 아래로 22%) 바로 밑. 둘레는 화면 너비를 따라 커지므로 같은 %로 따라간다 */
.peb-lb.pt-nx{color:var(--ok-ink)}
.pt-er .peb-lb{transform:translateX(calc(-100% + 12px))}   /* 37차: 강이 굽는 줄 끝 칸은 글씨를 안쪽으로 비켜 굽은 강 가운데 점선을 피한다 */
.pt-el .peb-lb{transform:translateX(-12px)}
.peb-spk{position:absolute;left:-14%;top:-30%;width:28%;fill:#FFD97A;stroke:#B88200;stroke-width:.8}
.peb-next .peb-spk{left:36%;top:22%}
.peb-dock{margin:auto -16px -112px;display:flex;flex-direction:column;align-items:center}
.peb-dock .dari-n{position:relative;width:clamp(150px,44vw,190px);aspect-ratio:400/369;margin-bottom:-32px}
.peb-cap{position:relative;z-index:1;display:block;width:100%;height:36px;margin-bottom:-1px}
.peb-cap path{fill:var(--surface)}
.peb-panel{position:relative;z-index:1;align-self:stretch;background:var(--surface);padding:0 16px calc(76px + env(safe-area-inset-bottom,0px))}
.peb-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.peb-head h2{margin:0;font-size:1rem;font-weight:600}
.peb-more{min-height:44px;padding:0 16px;border-radius:999px;font-size:0.875rem;font-weight:600}
.peb-now{display:flex;align-items:center;gap:12px;margin-top:8px}
.peb-bar{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.peb-bt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.peb-bt b{font-size:0.9375rem;font-weight:600}
.peb-bt .pt-n{font-size:0.75rem;color:var(--muted)}
.peb-prog{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.peb-prog i{display:block;height:100%;border-radius:999px;background:var(--fill)}
.peb-art{display:flex;justify-content:center;margin:-8px 0 8px}
.peb-art .dari-w{width:150px;aspect-ratio:380/419}
.peb-art .dari-h{width:200px;aspect-ratio:440/376}
.peb-art .dari-n{width:120px;aspect-ratio:400/369}
.peb-art .dari-c{width:168px}
.peb-c{text-align:center}
.peb-steps,.peb-stages{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:12px}
.peb-steps li{display:flex;align-items:center;gap:12px}
/* 분류 변경(음식 정보) */
.mv-box{display:flex;flex-direction:column;gap:8px;margin:12px 0;padding:12px;border-radius:12px;background:var(--surface-2)}
.mv-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:0.875rem;font-weight:600;margin:0}
.mv-h .hint{font-weight:400;margin:0}
.mv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mv-grid button{min-height:52px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 8px}
.mv-grid .pill{background:none;padding:0}
.mv-grid .pill.ban{color:var(--ban-bg)}
.mv-grid small{font-size:0.75rem;color:var(--muted)}
.mv-grid button[aria-pressed="true"]{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}
.mv-reset{border:0;background:none;color:var(--accent-deep);font-weight:600;font-size:0.875rem;min-height:44px;padding:0 8px}
.mine-tag{display:inline-flex;align-items:center;font-size:0.75rem;font-weight:600;color:var(--accent-deep);border:1px solid var(--accent);border-radius:999px;padding:2px 8px;margin-left:4px;vertical-align:middle}
.app-line{font-size:0.8125rem;color:var(--muted);margin:4px 0 0}
.mine-m{font-weight:600;color:var(--accent-deep)}
.mv-box .btn:not(.primary){background:var(--surface)}
/* 설치 안내 그림: 실제 설치 창·브라우저 단추를 본떠 누를 곳(.ins-on)을 진하게 */
.ins-shot{position:relative;height:200px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);overflow:hidden}
.ins-lines{position:absolute;inset:16px 16px auto;display:flex;flex-direction:column;gap:8px}
.ins-lines i{display:block;height:8px;border-radius:4px;background:var(--line)}
.ins-lines i:nth-child(2){width:70%}
.ins-lines i:nth-child(3){width:85%}
.ins-top+.ins-lines{top:64px}
.ins-on{background:var(--fill);color:var(--fill-ink);outline:3px solid var(--accent);outline-offset:3px}
.ins-dlg{position:absolute;inset:auto 0 0;background:var(--surface);border-radius:12px 12px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -4px 16px rgba(0,0,0,.12)}
.ins-app{display:flex;align-items:center;gap:12px}
.ins-app .dari{width:48px;aspect-ratio:400/369;border-radius:12px;background-color:var(--surface-2)}
.ins-app small{display:block;color:var(--muted);font-size:0.75rem}
.ins-btns{display:flex;justify-content:flex-end;gap:8px;font-size:0.875rem;font-weight:600}
.ins-btns span{padding:8px 16px;border-radius:999px}
.ins-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ins-pair .ins-shot{height:148px}
.ins-cap{font-size:0.8125rem;font-weight:600;margin:0 0 4px}
.ins-bar,.ins-top{position:absolute;left:0;right:0;height:48px;background:var(--surface);display:flex;align-items:center;color:var(--muted)}
.ins-bar{bottom:0;border-top:1px solid var(--line);justify-content:space-around}
.ins-top{top:0;border-bottom:1px solid var(--line);gap:8px;padding:0 8px}
.ins-url{flex:1;height:28px;border-radius:999px;background:var(--surface-2)}
.ins-bar .ic,.ins-top .ic{width:20px;height:20px}
.ins-bar .ins-on,.ins-top .ins-on{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;outline-offset:2px}
.ins-list{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:12px 12px 0 0;display:flex;flex-direction:column;font-size:0.75rem}
.ins-list span{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:8px 12px;border-top:1px solid var(--line)}
.ins-list .ic{width:16px;height:16px}
.ins-list .ins-on{font-weight:600;outline:none}
.ins-menu{top:8px;right:8px;bottom:auto;left:24px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.12);overflow:hidden}
.ins-menu span:first-child{border-top:0}
.ins-note{background:var(--surface-2);border-radius:12px;padding:12px 16px;margin:0;font-size:0.875rem;line-height:1.5}
.peb-num{font-weight:600;color:var(--on-soft)}
.peb-row{display:flex;justify-content:space-between;gap:4px;background:var(--surface-2);border-radius:12px;padding:12px 8px;margin-bottom:16px}
.peb-row>span{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.peb-row small{font-size:0.75rem;color:var(--muted);white-space:nowrap}
.peb-stages{gap:8px}
.peb-stage{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 12px;border-radius:12px;background:var(--surface-2)}
.peb-stage .lt{flex:1;min-width:0}
.peb-stage[aria-current="step"]{background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent)}
.peb-tag{flex:none;display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:999px;font-size:0.75rem;font-weight:600;background:var(--accent-soft);color:var(--on-soft)}
.peb-tag .ic{width:14px;height:14px}
.peb-tag.pt-now{background:var(--fill);color:var(--fill-ink)}
.peb-tag.pt-done{background:var(--ok-soft);color:var(--ok-ink)}
.peb-lock{flex:none;width:32px;height:32px;display:grid;place-items:center;color:var(--muted)}
.peb-up{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0}
.peb-up>span{display:flex;flex-direction:column;align-items:center;gap:4px}
.peb-up small{font-size:0.75rem;color:var(--muted)}
.peb-up .pt-to small{font-size:0.8125rem;font-weight:600;color:var(--ok-ink)}
.peb-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}
/* 33차: 숫자 칸 쉼표 경고 창 */
.warnpop{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.warnpop-box{background:var(--card);color:var(--ink);border-radius:12px;padding:24px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:16px}
.warnpop-box h2{margin:0;font-size:1.125rem}
.warnpop-box p{margin:0;line-height:1.55}
