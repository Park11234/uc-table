<style>
@font-face{font-family:"UC Table Sans";src:url("fonts/uc-table-sans.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
:root{
  /* v1.11.0 디자인 A '잔잔한 능선' · 맑은 파랑(사용자 확정 2026-10-17): 바탕·카드·머리 띠·강조 한 가지 파랑, 그림자 없이 바탕색 차이로 구역 */
  --bg:#F5F7FB; --bg2:#F5F7FB; --surface:#FFFFFF; --card:#FFFFFF; --surface-2:#EEF2F8; --ink:#0E1A2E; --muted:#4B5A70; --line:#E6EBF2; --line-strong:#8693A6;
  --accent:#1F5EDB; --accent-deep:#1749B0; --accent-soft:#E8EFFF; --on-soft:#1749B0; --fill:#1F5EDB; --fill-ink:#FFFFFF; --accent-ink:#FFFFFF; --field:#E3ECFF;
  --deco:#1F5EDB; --deco-soft:#E8EFFF; --food-tint:#E8EFFF;
  --ok:#1F6E3D; --ok-soft:#E1F2E6; --ok-ink:#1F6E3D; --warn:#8A5200; --warn-soft:#FFEFD3; --warn-fill:#C27400; --warn-ink:#8A5200; --later:#4B5A70; --later-soft:#EDF1F7; --avoid:#A8261B; --avoid-soft:#FCE6E3; --ban-bg:#7A1B13; --ban-ink:#FFFFFF;
  --crit:#A8261B; --crit-soft:#FCE6E3; --crit-ink:#A8261B; --danger-fill:#A8261B;
  --shadow:none; --scrim:rgba(14,26,46,.42); --fab-shadow:none; --ridge-band:rgba(31,94,219,.10); --ridge-area:rgba(31,94,219,.16);
  /* v1.11.0 글꼴: Pretendard(OFL-1.1)를 앱 글자 + KS X 1001 한글로 줄여 이름을 바꾼 'UC Table Sans'를 앱 안에 넣어 웹·PWA·오프라인·안드로이드가 같은 모양 */
  --display:"UC Table Sans","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;
  --body:"UC Table Sans","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;
  /* v1.9.0 색 토큰: 하드코딩 색을 옮김(즐겨찾기 별, 근거 종류 칩) — 별은 흰 바탕 3.96:1 */
  --star:#A87700; --rt-s-bg:#E6F4EA; --rt-s-ink:#1E6B3A; --rt-h-bg:#FFF1E0; --rt-h-ink:#8A4B08; --rt-2-bg:#F1ECF8; --rt-2-ink:#5B3A8C; --pc-bg:#EDEEF0;
  --r:22px; color-scheme:light;
}
/* 화면 모드: 앱 설정(data-app-theme)이 뷰어 테마(data-theme)보다 우선 */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-app-theme="light"]){
  --bg:#0D131C; --bg2:#0D131C; --surface:#161E2A; --card:#161E2A; --surface-2:#1F2937; --ink:#E8EEF7; --muted:#A3B1C6; --line:#283446; --line-strong:#66768E;
  --accent:#84AAFF; --accent-deep:#AFC8FF; --accent-soft:#1C2B4A; --on-soft:#AFC8FF; --fill:#2E66DA; --fill-ink:#FFFFFF; --accent-ink:#FFFFFF; --field:#15233D;
  --deco:#84AAFF; --deco-soft:#1C2B4A; --food-tint:#1C2B4A;
  --ok:#62D695; --ok-soft:#12301F; --ok-ink:#62D695; --warn:#F3B85A; --warn-soft:#3A2A10; --warn-fill:#F3B85A; --warn-ink:#F3B85A; --later:#B0BCCD; --later-soft:#232D3B; --avoid:#FF8E80; --avoid-soft:#3D1A16; --ban-bg:#B3261E; --ban-ink:#FFFFFF;
  --crit:#FF8E80; --crit-soft:#3D1A16; --crit-ink:#FF8E80; --danger-fill:#C62839;
  --shadow:none; --scrim:rgba(0,0,0,.6); --fab-shadow:none; color-scheme:dark; --ridge-band:rgba(132,170,255,.12); --ridge-area:rgba(132,170,255,.20);
  --star:#F0B347; --rt-s-bg:#1E3A28; --rt-s-ink:#9FDDB2; --rt-h-bg:#3D2A12; --rt-h-ink:#F4C58A; --rt-2-bg:#2E2440; --rt-2-ink:#CDB8F0; --pc-bg:#06080B;
  }
}
:root[data-theme="dark"]:not([data-app-theme="light"]),:root[data-app-theme="dark"]{
  --bg:#0D131C; --bg2:#0D131C; --surface:#161E2A; --card:#161E2A; --surface-2:#1F2937; --ink:#E8EEF7; --muted:#A3B1C6; --line:#283446; --line-strong:#66768E;
  --accent:#84AAFF; --accent-deep:#AFC8FF; --accent-soft:#1C2B4A; --on-soft:#AFC8FF; --fill:#2E66DA; --fill-ink:#FFFFFF; --accent-ink:#FFFFFF; --field:#15233D;
  --deco:#84AAFF; --deco-soft:#1C2B4A; --food-tint:#1C2B4A;
  --ok:#62D695; --ok-soft:#12301F; --ok-ink:#62D695; --warn:#F3B85A; --warn-soft:#3A2A10; --warn-fill:#F3B85A; --warn-ink:#F3B85A; --later:#B0BCCD; --later-soft:#232D3B; --avoid:#FF8E80; --avoid-soft:#3D1A16; --ban-bg:#B3261E; --ban-ink:#FFFFFF;
  --crit:#FF8E80; --crit-soft:#3D1A16; --crit-ink:#FF8E80; --danger-fill:#C62839;
  --shadow:none; --scrim:rgba(0,0,0,.6); --fab-shadow:none; color-scheme:dark; --ridge-band:rgba(132,170,255,.12); --ridge-area:rgba(132,170,255,.20);
  --star:#F0B347; --rt-s-bg:#1E3A28; --rt-s-ink:#9FDDB2; --rt-h-bg:#3D2A12; --rt-h-ink:#F4C58A; --rt-2-bg:#2E2440; --rt-2-ink:#CDB8F0; --pc-bg:#06080B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.6;padding-inline:16px;padding-block:0 110px;min-height:100%}   /* v1.11.0 R-01: 기본 여백 8px이 실제 앱에만 남아 화면이 16px 넘치고 좌우가 좁았음 */
.wrap{max-width:560px;margin:0 auto}
.plan-note{display:flex;gap:6px;align-items:flex-start;margin:0 6px 14px}
.bc-cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3}
.bc-cam video{width:100%;height:100%;object-fit:cover;display:block}
.bc-cam i{position:absolute;left:10%;right:10%;top:50%;height:2px;background:#ff4d4d;box-shadow:0 0 8px #ff4d4d}
.why-sum{margin:12px 0 0;font-weight:600}
.why-more{margin:8px 0 10px;background:var(--surface-2);border-radius:14px;padding:4px 12px}
.why-more summary{min-height:44px;display:flex;align-items:center;font-size:0.8125rem;font-weight:700;color:var(--accent);cursor:pointer}
.why-more p{margin:0 0 10px;font-size:0.875rem}
.why-list{margin:0 0 8px;padding-left:18px;font-size:0.8125rem}
.fsize{display:block;margin-top:4px}
.alt-box{margin:4px 0 12px;display:flex;flex-direction:column;gap:6px}
.alt-row{display:flex;flex-direction:column;gap:6px}
.alt-chip{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 10px;min-height:48px;text-align:left;color:inherit}
.alt-chip span:nth-child(2){flex:1;min-width:0;font-weight:600;font-size:0.875rem}
.alt-chip .fic{width:34px;height:34px}
.plan-note .ic{width:16px;height:16px;margin-top:2px}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;align-items:center;gap:4px;min-height:58px;margin-inline:-16px;padding:6px 10px 6px 16px;background:var(--bg);box-shadow:0 1px 0 var(--line)} /* v1.9.0 D-11: 불투명 + 아래 구분선(본문이 비치지 않게) */
.appbar h1{font-family:var(--display);font-size:1.3125rem;font-weight:800;letter-spacing:-.02em}
/* v1.8.0 앱 이름 로고 */
.appbar h1.brand{display:flex;align-items:center;line-height:1}
.appbar .logo{display:block;color:var(--accent)}
.appbar .logo svg{display:block;height:24px;width:auto}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
body.pushed .appbar{padding-left:6px}
body.pushed .appbar h1{font-size:1.0625rem}
.grow{flex:1}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;flex:0 0 auto}
.icon-btn:active{background:var(--surface-2)}
.icon-btn.soft{background:var(--surface-2);color:var(--accent)}
.icon-btn:disabled{opacity:.35}
.tab span{line-height:1}
.hint{font-size:0.8125rem;color:var(--muted);margin:0}
.pad{padding:0 6px}
.sec-title h2{font-size:1.0625rem}
.sec-label{font-size:0.8125rem;font-weight:700;color:var(--muted);margin:6px 8px -6px;letter-spacing:.02em}
.hero .glass{border:1px solid var(--line);color:var(--ink);font-weight:600;font-family:var(--body)}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.lrow,.mrow,.hrow,.swrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:transparent;text-align:left;color:inherit;border-top:1px solid var(--line);min-height:62px;font:inherit}
.list>:first-child{border-top:0}
.list>input[hidden]+*{border-top:1px solid var(--line)}
.lt{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.35}
.lt b{font-size:0.9375rem;font-weight:700}
.lt small{font-size:0.8125rem;color:var(--muted)}
.lr{font-size:0.8125rem;color:var(--muted);white-space:nowrap}
.chev{width:18px;height:18px;color:var(--muted);opacity:.7}
.lic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;color:var(--accent)}
.lic .ic{width:21px;height:21px}
.t-warm{background:var(--deco-soft);color:var(--deco)!important} .t-coral{background:var(--avoid-soft);color:var(--avoid)!important} .t-rose{background:var(--accent-soft);color:var(--accent)!important} .t-food{background:var(--food-tint);color:var(--accent)!important} .t-sage{background:var(--deco-soft);color:var(--deco)!important} .t-plain{background:var(--surface-2);color:var(--ink)!important}
.fic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;flex:0 0 auto;color:var(--accent)}
.fic .ic{width:25px;height:25px;stroke-width:1.6}
.fic.lg{width:60px;height:60px;border-radius:18px} .fic.lg .ic{width:30px;height:30px}
.fic.xl{width:84px;height:84px;border-radius:26px} .fic.xl .ic{width:42px;height:42px;stroke-width:1.4}
.lrow,.mrow,.hrow,.fcard,.tile,.aicard,.bigact,.btn,.opts button{transition:transform .12s ease,background .15s,border-color .15s}
button.lrow:active,label.lrow:active,.mrow:active,.hrow:active,.fcard:active,.tile:active,.aicard:active,.bigact:active,.btn:active,.opts button:active{transform:scale(.98)}
.lrow.static{cursor:default}
.lrow:disabled{opacity:.5}
.lrow.danger b{color:var(--crit)}
.done{width:26px;height:26px;border-radius:50%;background:var(--fill);color:var(--fill-ink);display:grid;place-items:center;flex:0 0 auto}
.done .ic{width:15px;height:15px;stroke-width:2.6}
.mrow .slot{align-self:flex-start;margin-bottom:3px}
.refn{width:30px;height:30px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:0.8125rem;flex:0 0 auto}
.swrow{cursor:pointer}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--line-strong);position:relative;flex:0 0 auto;transition:background .2s;margin:0;cursor:pointer;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw:checked{background:var(--fill)}
.sw:checked::after{transform:translateX(20px)}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.aicard{display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:left;color:inherit;background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);font:inherit}
.aicard:disabled{opacity:.55}
.bigacts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigact{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);cursor:pointer}
.bigact .lic{width:48px;height:48px;border-radius:15px}
.bigact small{color:var(--muted);font-size:0.8125rem;margin-top:-6px}
.segctl{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.segctl button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px 4px;min-height:44px;font-weight:600;font-size:0.8438rem;color:var(--muted)}
.segctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(42,26,28,.12)}
.seg3{display:flex;gap:6px}
.seg3 button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 4px;min-height:44px;font-size:0.8438rem;font-weight:600}
.seg3 button[aria-pressed="true"]{background:var(--fill);border-color:var(--fill);color:var(--fill-ink)}
.seg3 button:disabled{opacity:.4}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:16px;padding:2px 14px;box-shadow:var(--shadow);color:var(--muted);border:1px solid var(--line-strong)}
.searchbar:focus-within{outline:2px solid var(--accent);outline-offset:2px} /* v1.9.0 A-8: 캐럿만 보이던 검색칸에 초점 표시 */
.searchbar input{background:transparent!important;border:0!important;padding:11px 0!important}
.bottom-bar{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:4;display:grid;gap:10px;padding-top:8px}
.bottom-bar.two{grid-template-columns:1fr 2fr}
.bottom-bar .btn{padding:15px;font-size:0.9375rem;border-radius:16px}
.bottom-bar .btn:not(.primary){background:var(--surface);box-shadow:var(--shadow);border-color:transparent}
.wz-progress{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.wz-progress i{display:block;height:100%;background:var(--fill);border-radius:9px;transition:width .3s}
.wz{display:flex;flex-direction:column;gap:14px;padding:12px 2px 6px;min-height:54vh}
.wz-q{font-family:var(--display);font-size:1.5625rem;font-weight:800;letter-spacing:-.02em;line-height:1.32}
.opts{display:flex;flex-direction:column;gap:10px}
.opts button{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:2px solid transparent;border-radius:18px;padding:17px 18px;font-size:1rem;font-weight:600;box-shadow:var(--shadow);text-align:left}
.opts .ck{opacity:0;color:var(--accent);width:20px;height:20px;stroke-width:2.6}
.opts .o-l{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}.opts .o-l small{font-weight:400;font-size:0.8125rem}   /* v1.11.0 R-04: 설명은 보기 글자 아래 줄 */
.opts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opts button[aria-pressed="true"] .ck{opacity:1}
.bigstep{display:flex;align-items:center;justify-content:center;gap:22px;padding:26px 0}
.bigstep button{width:66px;height:66px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:1.875rem;color:var(--accent)}
.bigstep output{font-family:var(--display);font-size:4.125rem;font-weight:800;min-width:110px;text-align:center;line-height:1}
.bigstep output small,.bignum small{font-size:1.125rem;color:var(--muted);margin-left:4px;font-weight:600}
.bignum{font-family:var(--display);font-size:4.125rem;font-weight:800;text-align:center;line-height:1;padding:20px 0 4px}
.big-input{font-size:1.125rem!important;padding:15px!important;background:var(--surface)!important;box-shadow:var(--shadow)}
.result{text-align:center;display:flex;flex-direction:column;gap:4px;align-items:stretch}
.result h2{font-family:var(--display);font-size:1.5rem;font-weight:800}
.result p{margin:0 0 8px}
.score{display:flex;flex-direction:column;align-items:center;justify-content:center;width:74px;height:74px;border-radius:50%;background:var(--accent-soft);flex:0 0 auto}
.score b{font-family:var(--display);font-size:1.75rem;font-weight:800;line-height:1}
.score small{font-size:0.75rem;color:var(--muted)}
.score.big{width:112px;height:112px;margin:4px auto 8px} .score.big b{font-size:2.75rem}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:0.875rem;text-align:left}
.kv span{color:var(--muted);flex:0 0 auto}
.kv b{text-align:right}
.today-card{display:flex;flex-direction:column;gap:14px}
.today-card h2{font-size:1.4375rem;font-family:var(--display);font-weight:800;margin-top:2px}
.hdate{width:44px;height:48px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;flex:0 0 auto}
.hdate b{font-family:var(--display);font-size:1.125rem} .hdate small{font-size:0.75rem;color:var(--muted)}
.chip-sc{min-width:34px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:0.875rem;padding:0 8px;font-family:var(--display)}
.chip-sc.s1{background:var(--crit-soft);color:var(--crit)} .chip-sc.s2{background:var(--warn-soft);color:var(--warn)} .chip-sc.s3{background:var(--ok-soft);color:var(--ok)}
.empty{padding:24px;text-align:center;color:var(--muted);font-size:0.875rem}
.center-head{align-items:center;text-align:center}
.center-head h2{font-family:var(--display);font-size:1.375rem;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);width:100%;gap:8px;margin-top:4px}
.stats div{background:var(--surface-2);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-size:1.1875rem;font-weight:800}
.stats small{font-size:0.75rem;color:var(--muted)}
.why-card{background:var(--accent-soft);box-shadow:none}
.why-card b{color:var(--accent);font-size:0.8125rem}
.why-card p{margin:4px 0 0;font-size:0.9375rem;line-height:1.7}
.why-card.inset{border-radius:16px;padding:12px 14px;margin:12px 0}
.rrow{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.rinfo{display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;color:inherit;padding:0;font:inherit}
.jrow{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.jrow p{margin:0;font-size:0.875rem}
.found{font-weight:700}
.tipline{color:var(--accent)!important}
.crit-t{color:var(--crit)!important;font-size:0.8125rem} .warn-t{color:var(--warn)!important;font-size:0.8125rem}
.preview{width:100%;max-height:240px;object-fit:contain;border-radius:14px;background:var(--surface-2)}
.preview.half{width:48%;height:130px}
.title-input{font-size:1.125rem!important;font-weight:700}

.hello h1{font-size:1.4375rem;font-weight:700;margin-top:2px}
.avatar{width:46px;height:46px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;flex:0 0 auto}
.avatar svg{width:22px;height:22px;stroke:var(--accent-deep);fill:none;stroke-width:1.8}
.brandline{font-size:0.8125rem;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:4px}
.stages{display:flex;gap:4px;margin-top:14px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.stage{flex:1;padding:7px 4px;border-radius:999px;text-align:center;font-size:0.8125rem;color:var(--muted);line-height:1.2}
.stage b{font-weight:700;margin-right:3px}
.stage.on{background:var(--fill);color:var(--fill-ink)}
.stage-note{margin:8px 4px 0;font-size:0.8125rem;color:var(--muted)}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:4px 8px env(safe-area-inset-bottom,0px)}
.tabs-in{display:flex;justify-content:space-between;gap:2px;max-width:560px;margin:0 auto}
.tab{flex:1;background:none;border:0;border-radius:12px;padding:8px 2px 6px;font-size:0.75rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"] svg{stroke-width:2.2}

section.view{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.flat{background:var(--surface-2);border-radius:16px;padding:12px 14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:6px 4px -4px}
.sec-title h2{font-size:1.125rem}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 16px;font-weight:600;font-size:0.875rem}
label.btn{display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}   /* 파일 고르기처럼 label로 만든 버튼도 글자를 가운데로 */
.btn.primary{background:var(--fill);border-color:var(--fill);color:var(--fill-ink)}
.btn.dark{background:var(--fill);border-color:var(--fill);color:var(--fill-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-deep)}
.btn.sm{padding:6px 12px;font-size:0.8125rem;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.full{width:100%}

.banner{border-radius:18px;padding:12px 14px;border:1px solid}
.banner.crit{background:var(--crit-soft);border-color:var(--crit);border-width:2px;color:var(--ink)}
.banner.urgent{background:var(--warn-soft);border-color:var(--warn,#E8A33D);border-width:2px;color:var(--ink)}
.banner.urgent strong{color:var(--warn-ink,#9A5B00)}
.banner{position:relative;z-index:1}
.banner .b-act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.banner .b-act .btn{min-height:44px;padding:0 14px}
.banner.crit strong{color:var(--crit)}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.info{background:var(--accent-soft);border-color:transparent}

/* hero summary */
.hero{color:var(--ink);padding:2px 0 0}
.cal-head{display:flex;align-items:baseline;gap:14px;margin-bottom:12px}
.cal-head b{font-family:var(--display);font-size:1.625rem;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.cal-head span{font-family:var(--display);font-size:0.9375rem;font-weight:600;color:var(--muted)}
.cal-head .glass{margin-left:auto}
.hero .days{gap:4px;justify-content:space-between}
.hero .day{background:transparent;box-shadow:none;color:var(--ink);width:auto;flex:1 0 44px;min-width:44px;border-radius:999px;padding:6px 0}
.hero .day span{color:var(--muted)}
.hero .day[aria-pressed="true"]{background:transparent;color:var(--accent-ink)}
.hero .day[aria-pressed="true"] span{color:var(--accent);opacity:1;font-weight:700}
.hero .day[aria-pressed="true"] b{background:var(--fill);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;margin:2px auto 0;color:var(--accent-ink)}
.hero .day b{width:36px;max-width:100%;aspect-ratio:1;height:auto;display:grid;place-items:center;margin:2px auto 0}
.overlap{position:relative}
.big-date{font-family:var(--display);font-size:1.5625rem;font-weight:800;letter-spacing:-.02em}
.big-date small{font-weight:600;color:var(--muted);font-size:0.9375rem;margin-left:4px}
.fab{position:fixed;right:20px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--fill);color:var(--fill-ink);box-shadow:var(--fab-shadow);display:grid;place-items:center;z-index:5}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.hero .muted,.hero .small{color:var(--muted)}
.hero-row{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:118px;height:118px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.15}
.ring .v b{font-family:var(--display);font-size:1.5rem;display:block}
.ring .v span{font-size:0.75rem;color:var(--muted)}
.ring .v b{color:var(--ink)}
.hbar{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;font-size:0.8125rem;padding-block:4px}
.hbar .t{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.hero .sub{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hero .sub h3{font-size:1rem;color:var(--ink)}
.hero .glass{background:var(--surface);border-radius:999px;padding:4px 12px;font-size:0.8125rem}

/* v1.9.0 D-3 오늘 할 일 */
.tasks{display:flex;flex-direction:column;gap:2px}
.task{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:10px 0;border-top:1px solid var(--line)}
.tasks>.row+.task{border-top:0}
.tk-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:800;font-size:.875rem;flex:none}
.tk-n .ic{width:16px;height:16px;stroke-width:2.6}
.task.is-done .tk-n{background:var(--ok-soft);color:var(--ok)}
.tk-main{display:flex;align-items:center;gap:12px;flex:1 1 12rem;min-width:0}
.tk-act{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;flex:0 1 auto;max-width:100%;justify-content:flex-end} /* v1.10.0 버튼이 셋이어도 큰 글자에서 줄바꿈 */
.tk-act .btn{white-space:nowrap}
.tk-act .btn.sm{min-height:44px}
/* quick tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:10px}
.tile{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:0.8125rem;color:var(--ink);padding:0}
.tile i{width:58px;height:58px;border-radius:18px;background:var(--surface);color:var(--accent);display:grid;place-items:center;font-style:normal;font-size:1.625rem}
.tile svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* day strip */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.day{flex:0 0 auto;width:52px;border:0;background:var(--surface);border-radius:18px;padding:9px 0;text-align:center;line-height:1.25;box-shadow:var(--shadow)}
.day b{display:block;font-size:1.125rem;font-family:var(--display)}
.day span{font-size:0.75rem;color:var(--muted);display:block}
.day[aria-pressed="true"]{background:var(--fill);color:var(--fill-ink)}
.day[aria-pressed="true"] span{color:inherit;opacity:.85}

/* meal cards */
.meal{display:grid;grid-template-columns:58px 1fr;gap:14px;background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.thumb{width:58px;height:58px;border-radius:18px;background:var(--food-tint);display:grid;place-items:center;font-size:1.75rem}
.meal:nth-of-type(3n+2) .thumb{background:var(--deco-soft)} .meal:nth-of-type(3n) .thumb{background:var(--accent-soft)}
.slot{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 9px;font-size:0.75rem;font-weight:700}
.meal h4{margin:6px 0 0;font-size:1.0312rem;font-weight:800;font-family:var(--display)}
.btn.eat{background:var(--fill);border-color:var(--fill);color:var(--fill-ink);font-weight:700}
.items{margin:4px 0 0;padding:0;list-style:none;font-size:0.8125rem;color:var(--muted)}
.items li{display:inline}
.items li+li::before{content:" · "}
.why{margin:10px 0 0;font-size:0.8438rem;background:var(--surface-2);border-radius:14px;padding:9px 11px}
.why b{color:var(--accent);font-size:0.8125rem;display:block;margin-bottom:1px}
sup.ref{font-size:0.75rem;color:var(--accent-deep);font-weight:700;cursor:pointer;margin-left:1px;padding:0 2px;background:var(--accent-soft);border-radius:6px}
.eaten{font-size:0.8125rem;color:var(--ok);font-weight:700}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:0.8125rem;font-weight:600;white-space:nowrap}
.today-card .qtag{margin-top:6px;white-space:normal}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.caution{background:var(--warn-soft);color:var(--warn)}
.pill.later{background:var(--later-soft);color:var(--later)}
.pill.avoid{background:var(--avoid-soft);color:var(--avoid)}
/* v1.9.0 절대 금지(아질산염 가공육 등): 진한 빨강 바탕에 흰 글자, X 모양 */
.pill.ban{background:var(--ban-bg);color:var(--ban-ink);font-weight:700}
.pill::before{content:"";width:9px;height:9px;flex:0 0 auto;background:currentColor}
.pill.ok::before{border-radius:50%}
.pill.caution::before{clip-path:polygon(50% 0,100% 100%,0 100%)}
.pill.later::before{border-radius:2px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.pill.avoid::before{clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.pill.ban::before{width:10px;height:10px;clip-path:polygon(20% 0,50% 30%,80% 0,100% 20%,70% 50%,100% 80%,80% 100%,50% 70%,20% 100%,0 80%,30% 50%,0 20%)}
.pill.neutral::before,.pill.info::before{display:none}
.pill.neutral{background:var(--accent-soft);color:var(--on-soft)}

/* forms */
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:0.8125rem;color:var(--muted);font-weight:500}   /* v1.11.0 R-02: '성별'(div.f)도 다른 칸 제목과 같게 */
input[type=text],input[type=number],input[type=date],input[type=search],input[type=time],input[type=email],input[type=password],input[type=tel],input[type=url],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:14px;padding:10px 13px;color:var(--ink);font-size:1rem}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:0.8125rem;min-width:44px}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--on-soft);border-color:var(--accent);font-weight:700}
.seg button:disabled{opacity:.4}
.q{display:flex;flex-direction:column;gap:7px;padding-block:12px;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q-t{font-weight:700;font-size:0.875rem}
.stepper{display:inline-flex;align-items:center;background:var(--surface-2);border-radius:14px;overflow:hidden}
.stepper button{border:0;background:transparent;width:44px;height:44px;font-size:1.25rem;color:var(--accent-deep)}
.stepper output{min-width:52px;text-align:center;font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent);height:44px;margin:0} /* v1.9.0 A-9: 슬라이더 높이 16px → 44px */
.check{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:0.875rem}
.check:first-child{border-top:0}
.check input{margin-top:2px;width:24px;height:24px;accent-color:var(--accent)}
.tagx{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:999px;padding:0 0 0 12px;font-size:0.8125rem}
.tagx button{border:0;background:none;width:44px;height:44px;border-radius:50%;color:var(--muted);font-size:1.125rem}

/* nutrition */
.meter{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:10px;font-size:0.8125rem;padding-block:7px}
.bar{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.low{background:var(--warn-fill)}
.cups{display:flex;flex-wrap:wrap;gap:8px}
.cup{width:44px;height:52px;border:2px solid var(--accent);border-radius:6px 6px 12px 12px;background:transparent;padding:0}
.cup.full{background:linear-gradient(to top,var(--accent) 80%,transparent 80%)}

/* food list rows (details) */
.food{display:flex;justify-content:space-between;gap:10px;padding-block:11px;border-top:1px solid var(--line)}
.food:first-child{border-top:0}
.food p{margin:2px 0 0;font-size:0.8125rem;color:var(--muted)}
.food .pill{flex-shrink:0;align-self:flex-start;margin-top:2px}

/* food grid */
.cats{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:2px} /* v1.9.0 D-8: 가로로 잘리던 칩을 줄바꿈 */
.cats .chip{flex:0 0 auto;white-space:nowrap}
.subnav{margin-top:0}
.subnav .stage{border:0;background:none;font-weight:600;font-size:0.8125rem}
.subnav .stage.on{background:var(--fill);color:var(--fill-ink)}
/* v1.10.0 디자인 4: 검색 결과는 한 줄 목록(그림·이름·종류와 1회 양·판정) */
.fgrid{display:flex;flex-direction:column;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.fcard{position:relative;text-align:left;border:0;background:transparent;padding:10px 14px;display:flex;flex-direction:row;align-items:center;gap:12px;min-width:0;min-height:60px;color:inherit}
.fcard+.fcard{border-top:1px solid var(--line)}
.fcard .lt{flex:1;min-width:0;display:flex;flex-direction:column}
.fcard .lt small{color:var(--muted);font-size:0.75rem;line-height:1.35}
.fcard .pill{flex:none;margin:0}
.ftools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ftools .chip{min-height:44px;display:inline-flex;align-items:center;gap:6px}
.ftools .chip .ic{width:16px;height:16px}
.ftools .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--on-soft);font-weight:700}
.fcard .thumb{width:50px;height:50px;font-size:1.5625rem;border-radius:16px}
.fcard:nth-child(4n+1) .thumb{background:var(--food-tint)} .fcard:nth-child(4n+2) .thumb{background:var(--deco-soft)} .fcard:nth-child(4n+3) .thumb{background:var(--accent-soft)} .fcard:nth-child(4n) .thumb{background:var(--surface-2)}
.fcard .chev{position:absolute;right:12px;bottom:14px;color:var(--muted);font-size:1.125rem;line-height:1}
.fcard b{font-size:0.875rem;line-height:1.35;overflow-wrap:anywhere}
.fcard .dot{position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%}
.dot.ok{background:var(--ok)} .dot.caution{background:var(--warn-fill)} .dot.later{background:var(--later)} .dot.avoid{background:var(--avoid)}

/* table */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:0.8125rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:500}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
/* v1.11.0 R-11: 시트 맨 끝 버튼 줄(닫기·오늘 먹었습니다 등)은 시트 아래에 붙여 내용을 내리지 않아도 보이게 */
/* v1.12.0 검토 C-18: :has()를 모르는 옛 브라우저가 규칙 전체를 버리지 않게, :has() 규칙과 넓은 버튼 규칙을 따로 둔다 */
.sheet>.grid2:last-child:has(>.btn){position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));z-index:1;background:var(--surface);margin-left:-18px;margin-right:-18px;margin-bottom:calc(-22px - env(safe-area-inset-bottom,0px));padding:12px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -1px 0 var(--line)}
.sheet>.btn.full:last-child{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));z-index:1;background:var(--surface);margin-left:-18px;margin-right:-18px;margin-bottom:calc(-22px - env(safe-area-inset-bottom,0px));padding:12px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -1px 0 var(--line);width:calc(100% + 36px)}
.refitem{padding-block:10px;border-top:1px solid var(--line);font-size:0.875rem}
.refitem:first-of-type{border-top:0}
.refitem .n{display:inline-block;min-width:28px;font-weight:700;color:var(--accent-deep)}
.refitem .cite{font-size:0.8125rem;color:var(--muted);margin-top:3px}
/* v1.9.0 D-6: 알림(토스트)은 아래 조작 영역을 가리지 않게 위쪽 전용 영역에 5초 동안. 누르거나 초점이 가면 멈춘다. 영역은 늘 있어(aria-live) 화면 읽기가 알림을 읽는다 */
/* v1.10.0 디자인 10: 알림은 아래쪽(메뉴 바로 위)에 띄워 화면 제목을 가리지 않는다. 메뉴가 없는 화면(설정·기록 마법사)은 화면 아래 버튼 위 */
.toasts{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);z-index:30;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
body.pushed .toasts,body.welcome .toasts{bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:4px;max-width:528px;background:var(--ink);color:var(--bg);padding:4px 4px 4px 16px;border-radius:16px;font-size:0.875rem;box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:1;transition:opacity .2s}
.toast .t-msg{flex:1;padding:8px 4px 8px 0}
.toast button{flex:none;min-height:44px;min-width:44px;border:0;background:transparent;color:inherit;font:inherit;font-weight:700;padding:0 10px;border-radius:12px}
.toast button.t-act{text-decoration:underline;text-underline-offset:3px}
.toast button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.toast.out{opacity:0}
.toasts.top{top:calc(env(safe-area-inset-top,0px) + 10px);bottom:auto}   /* v1.11.0 L4: 끼니 버튼 위를 가리지 않게 */
.fg-h .fg-n{white-space:nowrap}   /* v1.11.0 L2 */
.low-t{color:var(--warn-ink,var(--ink));font-size:0.75rem;font-weight:700}   /* v1.11.0 A-15 */
.gloss-all summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
/* v1.11.0 R-23: summary를 flex로 바꾸면 기본 펼침 삼각형이 사라지므로 오른쪽에 펼침 화살표를 그린다(열리면 위로) */
.why-more>summary::after,.qa-ev>summary::after,.rcard details>summary::after,.gloss-all>summary::after,.oss>summary::after{content:"";flex:0 0 auto;width:8px;height:8px;margin:0 6px 0 auto;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .15s}
.why-more[open]>summary::after,.qa-ev[open]>summary::after,.rcard details[open]>summary::after,.gloss-all[open]>summary::after,.oss[open]>summary::after{transform:translateY(2px) rotate(-135deg)}
@media (prefers-reduced-motion: reduce){.why-more>summary::after,.qa-ev>summary::after,.rcard details>summary::after,.gloss-all>summary::after,.oss>summary::after{transition:none}}
.oss>summary{font-size:0.8125rem;color:var(--accent-deep);min-height:44px;display:flex;align-items:center;cursor:pointer}.oss-txt{white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px;max-height:50vh;overflow:auto;margin:4px 0 0}   /* v1.11.0 R-18 */   /* v1.11.0 U-2: 용어 풀이 모음 */
.gloss-dl{margin:6px 0 0}.gloss-dl dt{font-weight:700;margin-top:10px}.gloss-dl dd{margin:2px 0 0;color:var(--muted);font-size:0.875rem}
/* v1.9.0 F-9: 화면이 막 바뀐 직후 같은 자리 버튼은 잠깐 비활성으로 보인다(연타로 다음 화면 버튼이 눌리지 않게) */
.cool{opacity:.45!important;transition:opacity .15s}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.progress{font-size:0.8125rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:700}

/* report (pdf) */
#report{position:fixed;left:-10000px;top:0;width:760px;background:#fff;color:#111;font-family:var(--body);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
#report .blk{padding:16px 34px}
#report h1{font-family:var(--display);font-size:25px;margin:0 0 4px}
#report h2{font-size:15.5px;font-family:var(--body);font-weight:700;color:#12305E;margin:0 0 10px;padding:0 0 0 10px;border-left:4px solid #2F6FED;border-bottom:0;line-height:1.3}
#report .cover{border:1px solid #D7DEE9;border-radius:10px;padding:18px 20px;background:#F7F9FC}
#report .cover .meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12.5px;color:#333}
#report .cover .meta b{color:#12305E}
#report table{font-size:12px;width:100%;border-collapse:collapse;border:1px solid #D7DEE9;border-radius:8px;overflow:hidden}
#report th,#report td{border-bottom:1px solid #E2E7EF;white-space:normal;color:#111;padding:6px 8px;vertical-align:top}
#report tbody tr:nth-child(even) td{background:#FAFBFD}
#report tbody tr:last-child td,#report tbody tr:last-child th{border-bottom:0}
#report thead th{background:#EAF0FA;color:#12305E;font-weight:700;border-bottom:1px solid #C9D6EA;text-align:left}
#report tbody th{background:#F2F5FA;color:#12305E;font-weight:600;text-align:left;width:26%}
#report td.n{text-align:right;font-variant-numeric:tabular-nums}
#report th.n{text-align:right}
#report .note{font-size:11px;color:#555;margin-top:6px}
#report table.fx{table-layout:fixed}
#report .nw{white-space:nowrap}
#report table.pair tbody tr td{background:#fff}
#report table.pair tbody tr.alt td{background:#FAFBFD}
#report table.pair tr.hm td{border-bottom:0}
#report table.pair tr.sub td{padding-top:0;font-size:11.5px;color:#333}
#report table.pair tr.sub b{color:#12305E;font-weight:600}
/* v1.9.0 F-2 글자 PDF(인쇄): 화면에서는 숨기고, 인쇄할 때만 진료용 문서만 보인다 */
#printDoc{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  html,body{background:#fff!important}
  body{padding:0!important;min-height:0!important}
  body>*:not(#printDoc){display:none!important}
  #printDoc{display:block!important;color:#111;font-family:var(--body);font-size:10.5pt;line-height:1.55;word-break:keep-all;overflow-wrap:break-word}
  #printDoc .blk{padding:0 0 10pt}
  #printDoc h1{font-size:18pt;margin:0 0 4pt}
  #printDoc h2{font-size:12pt;font-family:var(--body);font-weight:700;color:#12305E;margin:0 0 6pt;padding:0 0 0 8px;border-left:4px solid #2F6FED;break-after:avoid}
  #printDoc .cover{border:1px solid #D7DEE9;border-radius:8px;padding:12pt 14pt;background:#F7F9FC}
  #printDoc .cover .meta{display:flex;flex-wrap:wrap;gap:4pt 14pt;margin-top:8pt;font-size:9.5pt}
  #printDoc .cover .meta b{color:#12305E}
  #printDoc table{width:100%;border-collapse:collapse;font-size:9pt;border:1px solid #D7DEE9}
  #printDoc th,#printDoc td{border-bottom:1px solid #E2E7EF;padding:4pt 6pt;text-align:left;vertical-align:top;white-space:normal;color:#111}
  #printDoc thead{display:table-header-group}
  #printDoc thead th{background:#EAF0FA;color:#12305E;font-weight:700}
  #printDoc tbody th{background:#F2F5FA;color:#12305E;font-weight:600;width:26%}
  #printDoc tr{break-inside:avoid}
  #printDoc td.n,#printDoc th.n{text-align:right}
  #printDoc .note{font-size:8.5pt;color:#555;margin-top:4pt}
  #printDoc .nw{white-space:nowrap}
  #printDoc table.fx{table-layout:fixed}
  #printDoc table.pair tr.hm td{border-bottom:0}
  #printDoc table.pair tr.sub td{padding-top:0;font-size:8.5pt;color:#333}
  #printDoc canvas{max-width:100%;height:auto!important}
  #printDoc .foot{font-size:8pt;color:#666;margin-top:8pt}
}
/* ===== v1.11.0 디자인 A '잔잔한 능선' · 맑은 파랑 — 부품 모양 =====
   참고(세션 조사): 파노라(레드닷 2026, 능선 그래프), Gentler Streak(애플 디자인 어워드 2024, 범위 띠·다정한 문장), Harvee(애플 디자인 어워드 2026 후보, 상태를 말로)
   원칙: 그림자·테두리 대신 바탕색 차이, 버튼은 알약 모양, 카드 모서리 22px, 판정은 색 + ●▲■✕ 모양 */
body{-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
.appbar{box-shadow:none;background:var(--bg)}
.card,.list,.fgrid,.bigact,.sumline,.day,.searchbar{box-shadow:none}
.card{border-radius:var(--r)}
.list{border-radius:var(--r)}
.fgrid{border-radius:var(--r)}
.btn{border:0;background:var(--surface-2);color:var(--ink);border-radius:999px;min-height:46px;padding:10px 18px;font-weight:700}
.btn>.ic{vertical-align:middle}.btn:has(>.ic){display:inline-flex;align-items:center;justify-content:center;gap:6px}   /* v1.11.0 R-09: 아이콘이 글자보다 위로 뜨지 않게 */
.btn.sm{min-height:44px;padding:6px 14px;border-radius:999px}
.btn.primary,.btn.dark,.btn.eat{background:var(--fill);color:var(--fill-ink)}
.btn.ghost{background:transparent;color:var(--accent-deep)}
.btn.danger{background:var(--danger-fill);color:#fff}
.card .btn:not(.primary):not(.ghost):not(.danger),.sheet .btn:not(.primary):not(.ghost):not(.danger){background:var(--surface-2)}
.banner{border-radius:18px;border-color:transparent}
.banner.crit{border-color:var(--crit)}
.segctl{background:var(--field);border-radius:16px}
.segctl button{border-radius:12px;font-weight:700}
.segctl button[aria-pressed="true"]{box-shadow:none;font-weight:800}
.searchbar{border:0;border-radius:16px;min-height:52px;background:var(--surface)}
.chip{border-radius:999px}
.lic{border-radius:14px}
.fic{border-radius:14px}
.t-food{background:var(--food-tint);color:var(--accent)!important}
.pill{font-weight:700}
.tabs{border-top:0;background:var(--surface)}
.tab[aria-current="page"],.tab.on{color:var(--accent)}
.sheet{border-radius:28px 28px 0 0}
.mate{border:0;background:var(--accent-soft);color:var(--ink)}
.mate.on{background:var(--fill);color:var(--fill-ink)}
.mate.on svg{color:var(--fill-ink)}
.mwrap{border-top-color:var(--line)}
.sec-title h2,.fgroup :is(h2,h3).fg-h{font-size:1.0625rem;font-weight:800;letter-spacing:-.02em}
.tasks .tk-n{background:transparent;box-shadow:inset 0 0 0 2.5px var(--line-strong);color:transparent;width:26px;height:26px;border-radius:50%;font-size:0}
.tasks .is-done .tk-n{background:var(--fill);box-shadow:none;color:var(--fill-ink)}
.tasks .tk-n svg{width:16px;height:16px}
.tasks .tk-n.part{background:conic-gradient(var(--accent) 0 var(--p,0%),transparent 0)}
/* 홈 맨 위 상태 띠: 오늘 상태 한 문장 + 최근 2주 증상 점수 능선 + 기록 버튼 */
.ridge{background:var(--field);border-radius:26px;padding:16px 18px 16px;margin:2px 0 4px;color:var(--ink)}
.ridge .r-top{display:flex;align-items:center;gap:6px 8px;justify-content:space-between;flex-wrap:wrap}   /* v1.11.0 R-24: 좁으면 칩이 날짜 아래 줄로 */
.ridge .r-date{font-size:0.8125rem;color:var(--muted);margin:0;white-space:nowrap}
.ridge .r-stage{background:var(--surface);border:0;border-radius:999px;min-height:44px;padding:4px 10px 4px 12px;font-size:0.8125rem;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.ridge .r-stage .chev{width:16px;height:16px}
.ridge .r-head{font-family:var(--display);font-size:1.6875rem;font-weight:800;letter-spacing:-.035em;line-height:1.25;margin:8px 0 0}
.ridge .r-sub{font-size:0.9375rem;margin:4px 0 0}
.ridge .r-chart{display:block;width:100%;height:auto;margin:12px 0 4px;overflow:visible}
.ridge .r-chart .band{fill:var(--ridge-band)}
.ridge .r-chart .area{fill:var(--ridge-area)}
.ridge .r-chart .line{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ridge .r-chart .dot{fill:var(--accent);stroke:var(--field);stroke-width:3}
.ridge .r-chart .qdot{fill:var(--field);stroke:var(--accent);stroke-width:2}
.ridge .r-chart text{font-family:var(--body);font-size:12px;fill:var(--muted)}
.ridge .r-chart .bl{font-size:11.5px;fill:var(--accent-deep);font-weight:700;paint-order:stroke;stroke:var(--field);stroke-width:4px;stroke-linejoin:round}   /* v1.11.0 R-20 */
.ridge .r-chart .r-empty{font-size:13px;fill:var(--muted)}
.ridge .r-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ridge .r-btns .btn{flex:1 1 auto;min-height:46px}
.ridge .r-btns .btn.primary{flex:1 1 100%}
.ridge .r-btns .btn:not(.primary){background:var(--surface);color:var(--ink)}
.ridge .r-note{font-size:0.8125rem;color:var(--muted);margin:8px 0 0}
/* 음식 정보: 세 칸 요약, 차분한 회색 상자, FODMAP 띠 */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 2px}
.facts>div{background:var(--surface-2);border-radius:16px;padding:9px 12px;min-width:0}
.facts small{display:block;font-size:0.75rem;color:var(--muted)}
.facts b{display:block;font-size:1.0625rem;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.why-card{background:var(--surface-2)}
.why-card b{color:var(--ink)}
.fsv>div{background:var(--surface);border-radius:12px}
.why-card .fsv>div{box-shadow:none}
.fsv .lo:not(.na){background:var(--ok-soft);color:var(--ok-ink)}.fsv .lo:not(.na) b,.fsv .lo:not(.na) small{color:var(--ok-ink)}
.fsv .na{color:var(--muted)}
.fsv .mid{box-shadow:inset 0 3px 0 var(--warn-fill)}.fsv .hi{box-shadow:inset 0 3px 0 var(--avoid)}
a.lrow,a.lrow b,a.lrow small{text-decoration:none}
.card a:not(.btn):not(.lrow),.hint a,.info-body a,.banner a{color:var(--accent-deep);text-underline-offset:3px}
/* v1.10.0 PC(넓은 화면): PC 전용 화면을 따로 만들지 않고, 휴대폰과 같은 화면을 가운데 휴대폰 너비로 보인다(사용자 요청).
   고정 위치 요소(메뉴·아래 버튼·알림·시트·+버튼)도 같은 너비 안에 둔다 */
:root{--phone:640px}   /* 사용자가 보여 준 예시(PC에서 연 휴대폰 앱)처럼 가운데 640px 세로 띠 */
@media (min-width:700px){
  html{background:var(--pc-bg)}
  body{width:var(--phone);margin:0 auto;min-height:100vh;box-shadow:0 0 0 1px var(--line)}
  .wrap{max-width:none}
  .tabs,.toasts,#errbar,body.pushed .bottom-bar,body.welcome .bottom-bar{left:calc(50% - var(--phone)/2);right:calc(50% - var(--phone)/2);max-width:none}
  .tabs-in{max-width:none}
  .fab{right:calc(50% - var(--phone)/2 + 20px)}
  .sheet{max-width:var(--phone)}
  .plan-note,.hint,.card{word-break:keep-all}
}
