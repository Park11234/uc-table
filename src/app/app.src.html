// v1.11.0 H2: 그래프 점. 빠른 기록(밤 배변·몸 상태를 묻지 않음)은 빈 동그라미로 구분한다
function sccaiPts(from,n){return [...Array(n)].map((_,i)=>{const d=addDays(from,i);const l=S.logs[d];return {d,v:l?sccai(l):null,quick:!!(l&&l.quick)}})}
// PDF용 SCCAI 선 그래프: 한 계열, 5점 기준선, 기록 없는 날은 끊김
function drawSccaiChart(cv,from,n,theme){
  const g=cv.getContext("2d"), Z=2, W=cv.width/Z, H=cv.height/Z;
  const cs=getComputedStyle(document.documentElement);
  const cv1=(k,d)=>{const v=cs.getPropertyValue(k).trim(); return v||d};
  const C=theme==="print"?{bg:"#fff",grid:"#E7E9ED",mute:"#6A717D",line:"#2F6FED",ink:"#171A1F"}
    :{bg:cv1("--surface","#fff"),grid:cv1("--line","#E7E9ED"),mute:cv1("--muted","#6A717D"),line:cv1("--accent","#2F6FED"),ink:cv1("--ink","#171A1F")};
  const pad={l:34,r:40,t:14,b:30};
  const pts=sccaiPts(from,n);
  const vmax=Math.max(12,...pts.map(p=>p.v||0));
  const x=i=>pad.l+(n<=1?0:i*(W-pad.l-pad.r)/(n-1)), y=v=>pad.t+(1-v/vmax)*(H-pad.t-pad.b);
  g.setTransform(Z,0,0,Z,0,0); g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  g.font="500 11px 'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"; g.textBaseline="middle";
  for(let v=0;v<=vmax;v+=vmax>15?5:3){g.strokeStyle=C.grid;g.lineWidth=1;g.beginPath();g.moveTo(pad.l,y(v));g.lineTo(W-pad.r,y(v));g.stroke();g.fillStyle=C.mute;g.textAlign="right";g.fillText(String(v),pad.l-6,y(v))}
  g.setLineDash([5,4]); g.strokeStyle=C.mute; g.lineWidth=1.2; g.beginPath(); g.moveTo(pad.l,y(5)); g.lineTo(W-pad.r,y(5)); g.stroke(); g.setLineDash([]);
  g.fillStyle=C.mute; g.textAlign="left"; g.fillText("5점",W-pad.r+4,y(5));
  g.strokeStyle=C.line; g.lineWidth=2; g.lineJoin="round"; g.beginPath(); let on=false;
  pts.forEach((p,i)=>{if(p.v==null){on=false;return} if(!on){g.moveTo(x(i),y(p.v));on=true}else g.lineTo(x(i),y(p.v))}); g.stroke();
  pts.forEach((p,i)=>{if(p.v==null)return; g.fillStyle=C.bg; g.beginPath(); g.arc(x(i),y(p.v),5,0,7); g.fill();
    if(p.quick){g.strokeStyle=C.line; g.lineWidth=2; g.beginPath(); g.arc(x(i),y(p.v),3.6,0,7); g.stroke()}
    else{g.fillStyle=C.line; g.beginPath(); g.arc(x(i),y(p.v),4,0,7); g.fill()}});
  const last=[...pts].reverse().find(p=>p.v!=null); if(last){const i=pts.indexOf(last); g.fillStyle=C.ink; g.textAlign="left"; g.font="700 12px 'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"; g.fillText(String(last.v),Math.min(x(i)+8,W-pad.r+4),y(last.v)-10)}
  g.fillStyle=C.mute; g.font="500 11px 'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"; g.textBaseline="top";
  [0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i).forEach(i=>{g.textAlign=i===0?"left":i===n-1?"right":"center"; g.fillText(pts[i].d.slice(5).replace("-","/"),x(i),H-pad.b+8)});
}
// 표 행을 실제 높이로 재서 한 쪽(A4 본문 높이)에 들어가게 나눈다. 제목·설명은 첫 조각에만 붙인다.
function packTable(title,head,rows,note,attrs=""){
  const rep=$("#report"), MAXH=1060, out=[];
  const html=(rs,i)=>`${i===0?title:""}<table${attrs}>${head}<tbody>${rs.join("")}</tbody></table>${i===0&&note?note:""}`;
  const hOf=x=>{rep.innerHTML=`<div class="blk">${x}</div>`; return rep.firstChild.offsetHeight};
  let cur=[];
  for(const r of rows){const t=[...cur,r]; if(cur.length&&hOf(html(t,out.length))>MAXH){out.push(html(cur,out.length));cur=[r]} else cur=t}
  if(cur.length) out.push(html(cur,out.length));
  rep.innerHTML="";
  return out;
}
/* v1.9.0 P-1: 그림 PDF용 라이브러리(html2canvas·jsPDF, 약 563KB)는 앱을 열 때 실행하지 않고 '그림 PDF 저장'을 누를 때 불러온다.
   오프라인 단일 파일은 문서 안에 실행하지 않는 형태(<script type="text/plain">)로, 설치형(PWA)은 같은 서버의 vendor/에서(서비스 워커가 보관), 그 밖에는 CDN에서 */
const PDF_LIBS=[["html2canvas","lib-html2canvas","https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js","vendor/html2canvas.min.js"],
  ["jspdf","lib-jspdf","https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js","vendor/jspdf.umd.min.js"]];
let PDF_LOADING=null;
function loadPdfLibs(){
  if(window.html2canvas&&window.jspdf) return Promise.resolve();
  if(PDF_LOADING) return PDF_LOADING;
  PDF_LOADING=(async()=>{
    for(const [g,id,cdn,local] of PDF_LIBS){
      if(window[g]) continue;
      const emb=document.getElementById(id);
      if(emb){const sc=document.createElement("script"); sc.textContent=emb.textContent; document.head.appendChild(sc); continue}
      await new Promise((ok,no)=>{const sc=document.createElement("script"); sc.src=window.UC_VENDOR?local:cdn; sc.onload=ok; sc.onerror=()=>no(new Error("load")); document.head.appendChild(sc)});
    }
    if(!(window.html2canvas&&window.jspdf)) throw new Error("load");
  })().catch(e=>{PDF_LOADING=null; throw e});
  return PDF_LOADING;
}

function recSummary(x){const ds=[...new Set([...Object.keys(x.logs||{}),...Object.keys(x.extras||{}),...Object.keys(x.ateMeals||{}),...(x.weights||[]).map(w=>w.date)])].sort();
  return {n:Object.keys(x.logs||{}).length,first:ds[0]||"",last:ds[ds.length-1]||"",w:(x.weights||[]).length,r:(x.ratings||[]).length,t:(x.triggers||[]).length}}
function prevSnap(){try{const o=JSON.parse(localStorage.getItem(PREV_KEY)||"null"); if(!o||!o.s) return null; const d=new Date(o.at); return {label:isNaN(d)?"이전":`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`,n:Object.keys(o.s.logs||{}).length,s:o.s}}catch(e){return null}}
function keepPrev(){try{localStorage.setItem(PREV_KEY,JSON.stringify({at:new Date().toISOString(),s:S}))}catch(e){}}
/* v1.11.0 H1: 전체 초기화 때 기록이 남는 다른 곳도 지운다. 이 기기 안 자동 보관본(IndexedDB), 불러오기 전 기록(PREV), 손상 사본(KEY.broken.*),
   자동 백업 폴더 연결, 안드로이드 앱의 예전 저장소(옮겨 온 원본 파일·예전 file:// 저장소). PC 폴더에 이미 쓴 파일은 앱이 지우지 않는다 */
async function wipeLocalCopies(){
  try{localStorage.removeItem(PREV_KEY); Object.keys(localStorage).filter(k=>k.startsWith(KEY+".broken.")).forEach(k=>localStorage.removeItem(k))}catch(e){}
  LOAD_RAW="";
  try{if(window.UCTableAndroid&&typeof window.UCTableAndroid.wipeOld==="function") window.UCTableAndroid.wipeOld()}catch(e){}
  AUTO.folder=null; AUTO.perm="";
  try{await idb("snaps","readwrite",st=>st.clear()); await idb("kv","readwrite",st=>st.delete("folder"))}catch(e){}
  AUTO.snaps=null;
}
/* 합치기(v1.9.0 F-7): 날짜 단위가 아니라 항목 단위로 합친다. 예전에는 같은 날짜가 있으면 백업 쪽을 통째로 버렸다.
   - 직접 기록한 음식·끼니(먹음·안 먹음)·끼니 메뉴: 같은 날이라도 없는 항목만 더함
   - 물: 그날 더 많이 마신 쪽 / 건강 관리 점검: 더 최근 날짜
   - 증상 기록·몸무게: 하루에 하나라 같은 날 서로 다르면 지금 기록을 남기고, 그 수를 불러오기 전에 보여 준다 */
function mergeCore(cur,bk){
  const m=JSON.parse(JSON.stringify(cur)); const B=JSON.parse(JSON.stringify(bk));
  const st={logAdd:0,logKeep:0,exAdd:0,mealAdd:0,wAdd:0,wKeep:0,waterUp:0};
  const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  for(const k of ["logs","water","extras","skips","ate","ateMeals","swaps","care"]) m[k]=m[k]||{};
  for(const [d,v] of Object.entries(B.logs||{})){ if(!(d in m.logs)){m.logs[d]=v; st.logAdd++} else if(!same(m.logs[d],v)) st.logKeep++ }
  for(const [d,v] of Object.entries(B.water||{})){const a=+m.water[d]||0, b=+v||0; if(b>a){m.water[d]=b; st.waterUp++}}
  const exSig=x=>[x.name,x.amt,x.unit,x.slot||"",x.kcal].join("|");
  for(const [d,arr] of Object.entries(B.extras||{})){const c=m.extras[d]||[]; const seen=new Set(c.map(exSig)); const add=(arr||[]).filter(x=>!seen.has(exSig(x))); if(add.length){m.extras[d]=[...c,...add]; st.exAdd+=add.length}}
  for(const [d,day] of Object.entries(B.ateMeals||{})){m.ateMeals[d]=m.ateMeals[d]||{}; for(const [sl,v] of Object.entries(day||{})) if(!(sl in m.ateMeals[d])){m.ateMeals[d][sl]=v; st.mealAdd++}}
  for(const d of new Set([...Object.keys(B.ate||{}),...Object.keys(B.skips||{})])){
    const ca=m.ate[d]||[], cs=m.skips[d]||[];
    for(const sl of (B.ate||{})[d]||[]) if(!ca.includes(sl)&&!cs.includes(sl)) ca.push(sl);
    for(const sl of (B.skips||{})[d]||[]) if(!ca.includes(sl)&&!cs.includes(sl)) cs.push(sl);
    if(ca.length) m.ate[d]=ca; if(cs.length) m.skips[d]=cs;
  }
  for(const [k,v] of Object.entries(B.swaps||{})) if(!(k in m.swaps)) m.swaps[k]=v;
  for(const [k,v] of Object.entries(B.care||{})) if(!m.care[k]||String(v)>String(m.care[k])) m.care[k]=v;
  const byKey=(a,b,f)=>{const seen=new Set(a.map(f)); return [...a,...b.filter(x=>!seen.has(f(x)))]};
  { const cw=m.weights||[]; const dates=new Map(cw.map(w=>[w.date,w.kg]));
    for(const w of (B.weights||[])){ if(!dates.has(w.date)){cw.push(w); dates.set(w.date,w.kg); st.wAdd++} else if(+dates.get(w.date)!==+w.kg) st.wKeep++ }
    m.weights=cw.sort((a,b)=>a.date<b.date?-1:1) }
  m.ratings=byKey(m.ratings||[],B.ratings||[],r=>[r.date,r.slot,r.foodId||"",r.name||"",r.title||""].join("|"));
  m.triggers=byKey(m.triggers||[],B.triggers||[],t=>String(t.name).trim());
  m.myMenus=byKey(m.myMenus||[],B.myMenus||[],x=>x.slot+"|"+x.title);
  m.qs=byKey(m.qs||[],B.qs||[],q=>q.id);
  m.favs=[...new Set([...(m.favs||[]),...(B.favs||[])])].slice(0,80);
  m.okMenus=[...new Set([...(m.okMenus||[]),...(B.okMenus||[])])];
  if(m.reintro&&B.reintro){m.reintro.history=byKey(m.reintro.history||[],B.reintro.history||[],h=>JSON.stringify(h)); if(!m.reintro.active&&B.reintro.active) m.reintro.active=B.reintro.active}
  for(const [k,v] of Object.entries(B.profile||{})){const c=m.profile[k]; if((c===""||c==null||(Array.isArray(c)&&!c.length))&&v!==""&&v!=null) m.profile[k]=v}
  if(!(m.orders.checked||[]).length&&!(m.orders.other||[]).length&&B.orders) m.orders=B.orders;
  if(!Object.keys(m.goals||{}).length&&B.goals) m.goals=B.goals;
  return {m,st};
}
function mergeStates(cur,bk){return normalizeState(mergeCore(cur,bk).m)}
function restoreFromText(txt){
  let cand;
  try{cand=normalizeState(JSON.parse(String(txt).trim()))}catch(e){alertMsg(e?.message==="newer backup"?"더 최신 버전 앱에서 만든 백업입니다. 앱을 새로고침한 뒤 다시 시도해 주십시오.":"올바른 백업 내용이 아닙니다. 파일이나 붙여 넣은 내용을 확인해 주십시오."); closeSheet(); return}
  PENDING_RESTORE=cand;
  const a=recSummary(S), b=recSummary(cand); const hasCur=a.n||a.w||a.r||Object.keys(S.extras||{}).length;
  const per=x=>x.first?`${md(x.first)} ~ ${md(x.last)}`:"기록 없음";
  const older=hasCur&&b.last&&a.last&&b.last<a.last;
  openSheet(`<h2>백업 불러오기</h2>
    <table class="cmp" style="width:100%;margin:10px 0;border-collapse:collapse;font-size:0.875rem"><thead><tr><th></th><th style="text-align:right">지금 이 기기</th><th style="text-align:right">백업</th></tr></thead><tbody>
      <tr><td>증상 기록</td><td class="num" style="text-align:right">${a.n}일</td><td class="num" style="text-align:right">${b.n}일</td></tr>
      <tr><td>기록 기간</td><td style="text-align:right">${per(a)}</td><td style="text-align:right">${per(b)}</td></tr>
      <tr><td>몸무게 · 음식 평가</td><td class="num" style="text-align:right">${a.w} · ${a.r}</td><td class="num" style="text-align:right">${b.w} · ${b.r}</td></tr>
      <tr><td>주의 음식</td><td class="num" style="text-align:right">${a.t}</td><td class="num" style="text-align:right">${b.t}</td></tr></tbody></table>
    ${older?`<p class="crit-t">백업이 지금 기록보다 오래됐습니다. '백업으로 바꾸기'를 하면 ${md(b.last)} 뒤의 기록이 사라집니다. 둘 다 남기려면 '합치기'를 고르십시오.</p>`:""}
    ${hasCur?(()=>{const m=mergeCore(S,cand).st; return `<p class="hint">합치기: 지금 기록은 그대로 두고, 백업에만 있는 항목을 더합니다(같은 날 기록도 항목 단위로). 바꾸기: 지금 기록을 모두 백업 내용으로 바꿉니다.</p>
      <p class="hint" style="margin:0">합치면 증상 기록 ${m.logAdd}일, 몸무게 ${m.wAdd}개, 직접 기록한 음식 ${m.exAdd}개, 끼니 메뉴 ${m.mealAdd}개가 더해집니다.${m.logKeep||m.wKeep?` <b>같은 날 서로 다른 기록(증상 ${m.logKeep}일, 몸무게 ${m.wKeep}개)은 지금 기록을 남기고 백업 쪽은 쓰지 않습니다.</b>`:""}</p>`})():""}
    <p class="hint">어느 쪽을 골라도 불러오기 직전 기록은 기기 안에 따로 보관해, '데이터 백업'의 '불러오기 전 기록으로 되돌리기'로 돌아갈 수 있습니다.</p>
    <div class="stack" style="margin-top:12px">${hasCur?`<button class="btn primary full" data-act="restoreApply" data-v="merge">합치기</button><button class="btn full" data-act="restoreApply" data-v="replace">백업으로 바꾸기</button>`:`<button class="btn primary full" data-act="restoreApply" data-v="replace">불러오기</button>`}<button class="btn full" data-act="closeSheet">취소</button></div>`);
}
function restoreApply(mode){ LOAD_FAIL=false;
  if(!PENDING_RESTORE) return;
  const prev=S;
  try{keepPrev(); S=mode==="merge"?mergeStates(prev,PENDING_RESTORE):PENDING_RESTORE; if(!S.consent) S.consent=prev.consent; S.onb="done"; if(!S.plan) S.plan=samplePlan(); draft=null; SCR=null; PENDING_RESTORE=null; closeSheet(); render(); navSync(); toast(mode==="merge"?"백업을 합쳤습니다":"백업을 불러왔습니다")}
  catch(e){S=prev; PENDING_RESTORE=null; closeSheet(); render(); alertMsg("백업을 적용하지 못해 원래 기록을 그대로 뒀습니다.")}
}
function restoreUndo(){
  const pv=prevSnap(); if(!pv){toast("되돌릴 기록이 없습니다"); return}
  openSheet(`<h2>불러오기 전으로 되돌리시겠습니까?</h2><p class="hint" style="margin:10px 0">${esc(pv.label)}에 보관한 기록(증상 ${pv.n}일)으로 바꿉니다. 지금 기록은 다시 보관돼 한 번 더 되돌릴 수 있습니다.</p><div class="grid2"><button class="btn" data-act="closeSheet">취소</button><button class="btn primary" data-act="restoreUndoGo">되돌리기</button></div>`);
}
function restoreUndoGo(){const pv=prevSnap(); if(!pv) return; let nx; try{nx=normalizeState(pv.s)}catch(e){alertMsg("보관한 기록을 읽지 못했습니다."); return}
  const cur=S; keepPrev(); S=nx; if(!S.consent) S.consent=cur.consent; S.onb="done"; if(!S.plan) S.plan=samplePlan(); SCR=null; draft=null; closeSheet(); render(); navSync(); toast("불러오기 전 기록으로 되돌렸습니다")}
async function restore(file){
  if(!file) return;
  try{restoreFromText(await file.text())}catch(e){alertMsg("파일을 읽지 못했습니다.")}
}
/* v1.8.0 예기치 못한 오류: 빈 화면 대신 위쪽에 안내를 띄운다(기록은 그대로). 같은 오류는 한 번만 */
let ERR_SEEN="";
function showErr(msg){msg=String(msg||""); if(!msg||/ResizeObserver|Script error/.test(msg)||ERR_SEEN===msg) return; ERR_SEEN=msg;
  let b=$("#errbar"); if(!b){b=document.createElement("div"); b.id="errbar"; document.body.appendChild(b)}
  b.innerHTML=`<div class="banner crit" role="alert"><strong>앱에 문제가 생겼습니다</strong><br>기록은 지워지지 않았습니다. 혹시 모르니 백업 내용을 복사해 두고 새로고침해 주십시오.<div class="b-act"><button class="btn sm primary" data-act="backupCopy">백업 내용 복사</button><button class="btn sm" data-act="reloadPage">새로고침</button><button class="btn sm" data-act="errClose">닫기</button></div><small class="muted" style="display:block;margin-top:6px;word-break:break-all">${esc(msg).slice(0,160)}</small></div>`}
window.addEventListener("error",e=>showErr(e.message||e.error?.message));
window.addEventListener("unhandledrejection",e=>showErr(e.reason?.message||e.reason));
// v1.10.0 사용자 12: 앱을 열면 자동 백업(이 기기 보관본·폴더)을 한 번 확인한다
setTimeout(()=>{try{if(S.consent&&!LOAD_FAIL) autoRun()}catch(e){}},3000);
/* v1.9.0 F-8: 앱을 켜 둔 채 자정이 지나도 '오늘'이 바뀌게 — 화면이 다시 보일 때와 1분마다 날짜를 확인해 다시 그린다
   (증상 기록을 적는 중이면 저장할 때까지 기다린다) */
let LAST_DAY=today();
function dayCheck(){const t=today(); if(t===LAST_DAY) return; if(SCR&&SCR.name==="wizard") return; LAST_DAY=t; render()}
document.addEventListener("visibilitychange",()=>{if(!document.hidden) dayCheck()});
window.addEventListener("pageshow",dayCheck);
setInterval(dayCheck,60000);
render();
if(S.consent&&!onbActive()&&!S.persist) askPersist();
</script>
