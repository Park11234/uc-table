*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.6;padding-inline:16px;padding-block:0 110px;min-height:100%}

label.btn{display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}   /* 파일 고르기처럼 label로 만든 버튼도 글자를 가운데로 */
.btn.primary{background:var(--fill);border-color:var(--fill);color:var(--fill-ink)}
.btn.dark{background:var(--fill);border-color:var(--fill);color:var(--fill-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-deep)}
.btn.sm{padding:6px 12px;font-size:0.8125rem;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.full{width:100%}

.banner{border-radius:18px;padding:12px 14px;border:1px solid}
.banner.crit{background:var(--crit-soft);border-color:var(--crit);border-width:2px;color:var(--ink)}
.banner.urgent{background:var(--warn-soft);border-color:var(--warn,#E8A33D);border-width:2px;color:var(--ink)}
.banner.urgent strong{color:var(--warn-ink,#9A5B00)}
.banner{position:relative;z-index:1}
.banner .b-act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.banner .b-act .btn{min-height:44px;padding:0 14px}
.banner.crit strong{color:var(--crit)}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.info{background:var(--accent-soft);border-color:transparent}

/* hero summary */
.hero{color:var(--ink);padding:2px 0 0}
.cal-head{display:flex;align-items:baseline;gap:14px;margin-bottom:12px}
.cal-head b{font-family:var(--display);font-size:1.625rem;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.cal-head span{font-family:var(--display);font-size:0.9375rem;font-weight:600;color:var(--muted)}
.cal-head .glass{margin-left:auto}
.hero .days{gap:4px;justify-content:space-between}
.hero .day{background:transparent;box-shadow:none;color:var(--ink);width:auto;flex:1 0 44px;min-width:44px;border-radius:999px;padding:6px 0}
.hero .day span{color:var(--muted)}
.hero .day[aria-pressed="true"]{background:transparent;color:var(--accent-ink)}
.hero .day[aria-pressed="true"] span{color:var(--accent);opacity:1;font-weight:700}
.hero .day[aria-pressed="true"] b{background:var(--fill);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;margin:2px auto 0;color:var(--accent-ink)}
.hero .day b{width:36px;max-width:100%;aspect-ratio:1;height:auto;display:grid;place-items:center;margin:2px auto 0}
.overlap{position:relative}
.big-date{font-family:var(--display);font-size:1.5625rem;font-weight:800;letter-spacing:-.02em}
.big-date small{font-weight:600;color:var(--muted);font-size:0.9375rem;margin-left:4px}
.fab{position:fixed;right:20px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--fill);color:var(--fill-ink);box-shadow:var(--fab-shadow);display:grid;place-items:center;z-index:5}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.hero .muted,.hero .small{color:var(--muted)}
.hero-row{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:118px;height:118px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.15}
.ring .v b{font-family:var(--display);font-size:1.5rem;display:block}
.ring .v span{font-size:0.75rem;color:var(--muted)}
.ring .v b{color:var(--ink)}
.hbar{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;font-size:0.8125rem;padding-block:4px}
.hbar .t{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.hero .sub{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hero .sub h3{font-size:1rem;color:var(--ink)}
.hero .glass{background:var(--surface);border-radius:999px;padding:4px 12px;font-size:0.8125rem}

/* v1.9.0 D-3 오늘 할 일 */
.tasks{display:flex;flex-direction:column;gap:2px}
.task{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:10px 0;border-top:1px solid var(--line)}
.tasks>.row+.task{border-top:0}
.tk-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:800;font-size:.875rem;flex:none}
.tk-n .ic{width:16px;height:16px;stroke-width:2.6}
.task.is-done .tk-n{background:var(--ok-soft);color:var(--ok)}
.tk-main{display:flex;align-items:center;gap:12px;flex:1 1 12rem;min-width:0}
.tk-act{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;flex:0 1 auto;max-width:100%;justify-content:flex-end} /* v1.10.0 버튼이 셋이어도 큰 글자에서 줄바꿈 */
.tk-act .btn{white-space:nowrap}
.tk-act .btn.sm{min-height:44px}
/* quick tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:10px}
.tile{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:0.8125rem;color:var(--ink);padding:0}
.tile i{width:58px;height:58px;border-radius:18px;background:var(--surface);color:var(--accent);display:grid;place-items:center;font-style:normal;font-size:1.625rem}
.tile svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* day strip */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.day{flex:0 0 auto;width:52px;border:0;background:var(--surface);border-radius:18px;padding:9px 0;text-align:center;line-height:1.25;box-shadow:var(--shadow)}
.day b{display:block;font-size:1.125rem;font-family:var(--display)}
.day span{font-size:0.75rem;color:var(--muted);display:block}
.day[aria-pressed="true"]{background:var(--fill);color:var(--fill-ink)}
.day[aria-pressed="true"] span{color:inherit;opacity:.85}

/* meal cards */
.meal{display:grid;grid-template-columns:58px 1fr;gap:14px;background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.thumb{width:58px;height:58px;border-radius:18px;background:var(--food-tint);display:grid;place-items:center;font-size:1.75rem}
.meal:nth-of-type(3n+2) .thumb{background:var(--deco-soft)} .meal:nth-of-type(3n) .thumb{background:var(--accent-soft)}
.slot{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 9px;font-size:0.75rem;font-weight:700}
.meal h4{margin:6px 0 0;font-size:1.0312rem;font-weight:800;font-family:var(--display)}
.btn.eat{background:var(--fill);border-color:var(--fill);color:var(--fill-ink);font-weight:700}
.items{margin:4px 0 0;padding:0;list-style:none;font-size:0.8125rem;color:var(--muted)}
.items li{display:inline}
.items li+li::before{content:" · "}
.why{margin:10px 0 0;font-size:0.8438rem;background:var(--surface-2);border-radius:14px;padding:9px 11px}
.why b{color:var(--accent);font-size:0.8125rem;display:block;margin-bottom:1px}
sup.ref{font-size:0.75rem;color:var(--accent-deep);font-weight:700;cursor:pointer;margin-left:1px;padding:0 2px;background:var(--accent-soft);border-radius:6px}
.eaten{font-size:0.8125rem;color:var(--ok);font-weight:700}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:0.8125rem;font-weight:600;white-space:nowrap}
.today-card .qtag{margin-top:6px;white-space:normal}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.caution{background:var(--warn-soft);color:var(--warn)}
.pill.later{background:var(--later-soft);color:var(--later)}
.pill.avoid{background:var(--avoid-soft);color:var(--avoid)}
/* v1.9.0 절대 금지(아질산염 가공육 등): 진한 빨강 바탕에 흰 글자, X 모양 */
.pill.ban{background:var(--ban-bg);color:var(--ban-ink);font-weight:700}
.pill::before{content:"";width:9px;height:9px;flex:0 0 auto;background:currentColor}
.pill.ok::before{border-radius:50%}
.pill.caution::before{clip-path:polygon(50% 0,100% 100%,0 100%)}
.pill.later::before{border-radius:2px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.pill.avoid::before{clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.pill.ban::before{width:10px;height:10px;clip-path:polygon(20% 0,50% 30%,80% 0,100% 20%,70% 50%,100% 80%,80% 100%,50% 70%,20% 100%,0 80%,30% 50%,0 20%)}
.pill.neutral::before,.pill.info::before{display:none}
.pill.neutral{background:var(--accent-soft);color:var(--on-soft)}

/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:0.8125rem;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=time],input[type=email],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:14px;padding:10px 13px;color:var(--ink);font-size:1rem}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:0.8125rem;min-width:44px}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--on-soft);border-color:var(--accent);font-weight:700}
.seg button:disabled{opacity:.4}
.q{display:flex;flex-direction:column;gap:7px;padding-block:12px;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q-t{font-weight:700;font-size:0.875rem}
.stepper{display:inline-flex;align-items:center;background:var(--surface-2);border-radius:14px;overflow:hidden}
.stepper button{border:0;background:transparent;width:44px;height:44px;font-size:1.25rem;color:var(--accent-deep)}
.stepper output{min-width:52px;text-align:center;font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent);height:44px;margin:0} /* v1.9.0 A-9: 슬라이더 높이 16px → 44px */
.check{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:0.875rem}
.check:first-child{border-top:0}
.check input{margin-top:2px;width:24px;height:24px;accent-color:var(--accent)}
.tagx{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:999px;padding:0 0 0 12px;font-size:0.8125rem}
.tagx button{border:0;background:none;width:44px;height:44px;border-radius:50%;color:var(--muted);font-size:1.125rem}

/* nutrition */
.meter{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:10px;font-size:0.8125rem;padding-block:7px}
.bar{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.low{background:var(--warn-fill)}
.cups{display:flex;flex-wrap:wrap;gap:8px}
.cup{width:44px;height:52px;border:2px solid var(--accent);border-radius:6px 6px 12px 12px;background:transparent;padding:0}
.cup.full{background:linear-gradient(to top,var(--accent) 80%,transparent 80%)}

/* food list rows (details) */
.food{display:flex;justify-content:space-between;gap:10px;padding-block:11px;border-top:1px solid var(--line)}
.food:first-child{border-top:0}
.food p{margin:2px 0 0;font-size:0.8125rem;color:var(--muted)}
.food .pill{flex-shrink:0;align-self:flex-start;margin-top:2px}

/* food grid */
.cats{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:2px} /* v1.9.0 D-8: 가로로 잘리던 칩을 줄바꿈 */
.cats .chip{flex:0 0 auto;white-space:nowrap}
.subnav{margin-top:0}
.subnav .stage{border:0;background:none;font-weight:600;font-size:0.8125rem}
.subnav .stage.on{background:var(--fill);color:var(--fill-ink)}
/* v1.10.0 디자인 4: 검색 결과는 한 줄 목록(그림·이름·종류와 1회 양·판정) */
.fgrid{display:flex;flex-direction:column;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.fcard{position:relative;text-align:left;border:0;background:transparent;padding:10px 14px;display:flex;flex-direction:row;align-items:center;gap:12px;min-width:0;min-height:60px;color:inherit}
.fcard+.fcard{border-top:1px solid var(--line)}
.fcard .lt{flex:1;min-width:0;display:flex;flex-direction:column}
.fcard .lt small{color:var(--muted);font-size:0.75rem;line-height:1.35}
.fcard .pill{flex:none;margin:0}
.ftools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ftools .chip{min-height:44px;display:inline-flex;align-items:center;gap:6px}
.ftools .chip .ic{width:16px;height:16px}
.ftools .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--on-soft);font-weight:700}
.fcard .thumb{width:50px;height:50px;font-size:1.5625rem;border-radius:16px}
.fcard:nth-child(4n+1) .thumb{background:var(--food-tint)} .fcard:nth-child(4n+2) .thumb{background:var(--deco-soft)} .fcard:nth-child(4n+3) .thumb{background:var(--accent-soft)} .fcard:nth-child(4n) .thumb{background:var(--surface-2)}
.fcard .chev{position:absolute;right:12px;bottom:14px;color:var(--muted);font-size:1.125rem;line-height:1}
.fcard b{font-size:0.875rem;line-height:1.35;overflow-wrap:anywhere}
.fcard .dot{position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%}
.dot.ok{background:var(--ok)} .dot.caution{background:var(--warn-fill)} .dot.later{background:var(--later)} .dot.avoid{background:var(--avoid)}

/* table */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:0.8125rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:500}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.refitem{padding-block:10px;border-top:1px solid var(--line);font-size:0.875rem}
.refitem:first-of-type{border-top:0}
.refitem .n{display:inline-block;min-width:28px;font-weight:700;color:var(--accent-deep)}
.refitem .cite{font-size:0.8125rem;color:var(--muted);margin-top:3px}
/* v1.9.0 D-6: 알림(토스트)은 아래 조작 영역을 가리지 않게 위쪽 전용 영역에 5초 동안. 누르거나 초점이 가면 멈춘다. 영역은 늘 있어(aria-live) 화면 읽기가 알림을 읽는다 */
/* v1.10.0 디자인 10: 알림은 아래쪽(메뉴 바로 위)에 띄워 화면 제목을 가리지 않는다. 메뉴가 없는 화면(설정·기록 마법사)은 화면 아래 버튼 위 */
.toasts{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);z-index:30;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
body.pushed .toasts,body.welcome .toasts{bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:4px;max-width:528px;background:var(--ink);color:var(--bg);padding:4px 4px 4px 16px;border-radius:16px;font-size:0.875rem;box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:1;transition:opacity .2s}
.toast .t-msg{flex:1;padding:8px 4px 8px 0}
.toast button{flex:none;min-height:44px;min-width:44px;border:0;background:transparent;color:inherit;font:inherit;font-weight:700;padding:0 10px;border-radius:12px}
.toast button.t-act{text-decoration:underline;text-underline-offset:3px}
.toast button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.toast.out{opacity:0}
/* v1.9.0 F-9: 화면이 막 바뀐 직후 같은 자리 버튼은 잠깐 비활성으로 보인다(연타로 다음 화면 버튼이 눌리지 않게) */
.cool{opacity:.45!important;transition:opacity .15s}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.progress{font-size:0.8125rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:700}

/* report (pdf) */
#report{position:fixed;left:-10000px;top:0;width:760px;background:#fff;color:#111;font-family:var(--body);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
#report .blk{padding:16px 34px}
#report h1{font-family:var(--display);font-size:25px;margin:0 0 4px}
#report h2{font-size:15.5px;font-family:var(--body);font-weight:700;color:#12305E;margin:0 0 10px;padding:0 0 0 10px;border-left:4px solid #2F6FED;border-bottom:0;line-height:1.3}
#report .cover{border:1px solid #D7DEE9;border-radius:10px;padding:18px 20px;background:#F7F9FC}
#report .cover .meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12.5px;color:#333}
#report .cover .meta b{color:#12305E}
#report table{font-size:12px;width:100%;border-collapse:collapse;border:1px solid #D7DEE9;border-radius:8px;overflow:hidden}
#report th,#report td{border-bottom:1px solid #E2E7EF;white-space:normal;color:#111;padding:6px 8px;vertical-align:top}
#report tbody tr:nth-child(even) td{background:#FAFBFD}
#report tbody tr:last-child td,#report tbody tr:last-child th{border-bottom:0}
#report thead th{background:#EAF0FA;color:#12305E;font-weight:700;border-bottom:1px solid #C9D6EA;text-align:left}
#report tbody th{background:#F2F5FA;color:#12305E;font-weight:600;text-align:left;width:26%}
#report td.n{text-align:right;font-variant-numeric:tabular-nums}
#report th.n{text-align:right}
#report .note{font-size:11px;color:#555;margin-top:6px}
#report table.fx{table-layout:fixed}
#report .nw{white-space:nowrap}
#report table.pair tbody tr td{background:#fff}
#report table.pair tbody tr.alt td{background:#FAFBFD}
#report table.pair tr.hm td{border-bottom:0}
#report table.pair tr.sub td{padding-top:0;font-size:11.5px;color:#333}
#report table.pair tr.sub b{color:#12305E;font-weight:600}
/* v1.9.0 F-2 글자 PDF(인쇄): 화면에서는 숨기고, 인쇄할 때만 진료용 문서만 보인다 */
#printDoc{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  html,body{background:#fff!important}
  body{padding:0!important;min-height:0!important}
  body>*:not(#printDoc){display:none!important}
  #printDoc{display:block!important;color:#111;font-family:var(--body);font-size:10.5pt;line-height:1.55;word-break:keep-all;overflow-wrap:break-word}
  #printDoc .blk{padding:0 0 10pt}
  #printDoc h1{font-size:18pt;margin:0 0 4pt}
  #printDoc h2{font-size:12pt;font-family:var(--body);font-weight:700;color:#12305E;margin:0 0 6pt;padding:0 0 0 8px;border-left:4px solid #2F6FED;break-after:avoid}
  #printDoc .cover{border:1px solid #D7DEE9;border-radius:8px;padding:12pt 14pt;background:#F7F9FC}
  #printDoc .cover .meta{display:flex;flex-wrap:wrap;gap:4pt 14pt;margin-top:8pt;font-size:9.5pt}
  #printDoc .cover .meta b{color:#12305E}
  #printDoc table{width:100%;border-collapse:collapse;font-size:9pt;border:1px solid #D7DEE9}
  #printDoc th,#printDoc td{border-bottom:1px solid #E2E7EF;padding:4pt 6pt;text-align:left;vertical-align:top;white-space:normal;color:#111}
  #printDoc thead{display:table-header-group}
  #printDoc thead th{background:#EAF0FA;color:#12305E;font-weight:700}
  #printDoc tbody th{background:#F2F5FA;color:#12305E;font-weight:600;width:26%}
  #printDoc tr{break-inside:avoid}

 23:{short:"Monash University, 저FODMAP 지중해식",cite:"Varney J. A low FODMAP Mediterranean-style diet. Monash University FODMAP blog, 2016-06-25. monashfodmap.com/blog/a-low-fodmap-mediterranean-style-diet.",key:"통조림 병아리콩 1/4컵, 통조림 렌틸콩 1/2컵은 저FODMAP 1회량. 올리브유 하루 60ml, 저FODMAP 채소를 매끼 포함."},
 24:{short:"Monash University, 밀·곡물과 FODMAP",cite:"Monash University FODMAP team. Wheat and a low FODMAP diet. 2015-08-10. monashfodmap.com/blog/avoiding-wheat-how-strict-on-low-fodmap_10; Varney J. Using non-traditional cereals and grains. 2017-08-07. monashfodmap.com/blog/using-non-traditional-cereals-and-grains.",key:"저FODMAP 단계에서 일반 밀빵·밀 파스타 대신 스펠트 사워도우 2쪽, 글루텐프리·퀴노아 파스타 1컵 등을 권장. 귀리·퀴노아·현미·옥수수는 1회량 또는 반 회량에서 저FODMAP."},
 25:{short:"Chumpitazi 등, 미국 식품 FODMAP 함량 분석(2018)",cite:"Chumpitazi BP, Lim J, McMeans AR, Shulman RJ, Hamaker BR. Evaluation of FODMAP Carbohydrates Content in Selected Foods in the United States. J Pediatr. 2018;199:252-255.",key:"바나나 100g당 과당 3.21g, 프럭토올리고당 0.15g. 락토프리 우유에서 유당 미검출."},
 29:{short:"식품의약품안전처, 영양성분 강조표시 기준",cite:"식품의약품안전처. 식품산업체를 위한 영양표시 안내서(식품등의 표시기준 영양성분 강조표시); 저당류·저나트륨 표시기준 개정 보도(식품음료신문, 2017.1.4).",key:"저지방: 100g당 3g 미만(100ml당 1.5g 미만). 저나트륨: 100g당 120mg 미만. 저당류: 100g당 5g 미만(100ml당 2.5g 미만). 식이섬유 함유: 100g당 3g 이상, 고식이섬유: 100g당 6g 이상."},
 30:{short:"2025 한국인 영양소 섭취기준 제1권, 식이섬유",cite:"보건복지부·한국영양학회. 2025 한국인 영양소 섭취기준 제1권 에너지와 다량영양소, 식이섬유 장.",key:"수용성 식이섬유는 장내 미생물이 발효해 단쇄지방산을 만들고, 그중 부티르산은 대장 상피세포의 주요 에너지원으로 항염증 효과와 장 점막 항상성 유지에 기여. 부티르산 생산·대사 결함은 궤양성 대장염 등 염증성 장질환과 연관될 수 있음."},
 31:{short:"2025 한국인 영양소 섭취기준 제3권, 칼륨·철",cite:"보건복지부·한국영양학회. 2025 한국인 영양소 섭취기준 제3권 무기질, 칼륨·철 장.",key:"지속적인 구토·설사 등으로 칼륨이 결핍되면 저칼륨혈증(근육 약화, 부정맥 등)이 생길 수 있음. 체내 철은 잘 보존되어 출혈이 없으면 손실이 매우 적음(출혈 시 철 손실 증가)."},
 32:{short:"ESPEN IBD 임상영양 가이드라인(2017, 이전 판)",cite:"Forbes A, Escher J, Hébuterne X, et al. ESPEN guideline: Clinical nutrition in inflammatory bowel disease. Clin Nutr. 2017;36(2):321-347.",key:"IBD 빈혈은 대부분 만성 철 결핍과 만성질환 빈혈이 함께 있음. 활동기에는 단백질 전환이 늘고 스테로이드가 단백질 손실을 늘림. 심한 설사는 체중 감소·영양 결핍·탈수를 일으킬 수 있어 수분 섭취를 배출량에 맞춰 조절. 유당·유제품은 잘 맞지 않는 경우가 많음. 골밀도 저하 위험 요인은 성인에서 스테로이드 사용·낮은 비타민 D 등, 소아·청소년에서 스테로이드 누적 용량. ※ 2023년 개정판은 참고문헌 1. 이 앱은 2023판에서 확인하지 못한 문장(IBD의 철 결핍)에만 이 판을 인용."},
 33:{short:"Crohn's & Colitis Foundation, IBD 식사 안내",cite:"Crohn's & Colitis Foundation. What Should I Eat? (IBD diet guide). crohnscolitisfoundation.org.",key:"악화기에는 바나나·사과퓨레·갈아 만든 과일, 호박류·푹 익힌 당근·그린빈, 연어·고등어 등 오메가-3 생선을 권장. 활동기에는 단백질 필요량이 늘고, 묽은 변이 잦으면 수분 섭취를 늘리며, 섬유 식품은 질감을 조절. 관해기에는 식물성 식품을 최대한 넓게 먹도록 권장."},
 34:{short:"MedlinePlus, 설사할 때 식사 안내",cite:"MedlinePlus Medical Encyclopedia (U.S. National Library of Medicine). When you have diarrhea (patient instructions 000121). A.D.A.M.; reviewed 2025-10-01.",key:"설사는 탈수와 기운 없음을 일으킴. 묽은 변을 볼 때마다 물 1컵(240ml) 이상, 국물 등 짠 음식과 바나나·감자 등 칼륨 식품을 먹고, 튀기거나 기름진 음식·카페인·알코올·탄산음료는 피하며, 유제품이 설사를 악화시키면 줄임."},
 35:{short:"UCSF Health, IBD·설사 영양 안내",cite:"UCSF Health. Nutrition Tips for Inflammatory Bowel Disease; Nutrition Tips for Controlling Diarrhea. ucsfhealth.org/health-articles (2026-10-05 확인).",key:"IBD: 설사로 빠지는 나트륨·칼륨 등 전해질을 보충하고, 배변량을 늘릴 수 있는 생과일·생채소·말린 자두·카페인 음료는 피함. 유당불내증이면 우유가 가스·팽만·경련·설사를 일으킴. 스테로이드(프레드니손) 복용 시 칼슘 부족 위험과 단백질 필요량이 증가. 설사 안내: 튀김·소스 같은 기름진 음식과 양념이 강한 음식은 잘 맞지 않을 수 있음."},
 16:{short:"보건복지부, 2025 한국인 영양소 섭취기준",cite:"보건복지부·한국영양학회. 2025 한국인 영양소 섭취기준 제1권 에너지와 다량영양소, 제3권 무기질(요약표); 보건복지부 보도자료 「영양소 적정 섭취기준 개정」(2025.12.31).",key:"성인 칼슘 권장섭취량: 남자 800mg, 여자 19–49세 650mg·50세 이상 750mg. 수분(물·음료·우유) 충분섭취량: 남자 19–49세 1,200ml·50–74세 1,000ml·75세 이상 1,100ml, 여자 19–64세 1,000ml·65–74세 900ml·75세 이상 1,000ml. 식이섬유 충분섭취량(1,000kcal당 12.5g 기준): 남자 30g, 여자 19–49세 20g·50세 이상 25g. 성인 칼륨 충분섭취량 3,500mg."},
 26:{short:"MedlinePlus, 저섬유식 안내(2024)",cite:"MedlinePlus Medical Encyclopedia (U.S. National Library of Medicine). Low-fiber diet. A.D.A.M.; reviewed 2024-07-24.",key:"궤양성 대장염·크론병 악화기에 쓰는 식사. 섬유가 많은 음식은 변의 부피를 키우므로, 저섬유 음식은 변의 크기를 줄이고 덜 뭉치게 함. 1회 제공량당 식이섬유 2g 미만인 식품을 고르고, 하루 섭취량은 의료진이 예컨대 10–15g 이하로 정함."},
 27:{short:"식품의약품안전처, 전국통합식품영양성분정보 표준데이터",cite:"식품의약품안전처·농촌진흥청·국립수산과학원. 전국통합식품영양성분정보(원재료성식품/음식/가공식품) 표준데이터, 공공데이터포털(2026 기준); 가공식품 품목별 영양성분 DB(2022.12.31); 원재료코드 현황(2023.01.11).",key:"이 앱의 식품별 100g당 열량·단백질·지방·탄수화물·식이섬유·칼슘·철 값과, 원재료 확인에 쓰는 식품첨가물 공식 명칭·이명의 출처."},
 28:{short:"식품 등의 표시·광고에 관한 법률 시행규칙 별표 2",cite:"식품의약품안전처. 식품 등의 표시·광고에 관한 법률 시행규칙 [별표 2] Ⅰ.1.가. 알레르기 유발물질 표시 대상; 어린이 식생활안전관리 특별법 제11조의2.",key:"표시 대상: 알류(가금류), 우유, 메밀, 땅콩, 대두, 밀, 고등어, 게, 새우, 돼지고기, 복숭아, 토마토, 아황산류(이산화황 10mg/kg 이상), 호두, 닭고기, 쇠고기, 오징어, 조개류(굴·전복·홍합 포함), 잣."},
 36:{short:"서울아산병원, 궤양성대장염식(식사요법)",cite:"서울아산병원 건강정보 > 의료정보 > 식사요법 > 궤양성대장염식. amc.seoul.kr (추천 식단 포함).",key:"소량씩 잦은(하루 6회 이상) 식사로 자극을 줄이고 흡수를 높임. 저잔사식으로 대변량 감소. 설사로 인한 탈수를 막기 위해 체중 kg당 30cc 수분 섭취. 유당불내성이면 우유·유제품 제한. MCT 오일과 영양음료로 부족한 열량 보충. 증상과 개인 순응도에 따라 점차 일반식으로 이행. 약물-영양소 상호작용: 코티코스테로이드는 칼슘·단백질, 설파살라진은 엽산, 콜레스티라민은 지방·비타민 흡수를 저해. 추천 식단 예: 흰죽, 국물, 연두부찜, 병어조림, 애호박나물, 가자미찜, 계란찜, 가지나물, 불고기, 새우살찜, 물김치 국물, 간식으로 영양음료·오렌지주스·두유."},
 37:{short:"대한장연구학회, 염증성 장질환 영양과 식이요법(IBD 브로셔 No.6)",cite:"대한장연구학회. 염증성 장질환 영양과 식이요법, KASID IBD brochure No.6 (도움말·사진: 이대목동병원 영양사 강병진). PDF 작성 2017-03.",key:"활동기: 섭취량을 줄여 소량씩 자주, 부드러운 죽에 살코기·연두부·달걀·굴 등을 더해 영양 밀도를 높임. 기름은 줄이고 등푸른 생선 기름도 소화가 어려울 수 있어 담백한 흰살생선이 나을 수 있음. 자극적인 음식·탄산을 피하고 채소는 푹 익힌 것도 피하는 것이 좋음. 부족한 열량은 처방 영양액으로 보충. 관해기: 엄격한 제한은 필요 없고, 감자·고구마·꿀로 열량을 보충하며 생선·계란·수육·살코기를 기름 줄이는 조리법으로 먹음. 고등어·삼치·꽁치 같은 등푸른 생선을 주 3회 이상, 볶음·무침에는 신선한 들기름. 우유·유제품은 칼슘 공급원이며 질병을 악화시킨다는 근거가 없고, 불편하면 유당 분해 우유. 증상을 일으키기 쉬운 음식: 기름진 음식, 조개·소라, 고기 힘줄 같은 질긴 음식, 탄산음료, 자극성 향신료, 인공 감미료, 질긴 산나물·해초·견과류·팝콘, 당분이 많은 음식, 음주·폭식, 카페인. 육가공품은 되도록 먹지 않고 보이는 지방은 떼어냄. 관해기에도 익혀도 질긴 채소는 피하고 푹 익히거나 잘게·갈아서 조리."},
 39:{short:"가천대 길병원 염증성장질환센터, 식이 안내",cite:"가천대 길병원 염증성장질환센터. 일상생활 > 식이·식단표·저잔사식·프로바이오틱스(ibd.gilhospital.com/life01_01, life01_02, life01_04, life01_05).",key:"일반적으로 적용할 식이 지침은 없고 섬유소가 적고 부드러운 음식, 소량씩 자주 식사, 식이 일지로 먹을 수 있는 음식을 찾기. 급성기(설사·혈변·복통이 심할 때): 부드러운 죽·미음, 저섬유소식·저잔사식, 지방이 적은 단백질 반찬(흰살생선, 계란찜, 연두부, 두부), 간식이나 영양 보충 음료. 관해기: 아침식사 꼭, 생선 주 2~3회, 매 식사 두부·생선·살코기·계란 반찬, 부드러운 채소, 과일, 불편하지 않으면 유제품, 충분한 수분. 피할 음식: 과도한 지방(튀김·빵·라면), 단당류(콜라·사이다·아이스크림·초콜릿), 과도한 카페인·탄산, 섭취 시 불편했던 음식. 증상 악화를 잘 일으키는 음식: 콩, 야채, 절인 채소, 오렌지·레몬, 과일 주스, 시거나 맵고 짠 음식, 기름진 음식, 마가린, 설탕, 카페인 음료, 과도한 술. 저잔사식 허용: 흰밥·찹쌀밥·면류·부드러운 빵·백설기·감자, 껍질 뺀 생선·계란·두부·새우·게살·살코기, 애호박·오이·무·가지·배추·양파·시금치·양송이·양상추·배추김치·깍두기·물김치, 우유·발효유·두유·푸딩·치즈, 식용유·참기름·들기름·올리브유, 저잔사 영양보충음료. 제한: 보리·현미·율무·팥 등 잡곡, 고구마, 옥수수, 통밀빵, 도넛, 찰떡, 팝콘, 떡국떡, 기름지고 질긴 육류, 가공육, 조개류, 익히지 않은 동물성 식품, 미나리·도라지·고사리·콩나물·우엉·숙주·당근·셀러리·질긴 버섯·말린 나물·해조류·열무김치·갓김치·파김치, 감류·설익은 과일·파인애플·말린 과일·키위·토마토·딸기처럼 씨와 껍질째 먹는 과일, 건더기가 든 유제품, 땅콩·잣·아몬드·호두·해바라기씨, 김밥, 민간요법, 탄산·카페인 음료, 지나치게 매운 음식. 퇴원 후 1~2주는 죽에서 진밥으로 진행하며 하루 4~6회 소량씩, 고기·생선은 작게 자르거나 갈아서 부드럽게 익힘. 채소는 껍질·줄기를 없애고 무르게 조리해 한 끼 1가지 1/2분량(35g)을 꼭꼭 씹어 먹음. 과일 하루 양: 사과 중 1/2개, 배 1/4개, 복숭아 1/2개, 포도 19알, 수박 중 1쪽, 멜론 1조각, 귤 소 2개, 맑은 과일주스, 잘 익은 바나나 소 1/2개. 종합비타민을 정기적으로 복용하도록 권장, 설파살라진·메토트렉세이트를 오래 먹으면 엽산 하루 1mg 보충. 프로바이오틱스는 문제가 없으면 먹어도 되지만 약물치료를 대신할 근거는 없음."},
 40:{short:"대한장연구학회 IBD 연구회, 궤양성 대장염 치료 가이드라인 개정판(2017)",cite:"최창환, 문원, 김유선 외, 대한장연구학회 IBD 연구회. 궤양성 대장염 치료 가이드라인 개정판. 대한소화기학회지. 2017;69(1):1-28.",key:"전신 독성 증상을 동반한 중증 궤양성 대장염은 입원 치료가 필요하며 내과적 응급상황에 가까움. 탈수와 전해질 이상을 교정해야 함. 중등도-중증 궤양성 대장염의 영양 공급은 가능하면 경구 식이 또는 경장 영양을 권장하고, 금식이 중증 궤양성 대장염의 경과를 호전시킨다는 증거는 없음. 완전 비경구 영양은 주 치료법으로 효과가 없음. ※ 2023년 개정 지침(Na SY 외. Intest Res 2023;21(1):61-87, doi:10.5217/ir.2022.00007)은 생물학제제·소분자 약제 권고만 다루고 영양 권고가 없어, 영양 관련 문장은 2017판을 인용(영문판: Choi CH 외. Intest Res 2017;15(1):7-37)."},
 41:{short:"대한장연구학회, 환자용 염증성 장질환 브로셔(2022–2024)",cite:"대한장연구학회. KASID IBD brochure No.1–10(궤양성 대장염이란, 환자의 일상생활, 영양과 식이요법, 임신과 수유, 그것이 궁금해요 FAQ 등). 각 브로셔 저작권 표기 2022, 묶음 PDF 2024-10.",key:"궤양성 대장염은 심한 경우 식욕부진, 오심, 구토, 발열, 체중 감소가 생길 수 있음. 여행 안내: 고열(37.5℃ 이상), 오한, 다량의 혈성 설사, 지속적인 심한 복통이 있으면 치료를 미루지 않고 현지 의료기관을 방문. 금주·금연은 필수. 스트레스·불안·우울로 2주 이상 일상생활이 방해되면 정신건강의학 전문의 상담. 식이조절: 스테로이드 치료 중에는 저염식이 붓기를 막아 줌, 섬유질 많은 음식(생야채·잡곡·씨앗·견과류)은 설사·배변 횟수를 늘리므로 저섬유식, 유제품으로 설사하면 피함, 체중이 많이 빠지면 고칼로리 식사, 기름지거나 튀긴 음식·당분 많은 음료·카페인은 설사나 가스를 악화, 담백하고 부드러운 음식을 적게 자주, 음식 일지로 악화 음식 찾기. 병원에 갈 때 알릴 것: 약을 제대로 못 먹은 적, 최근 1주 설사 횟수와 양, 혈변, 몸 상태, 피부 반점·염증, 관절 통증, 눈 문제, 항문·서혜부·회음부 문제, 우울감이나 죽고 싶다는 생각, 한약이나 항생제 복용. 예방접종: 진단 때 주치의와 계획을 세우고, 독감은 매년, 면역억제 치료 기간에는 생백신 금기(치료 시작 최소 4주 전에 완료, 치료 종료 후 3개월까지 금지), 사백신은 치료 최소 2주 전에 완료하는 것이 이상적."},
 42:{short:"ACG 임상 가이드라인: IBD 예방 관리(2025)",cite:"Farraye FA, Melmed GY, Lichtenstein GR, et al. ACG Clinical Guideline Update: Preventive Care in Inflammatory Bowel Disease. Am J Gastroenterol. 2025;120(7):1447-1473.",key:"모든 성인 IBD 환자는 매년 독감 백신. 면역조절 치료 중에는 생백신을 맞지 않음. 50세 이상은 폐렴구균·대상포진 백신, 19세 이상도 면역조절 치료 중이면 고려. B형간염 면역이 없으면 접종. 우울·불안은 진단 때와 매년 선별하고 양성이면 상담 연결. 흑색종 검진 매년, 면역조절제 사용 중 비흑색종 피부암 검진 매년. 면역조절 치료 중인 여성은 자궁경부암 검진 강화. 골밀도 저하 위험 요인이 있으면 골밀도 검사. 흡연자는 금연 상담."},
 38:{short:"대한장연구학회 IBD 연구회, 궤양성 대장염 진단 가이드라인(2009)",cite:"최창환, 정성애, 이보인, 이강문, 김주성, 한동수, 대한장연구학회 IBD 연구회. 궤양성 대장염 진단 가이드라인. 대한소화기학회지. 2009;53(3):145-160.",key:"임상 중증도(Truelove·Witts): 관해는 배변 하루 3회 이하, 혈변과 대변절박증이 없는 경우. 경도는 하루 4회 이하, 혈변은 간헐적·소량, 전신 증상 없음. 중등도는 하루 4회 이상 배변과 혈변, 경미한 전신 증상. 중증은 하루 6회 이상 설사와 육안적 혈변을 항상 동반하고, 발열(저녁 평균 체온 37.5℃ 이상 또는 4일 중 2일 이상 37.8℃ 이상)과 빈맥(평균 맥박 90회/분 이상) 중 하나를 포함해 전신 증상(발열·빈맥·빈혈·ESR 상승) 2개 이상. 전격성은 중증 기준에 더해 하루 15회 이상 설사, 지속 출혈, 수혈이 필요한 빈혈, 38.0℃ 이상 고열 등."},
 43:{short:"Cohen 등, IBD 환자의 식이와 증상 자가보고 연구(2013)",cite:"Cohen AB, Lee D, Long MD, Kappelman MD, Martin CF, Sandler RS, Lewis JD. Dietary patterns and self-reported associations of diet with symptoms of inflammatory bowel disease. Dig Dis Sci. 2013;58(5):1322-1328.",key:"IBD 환자 2,329명(궤양성 대장염 597명 포함)의 자유응답 분석. 요구르트·쌀·바나나는 증상을 좋게 한다는 응답이 많았고, 잎채소가 아닌 채소·매운 음식·과일·견과·잎채소·튀김·우유·붉은 고기·탄산음료·팝콘·유제품·술·고섬유 식품·옥수수·기름진 음식·씨앗·커피·콩은 증상을 악화시킨다는 응답이 많았음. 환자 자가보고라 인과관계를 뜻하지는 않음."},
 44:{short:"Chassaing 등, 유화제 CMC 무작위 급식 시험(2022)",cite:"Chassaing B, Compher C, Bonhomme B, et al. Randomized Controlled-Feeding Study of Dietary Emulsifier Carboxymethylcellulose Reveals Detrimental Impacts on the Gut Microbiota and Metabolome. Gastroenterology. 2022;162(3):743-756.",key:"건강한 성인에게 첨가물 없는 식단과 여기에 유화제 카복시메틸셀룰로스(CMC)를 더한 식단을 11일간 제공한 무작위 급식 시험. CMC를 먹은 군에서 장내 미생물 구성이 바뀌고 유익한 대사산물(단쇄지방산 등)이 줄었으며, 일부 참가자에서는 미생물이 장 점막 가까이 침투함."},
 45:{short:"Chen 등, 궤양성 대장염 SCD 대 지중해식 무작위 급식 시험(2026)",cite:"Chen AS-Y, Nguyen LH, Gray B, et al. Specific carbohydrate diet versus Mediterranean diet in adult patients with mild to moderate ulcerative colitis: a randomized controlled-feeding trial. Front Nutr. 2026;13:1838160.",key:"경증~중등도 궤양성 대장염 성인 17명을 특정 탄수화물 식단(SCD)과 지중해식에 무작위 배정해 6주간 식사를 제공. 부분 Mayo 점수 변화는 SCD −0.8, 지중해식 −1.3으로 차이가 없었고(p=0.499), 탈락률이 52.9%로 높아 해석에 한계가 있음."},
 46:{short:"세브란스병원 영양팀, 염증성장질환의 식사요법(2024)",cite:"세브란스병원 영양팀. 염증성장질환의 식사요법 Inflammatory bowel disease (IBD). 세브란스병원 건강정보, 2024-08-04. sev.severance.healthcare.",key:"보고에 따라 약 60–70%가 저체중·영양불량. 규칙적으로 먹고, 식사량이 부족하면 영양죽·으깬 감자·삶은 계란 같은 간식을 활용. 관해기에는 비교적 제한 없이 다양한 식품 섭취. 우유로 설사가 생기면 피하되, 떠먹는 요구르트·치즈 같은 발효 제품이나 유당을 제거한 우유는 괜찮은 경우도 있고, 유제품을 오래 못 먹으면 칼슘·비타민 D 보충제를 고려. 염증이 심하거나 장이 좁아져 있으면 과일·채소의 줄기·껍질·씨앗, 통곡물, 견과류, 육류의 껍질·결체조직을 피하고 계란찜·연두부·흰살생선 조림처럼 부드러운 단백질을 먹음. 혈변이 잦으면 철이 많고 흡수가 좋은 붉은 육류·생선·간·굴·달걀노른자를 먹고, 커피·차·탄산음료는 철 흡수를 방해하므로 식사 중이나 직후에 마시지 않음."},
 47:{short:"Monash University, 감미료와 저FODMAP 식단(2020)",cite:"Rhys-Jones D. Sweeteners and the low FODMAP diet. Monash University FODMAP blog, 2020-05-20. monashfodmap.com/blog/sweeteners-and-low-fodmap-diet.",key:"당알코올(폴리올: 자일리톨·만니톨·솔비톨·에리스리톨·말티톨·이소말트·락티톨)은 소장에서 천천히 일부(약 30%)만 흡수돼 장으로 물을 끌어들이고 복부팽만·설사를 일으킴. Monash 연구에서 솔비톨 또는 만니톨 10g이 과민성장증후군 환자의 위장 증상을 건강인보다 뚜렷이 늘림. 당알코올로 단맛을 낸 껌 등에는 과량 섭취 시 설사할 수 있다는 표시가 붙기도 함. 스테비아·수크랄로스·아스파탐은 비영양 감미료로 분류하고 FODMAP 여부는 따로 밝히지 않음."},
 48:{short:"식품의약품안전처, 스테비아 토마토 보도참고자료(2026)",cite:"식품의약품안전처 보도참고자료 「\"스테비아 토마토\", 농산물이 아닌 가공식품입니다」, 2026-08-06(대한민국 정책브리핑 korea.kr, newsId=156773503). 인용 문장은 같은 날 헬스경향 보도(k-health.com/news/articleView.html?idxno=100512).",key:"스테비아 토마토는 신품종이 아니라 식품유형상 과·채가공품으로, 세척한 방울토마토에 효소처리스테비아나 수크랄로스 등이 든 침지액을 가압·진공 방식으로 주입한 뒤 다시 세척·건조·포장해 만듦. 일반 농산물인 토마토와 구분해야 하며 '신품종'·'천연당분' 등으로 농산물처럼 광고한 업체를 적발. 표시된 보관방법을 지키고 소비기한 안에 먹을 것."},
 49:{short:"티젠 콤부차 매실 상품정보 고시(원재료명)",cite:"티젠 콤부차 매실 상품정보 제공고시, SSG닷컴(2026-09 확인).",key:"원재료명: 구연산, 에리스리톨, 탄산수소나트륨, 음료베이스, 난소화성말토덱스트린, 프락토올리고당, 매실추출분말, 향료, 홍차추출분말, 수크랄로스, 아세설팜칼륨, 유산균혼합분말, 제삼인산칼슘. ※ 제조사 공식몰은 원재료명을 이미지로만 보여 줘 판매처 고시 문구를 인용."},
 50:{short:"ECCO 식이 관리 합의문(2025)",cite:"Svolos V, Gordon H, Lomer MCE, et al. European Crohn's and Colitis Organisation consensus on dietary management of inflammatory bowel disease. J Crohns Colitis. 2025;19(9):jjaf122. doi:10.1093/ecco-jcc/jjaf122.",key:"궤양성 대장염의 관해 유도를 위해 권장되는 식단은 없음. 관해 유지에는 지중해식을 약물과 함께 고려할 수 있고, 붉은 고기·가공육 섭취를 줄이는 것을 고려. 우유 단백을 빼는 식단은 관해 유도 보조로 권장하지 않음. 저섬유·고섬유 식단 모두 관해 유도 효과의 일관된 근거가 없고 유지 치료로도 권장하지 않음. 관해기에 과민성장증후군 같은 증상이 있으면 저FODMAP 식단을 권장. 모든 IBD 환자는 건강한 식생활 지침을 따르고, IBD 경험이 있는 영양사의 도움을 받을 수 있어야 함."},
 51:{short:"Monash University, 성분표 읽기와 FODMAP(2021)",cite:"Rhys-Jones D, Collins L. Label reading and FODMAPs. Monash University FODMAP blog, 2021-09-03. monashfodmap.com/blog/update-label-reading.",key:"양파·마늘·이눌린·프락토올리고당(FOS)·갈락토올리고당(GOS)은 아주 적은 양도 식품의 FODMAP을 크게 늘림. 장 건강을 내세운 제품에는 이눌린·치커리 뿌리(섬유)·돼지감자 가루·FOS·GOS를 넣는 경우가 많고, 이런 원료는 발효돼 과민성장증후군 증상을 일으킬 수 있음."},
 52:{short:"Monash University, 식품별 FODMAP 안내 모음(블로그·안내문)",cite:"Monash University FODMAP team. monashfodmap.com 블로그·안내문: Update: bananas re-tested; FODMAP stacking – can I overeat green foods?; Dairy alternatives: beverage and yoghurt low FODMAP options; Fermented foods and FODMAPs; Low FODMAP shopping list; Low FODMAP meal planning; Getting enough fibre; Using herbs and spices on a low FODMAP diet; Going dry July; Fructans and FODMAP reintroduction; Winter warming fun: Asian hot pot; The low FODMAP diet in East and South Asia; Re-tested food: wasabi paste vs wasabi powder; 3-step FODMAP diet A4 info sheet(2026). 2026-09 확인.",key:"고구마 75g 낮음(100g 넘으면 만니톨 중간, 112g 넘으면 높음). 단단한 바나나 낮음, 잘 익은 바나나는 1/3개까지. 애호박 65g·시금치 75g·칸탈루프 120g 낮음. 오트 음료 104ml까지 낮고 250ml면 높음. 아몬드 10알 낮음. 커피 자체는 낮음. 와인·증류주 낮음(럼·레드와인 250ml 초과·스위트 와인 높음). 간장·굴소스·피시소스·케첩·겨자·식초·마요네즈·버터 낮음. 한국 된장은 시험되지 않음(김치도 2017년 글 기준 시험 전이었고, 이후 앱 결과는 [58]). 보리는 프럭탄 높음. 와사비 페이스트는 솔비톨로 높고 가루는 낮음."},
 53:{short:"시판 영양식 제품 표시(판매처 상품정보 제공고시)",cite:"롯데아이몰 상품정보 제공고시: 뉴케어 구수한맛 순·구수한맛 밸런스업·커피맛·당플랜 호두맛·올프로틴 고소한맛·캔서플랜·하이프로틴·액티브 오리지널, 메디웰 구수한맛·신장식 비투석, 케어웰 구수한맛, 한미 케어미 완전균형영양식. G마켓 상품정보 제공고시: 뉴케어 당플랜 프로 호두맛·인절미맛, 혈압플랜 구수한맛, 미니 구수한맛, 화이바·IBD 플러스(원재료명). SK스토아 상품정보 제공고시: 뉴케어 미니 고소한 검은깨. 이스케어몰 상품정보: 뉴케어 검은깨맛·딸기맛. 코스트코 코리아 상품정보: 뉴케어 구수한맛 플러스. 신세계쇼핑·동원몰 상품정보 제공고시: 큐어웰 고소한맛. 컬리: 뉴케어 액티브 오리지널·테이크핏 맥스(알레르기 표시). 다나와 제품 정보: 메디웰 구수한맛·케어웰(열량), 모노웰. 2026-09-25~26 확인.",key:"식품유형(환자용식품·일반환자용 균형영양조제식품·당뇨환자용·암환자용 영양조제식품·혼합음료), 1팩 영양성분, 원재료명(감미료·프락토올리고당·치커리 식이섬유 등). 특수의료용도식품 포장 문구 예: '본 제품은 특수의료용도식품으로 사용 전 의사, 임상영양사 등 전문가와 상담 후 섭취'(뉴케어 구수한맛 밸런스업), '사용 전 의사의 지시에 따라 섭취'(뉴케어 커피맛)."},
 54:{short:"제조사 제품 안내·출시 기사(영양식)",cite:"정식품 그린비아 제품 안내(영양케어·당뇨솔루션·장솔루션·알디·알디플러스, vegemil.co.kr/greenbia); 대상웰라이프몰 제품 정보(뉴케어 IBD 플러스·IBD 아미노·화이바·칼로리1.5·KD·율무맛 락토프리); 데일리스마트 「뉴케어 율무맛 락토프리」 출시 기사(2026-06-11); 쿡앤셰프 「뉴케어 당플랜 프로」 출시 기사(2021-03-02); 헬스경향 「뉴케어 혈압플랜」 기사(2024-04-22); 팜뉴스 「큐어웰 고소한맛」 출시 기사(2025-03-26); 큐어웰 당큐어 출시 기사(2026-08); 식품음료신문 「소화∙흡수 어려운 장질환자 위한 영양식 나온다」(2023-09-19, kfmn.co.kr); 이엠디 「한독, 크론병 환자용 영양식 '엘리멘탈028 엑스트라' 바나나향 출시」(2024-12-19). 2026-09-25~26 확인.",key:"뉴케어 IBD 플러스: 장질환자용 단백가수분해 영양조제식품, 단백질 8.5g을 유당 없이, 단백질 100% 가수분해유청단백, 지방의 70% MCT. 뉴케어 IBD 아미노: 기타환자용 영양조제식품(100g×10포), 아미노산 기반 성분영양식, 유당·글루텐 뺌, 크론병·궤양성 대장염 환자 영양 공급용. 그린비아 알디: 단백질 제한이 필요한 비투석 신장질환자용. 그린비아 장솔루션: 경관 급식 전용, 가수분해 유청단백, 발효성 당류(FODMAP) 제한. 엘리멘탈028 엑스트라: 아미노산 기반, 1포 427kcal, 크론병·궤양성 대장염·난치성 흡수장애·단장증후군·장누공 환자가 섭취할 수 있음. 그린비아 알디플러스: 투석 신장질환자용. 뉴케어 KD는 비투석, 케이디플러스는 투석 신장질환자용. 뉴케어 율무맛 락토프리: 혼합음료, 우유 유래 단백질에서 유당을 제거하고 식물성 단백질을 더함, 150mL 65kcal. 뉴케어 당플랜 프로: 140kcal, 단백질 12g, 식이섬유 5g, 나트륨 173mg, 설탕 대신 알룰로스. 큐어웰 당큐어: 유당 0g, 흑임자·오곡 추출물, MCT 오일, 분리대두단백."},
 55:{short:"Monash University, FODMAP 전수 점검 자료(2026)",cite:"Monash University FODMAP team. monashfodmap.com 블로그: Low FODMAP shopping list(2025-02); 10 foods you didn't know you could eat on a low FODMAP diet(2015); Getting enough fibre on a low FODMAP diet; FODMAP stacking explained; Fermented foods and FODMAPs(2017); Update: new fermented drinks added to the app(2017); Tips for following a low FODMAP diet in Singapore; Debunking the myth behind superfoods(2015). 논문: Varney J, et al. Implementing a fermentable oligosaccharides, disaccharides, monosaccharides, and polyols diet in Asia: addressing cultural, clinical and practical challenges. J Neurogastroenterol Motil. 2025;31(4):422-437. PMID 41077745. 2026-09-27 확인.",key:"느타리버섯·단호박(kabocha)·초록 피망·가지·청경채·옥수수 알갱이는 1회량(75g) 저FODMAP, 통조림 리치 저FODMAP. 옥수수는 한 개면 고FODMAP이고 반 개(38g)는 저FODMAP. 방울토마토 3개(45g) 저FODMAP(더 많으면 프럭탄·GOS·과당). 메밀국수(소바) 1/3컵(90g), 메밀 알곡 135g, 현미밥 1컵(180g), 마른 귀리 1/2컵(52g), 호두 10알(30g), 땅콩 32알(28g), 단단한 두부 2/3컵(160g)은 저FODMAP. 오이피클(gherkin) 저FODMAP, 여러 채소를 섞은 피클은 고FODMAP. 콤부차에서 프럭탄이 나와 한 병을 다 마시면 맞지 않을 수 있음. 용과·허니듀 멜론·파인애플은 저FODMAP 양이 있음. 버블 밀크티 대신 우유를 넣지 않은 홍차·녹차를 저FODMAP 대안으로 제시(2025 논문). 코코넛 워터는 100ml 저FODMAP, 250ml 넘으면 프럭탄·솔비톨."},
 56:{short:"Iacovou 외, 동아시아·동남아시아의 저FODMAP 식단(2015, Monash)",cite:"Iacovou M, Tan V, Muir JG, Gibson PR. The low FODMAP diet and its application in East and Southeast Asia. J Neurogastroenterol Motil. 2015;21(4):459-470. PMC4622128.",key:"된장·고추장·쌈장에는 마늘·양파·콩, 때로 밀가루 같은 고FODMAP 재료가 함께 들어 고FODMAP 목록에 오를 가능성이 크지만, 실제로 먹는 양의 완제품은 측정해 봐야 함. 셀러리는 반 줄기(19g)보다 많이 먹으면 고FODMAP."},
 57:{short:"Biesiekierski 외, 가공 곡물·시리얼의 프럭탄 정량(2011, Monash)",cite:"Biesiekierski JR, Rosella O, Rose R, et al. Quantification of fructans, galacto-oligosacharides and other short-chain carbohydrates in processed grains and cereals. J Hum Nutr Diet. 2011;24(2):154-176. PMID 21332832.",key:"가공 곡물 제품 가운데 프럭탄이 가장 적은 것은 쌀(0g)과 감자칩(1회량 0.05g)."},
 58:{short:"FODMAP Everyday, Monash 앱 결과 정리(2차 자료)",cite:"FODMAP Everyday(fodmapeveryday.com, 영양사 운영): Is kimchi low FODMAP?(2020-06); Are grapes low FODMAP?(2025-06 갱신); Foods with a trace of FODMAPs(2024-08); High FODMAP foods with low FODMAP serving sizes(2025-06); All about sushi & the low FODMAP diet(2025-06); Soy products & the low FODMAP diet(2025-06); Pine nuts; Strawberries; Dragon fruit; Kiwi; Mandarins; Pumpkin; Radishes; Is corn low FODMAP?; All about Asian noodles & FODMAPs; All about chile & the low FODMAP diet; 레시피 글(리치·자몽·오렌지 주스·표고·목이버섯·파인애플). 2026-09-27 확인. 재료 페이지(Broccoli; Bok choy; Cantaloupe; Mandarins; Potatoes; Peaches; Radishes; Strawberries; Oats; Cabbage; Lentils; Quinoa; Pine nuts; Peanut butter; Cauliflower; Dragon fruit; Pumpkin & squash)와 Are bananas low FODMAP?(2024-04 갱신)·Are apples low FODMAP?(2026-04 갱신)은 2026-10-06 크롬으로 다시 확인. Monash 앱 결과를 옮긴 2차 자료로, 앱의 최신 값과 다를 수 있음.",key:"배추김치(양파·마늘 포함) 47g 저FODMAP(2020 앱 갱신). 포도 2알 저FODMAP, 3알부터 과당 과다(2024 재분석). 말린 목이버섯 70g·근대는 FODMAP이 극미량. 말린 표고 7g 저FODMAP. 김 5g(500g까지) 저FODMAP, 미역 5g 저FODMAP·10g 만니톨 중간. 다시마·콩나물은 Monash가 시험하지 않음. 셀러리 10g 저FODMAP(1회량은 고FODMAP). 딸기 65g, 블루베리 125g, 키위 150g, 귤 90g, 오렌지 130g, 파인애플 140g, 용과 330g, 생 리치 30g, 자몽 80g, 오렌지 주스 125ml, 딸기잼 40g 저FODMAP. 잣 8g 저·9g 중간·30g 고FODMAP. 미소 12g 저FODMAP. 말린 고추 플레이크 2g 저FODMAP·13g 과당 중간, 고춧가루는 시험되지 않음. 단호박 75g 저·162g 중간·206g 고FODMAP. 옥수수 알갱이 1/2컵(75g) 저FODMAP. 소바 1/3컵(90g) 저FODMAP(밀·메밀 혼합 면). 2026-10-06 재확인: 브로콜리 꽃송이 75g 저·208g 중간·279g 고(프럭탄, 뒤 시험에서 과당), 흰 무 75g 저·279g 중간·350g 고, 배추 75g 저·500g 프럭탄 중간, 양배추 75g 저(프럭탄), 청경채 75g, 칸탈루프 120g 저(150g 넘으면 프럭탄 주의), 감자 75g(500g까지 낮게 시험), 고구마 75g 저·100g 중간, 황도 30g 저(솔비톨), 국물 뺀 통조림 복숭아 80g 고(프럭탄·솔비톨), 단단한 바나나 95g·잘 익은 바나나 37g 저(프럭탄), 사과 소스 3g 저, 빨간 렌틸콩 삶은 것 23g·통조림 렌틸콩 46g 저, 익힌 퀴노아 155g 저, 잣 8g 저·9g 중간·30g 고(프럭탄·GOS), 땅콩버터 2큰술 저, 흰 콜리플라워 75g 고(만니톨), 아보카도 60g 저(예전 30g), 단호박(껍질째 생것) 75g 저·162g 중간·206g 고."},
 59:{short:"Narula 외, 식품 가공도와 IBD 위험 메타분석(2023)",cite:"Narula N, Chang NH, Mohammad D, Wong ECL, Ananthakrishnan AN, Chan SSM, Carbonnel F, Meyer A. Food Processing and Risk of Inflammatory Bowel Disease: A Systematic Review and Meta-Analysis. Clin Gastroenterol Hepatol. 2023;21(10):2483-2495.e1. doi:10.1016/j.cgh.2023.01.012.",key:"코호트 5개, 100만 명 이상. 초가공식품을 많이 먹을수록 크론병 발생 위험이 높았고(HR 1.71), 가공이 적은 식품을 많이 먹을수록 낮았음(HR 0.71). 궤양성 대장염은 어느 쪽과도 뚜렷한 관련이 없었음. 발생 위험 연구로, 이미 궤양성 대장염이 있는 사람의 악화를 본 연구는 아님."},
 60:{short:"Meyer 외, 식이와 IBD 위험 체계적 문헌고찰·메타분석(2025)",cite:"Meyer A, Agrawal M, Savin-Shalom E, Wong ECL, Levinson C, Gold S, Narula N, Colombel JF, Carbonnel F. Impact of diet on inflammatory bowel disease risk: systematic review, meta-analyses and implications for prevention. EClinicalMedicine. 2025;86:103353. doi:10.1016/j.eclinm.2025.103353. PMID 40697960.",key:"연구 72개(성인 약 204만 명, 평균 12.8년 추적). 염증성 식단·초가공식품은 크론병 위험을 높이고, 고섬유·지중해식·가공이 적은 식품은 낮췄음. 궤양성 대장염 위험은 개별 식품이나 식사 유형과 일관된 관련이 없었음."},
 61:{short:"Wellens 외, 식이 유화제 5종 위약 대조 무작위 시험(2026)",cite:"Wellens J, Vanderstappen J, Hoekx S, et al. Effect of Five Dietary Emulsifiers on Inflammation, Permeability, and the Gut Microbiome: A Placebo-controlled Randomized Trial. Clin Gastroenterol Hepatol. 2026;24(4):1092-1101. doi:10.1016/j.cgh.2025.08.005. PMID 40816342.",key:"건강한 성인 60명에게 2주간 유화제 없는 식단 뒤 유화제 5종 가운데 하나 또는 위약을 4주간 먹임. 군 사이에 대변 칼프로텍틴·CRP·혈청 LBP 차이는 없었고, 카복시메틸셀룰로스(CMC)를 먹은 군은 단쇄지방산이 낮았음. 저자들은 유화제를 줄이는 것이 장에 이로울 가능성이 있어 연구가 더 필요하다고 결론."},

 70:{short:"시판 라면 포장 표시(삼양식품 홈페이지)",cite:"삼양식품(samyangfoods.com) 제품 상세 이미지의 ‘제품상세정보’(영양정보·원재료명·알레르기): 삼양라면(봉지·컵·큰컵), 불닭볶음면(봉지·컵·큰컵), 까르보불닭볶음면, 짜짜로니, 맛있는라면, 간짬뽕, 삼양1963. 2026-10-01 확인.",key:"포장의 1개당 영양정보와 원재료명, 알레르기 ‘함유’ 표시. 식약처 가공식품 DB 가장 최근 행과 맞고 표시 열량이 계산과 맞는 제품만 씀(삼양라면 매운맛·나가사끼짬뽕·까르보불닭 큰컵은 맞지 않거나 DB 행이 없어 뺌). 까르보불닭볶음면은 같은 페이지 요약(550kcal)과 포장 표시(530kcal)가 달라, 식약처 DB와 맞는 포장 표시를 씀."},
 71:{short:"서울대학교병원 N의학정보, 궤양성 대장염 식이요법",cite:"서울대학교병원 N의학정보. 궤양성 대장염 > 식이요법/생활가이드. snuh.org/health/nMedInfo (medid AA000297, 2026-10-04 확인).",key:"도움이 되는 특별한 음식은 없으며 충분한 영양 공급과 균형 잡힌 식사가 중요. 증상을 악화시키는 음식으로 콩, 야채, 절인 채소, 오렌지, 레몬, 과일 주스, 시거나 맵고 짠 음식, 기름진 음식, 마가린, 설탕, 카페인 음료, 우유 등을 들 수 있지만 항상 악화시키는 것은 아니므로, 무조건 피하기보다 식사 일지로 식사와 증상의 관계를 알아보는 것이 좋음."},
 72:{short:"GLIM 영양불량 진단 기준(2019)",cite:"Cederholm T, Jensen GL, Correia MITD, et al. GLIM criteria for the diagnosis of malnutrition – A consensus report from the global clinical nutrition community. J Cachexia Sarcopenia Muscle. 2019;10(1):207-217. (Clin Nutr. 2019;38(1):1-9 동시 게재)",key:"의도하지 않은 체중 감소는 영양불량의 표현형 기준입니다: 6개월 안에 5% 넘게, 또는 6개월을 넘는 기간에 10% 넘게 줄어듦. 중증(2단계)은 6개월 안에 10% 넘게, 또는 6개월을 넘겨 20% 넘게. 아시아의 낮은 BMI 기준은 70세 미만 18.5 미만, 70세 넘으면 20 미만. 진단에는 표현형 기준 1개와 원인 기준 1개가 함께 필요하고, 먼저 선별 도구로 위험을 찾도록 합니다."},
 73:{short:"대한비만학회, 비만 식사치료 안내",cite:"대한비만학회 일반인 사이트. 비만식사치료 > 체중조절 식생활(체질량지수로 비만도 판정, 표준체중, 활동에 따른 단위체중당 열량). general.kosso.or.kr/html/?pmode=nutritionDiet. 2026-10-06 확인.",key:"정상 BMI 18.5–22.9, 과체중 23–24.9, 비만 25 이상. 현재 체중 유지에 필요한 열량 = 현재 체중 × 활동에 따른 kg당 열량(가벼운 활동: 저체중 35, 정상 30, 체중 과다·비만 20–25 kcal/kg)."},
 74:{short:"FAO/INFOODS 음식 맞추기 지침(2012)",cite:"FAO/INFOODS. FAO/INFOODS Guidelines for Food Matching, Version 1.2. Rome: FAO; 2012.",key:"먹은 음식을 성분표 항목에 맞출 때 설명·조리법이 맞는 항목을 고르고, 여러 항목을 맞추면 그 값들의 평균(가능하면 가중 평균)을 씁니다. 어떤 항목을 골랐는지 기록하고 맞추기 품질을 밝히며, 수분 함량을 비교해 확인합니다."},
 75:{short:"Greenfield·Southgate, 식품성분자료 생산·관리·이용(FAO, 2003)",cite:"Greenfield H, Southgate DAT. Food Composition Data: Production, Management and Use. 2nd ed. Rome: FAO; 2003. 9장·10장.",key:"같은 식품·성분에 값이 여러 개면 근거를 검토해 하나를 정하고, 값이 많으면 산술평균(또는 중앙값)이 바람직합니다. 계산으로 낸 값은 그렇다고 밝히고 자료 종류와 출처를 모두 기록합니다. 보존계수로 추정한 영양소 손실 값은 분석값보다 낮은 신뢰도를 줍니다."},
 76:{short:"Gibson, 영양 평가 원리 4a장 식품 성분(2025 개정)",cite:"Grande F, Rittenschober D, Padula de Quadros V, Holmes B. Food Composition (Chapter 4a). In: Gibson RS. Principles of Nutritional Assessment. 3rd ed. nutritionalassessment.org; 2025 개정.",key:"레시피로 계산한 영양값은 추정치입니다. 재료 성분·조리 시간·온도 차이로 계산값과 분석값이 다를 수 있고(특히 미량영양소), 열량원이 되는 주요 영양소는 차이가 대체로 작았습니다."},
 77:{short:"식품의약품안전처, 식품영양성분DB 통합 자료집(2022)",cite:"식품의약품안전처. 식품영양성분DB 통합 자료집_20221021. 공공데이터포털 data.go.kr/data/15047698. 2026-10-06 확인.",key:"섭취 빈도가 높은 음식 548품목을 기준 레시피에 따라 조리하고, 분석기관에서 3회 분석한 평균값을 영양성분 값으로 썼습니다."},
 78:{short:"Google Chrome 고객센터, 웹사이트 바로가기 만들기(Android)",cite:"Google. Chrome에서 웹사이트 바로가기 만들기 - Android - Google Chrome 고객센터. support.google.com/chrome/answer/15085120. 2026-10-06 확인.",key:"Android Chrome에서 웹사이트로 이동한 뒤 주소 표시줄 오른쪽 더보기 → 설치 및 바로가기 만들기 → 바로가기 만들기를 누르고, 이름을 정한 뒤 추가를 누릅니다. Chrome 로고가 있는 바로가기는 Chrome에서 열립니다."},
 79:{short:"국가데이터처, 2025 통계로 보는 1인가구(소비지출)",cite:"국가데이터처(옛 통계청) 사회통계기획과. 2025 통계로 보는 1인가구. 2025-12-09 발표(2024년 가계동향조사 기준). 수치는 매일신문 2025-12-09 보도(v.daum.net/v/20251209120019970)로 확인, 원문 PDF는 열지 못함. 2026-10-08 확인.",key:"2024년 1인 가구의 월평균 소비지출은 168만 9천원(전체 가구 289만원의 58.4%)이고, 지출 비중은 주거·수도·광열 18.4%, 음식·숙박 18.2%, 식료품·비주류음료 13.6% 순입니다. 식료품·비주류음료는 약 23만원(168만 9천원 × 13.6%, 앱이 계산한 값)입니다."},
 80:{short:"EuroFIR, 식품 영양성분 계산 지침(2015)",cite:"Machackova M, Giertlova A, Porubska J. How to Calculate Nutrient Content of Foods: A Guideline for Food Business Operators. EuroFIR AISBL; 2015-05. 12쪽 'An extra step: Calculation of water content'. eurofir.org. 2026-10-12 확인.",key:"조리로 바뀐 무게(생것 무게 − 익힌 무게)를 수분이 줄어든 양으로 보고, 재료의 수분 합계에서 빼서 익힌 음식의 수분을 계산합니다(6~9단계). 앱은 같은 가정으로 익힌 무게를 생것 무게로 되돌려 계산합니다(앱이 계산한 값)."},
 81:{short:"마트·편의점 시판 식품 포장 표시(제조사 공식 자료·이마트몰 포장 사진)",cite:"CJ더마켓(cjthemarket.com) 상품정보 제공고시: 햇반 210g·작은공기 130g, 듬뿍 소고기죽·누룽지닭백숙죽·버섯야채죽 420g, 비비고 사골곰탕·설렁탕 500g, 행복한콩 모닝두부·국산콩 연두부 140g. 매일유업 제품 안내(productguide.maeil.com): 소화가 잘되는 우유 오리지널·저지방 930mL, 매일두유 99.9·고단백 190mL. 정식품 제품 소개(vegemil.co.kr): 담백한 베지밀 에이 190ml. 오뚜기몰(otokimall.com) 상품 상세의 포장 표시면: 맛있는 오뚜기밥 210g, 옛날 사골곰탕 500g. 이마트몰(emart.ssg.com) 상품의 품질표시이미지(포장 사진): 위 17종과 포카리스웨트 500ml·900ml. 2026-10-14 확인.",key:"포장의 영양정보(총 내용량 또는 100ml당), 원재료명, 알레르기 유발물질 ‘함유’ 표시. 제조사 공식 자료와 포장 사진이 같은 판이고, 같은 품목보고번호(없으면 같은 제품의 다른 용량)의 식약처 가공식품 DB(2026-08-28, 316,734건) 가장 최근 행과 열량·탄수화물·당류·단백질·지방·나트륨이 반올림 오차 안에서 맞으며, 표시 열량이 탄수화물·단백질·지방 계산과도 맞는 제품만 씀. 판이 다르거나 맞지 않은 제품(비비고 소고기미역국·소고기듬뿍무국, 행복한콩 순두부 330g, 햇반 단호박죽, 양반 야채죽·쇠고기죽 420g 등)은 빼고, 지금 판의 포장을 찾지 못한 제품(햇반 전복죽, 양반 죽 287.5g 등)은 보류함. 동아오츠카는 제조사 사이트에 영양정보가 없어 포장 사진 두 장(500ml·900ml)과 식약처 DB로 대조함."},
 82:{short:"CJ더마켓(CJ제일제당 공식몰) 상품정보 제공고시",cite:"CJ제일제당. CJ더마켓(cjthemarket.com) 상품 상세의 '상품정보 제공고시'(식품의 유형·원재료명 및 함량·알레르기 유발물질)와 영양정보. 햇반·죽·국·만두·김치·반찬·햄·소시지·간식·음료·유제품 등 식품 분류의 상품을 모두 받아 확인함. 2026-10-14 확인.",key:"앱의 영양값·원재료명·알레르기 표시는 이 고시를 옮긴 것이고(두 번째 자료와 대조하지 않은 한 곳 확인), 음식마다 확인한 상품 번호와 주소를 함께 보여 줍니다. 원재료명에 아질산나트륨(발색제)이 적힌 가공육은 앱 판정 '절대 금지'로 고정합니다. 밀키트·도시락, 양념·소스·식용유 같은 조리 재료, 원재료명이 글자 없이 그림으로만 있는 상품은 넣지 않았습니다."},
 83:{short:"동원몰(동원F&B 공식몰) 상품정보 제공고시",cite:"동원F&B. 동원몰(dongwonmall.com) 상품 상세의 '상품정보 제공고시'(제품명·식품의 유형·원재료 및 함량). 햄·소시지·통조림 햄 상품. 2026-10-14 확인.",key:"원재료 및 함량 글에 아질산나트륨(발색제)이 적힌 리챔·런천미트·그릴리 후랑크·부어스트·통그릴비엔나 등은 앱 판정 '절대 금지', 발색제가 없는 햄·소시지는 가공육으로 '피하기'입니다. 영양정보는 글로 없어(그림) 넣지 않았습니다(한 곳 확인)."},
 84:{short:"식품안전나라 국내식품 검색(품목제조보고 성분 및 원료)",cite:"식품의약품안전처. 식품안전나라(foodsafetykorea.go.kr) 전문정보 > 업체 및 제품 검색 > 국내식품 검색, 제품별 품목제조보고 상세의 '성분 및 원료'. 2026-10-14 확인.",key:"회사가 품목제조보고 때 신고한 원료 목록에 아질산나트륨 같은 발색제가 있는 햄·소시지·베이컨 등을 앱 판정 '절대 금지'로 넣었습니다. 보고 일자가 2004~2026년으로 오래된 보고도 있어 지금은 팔지 않는 제품이 섞여 있을 수 있고, 영양정보는 이 자료에 없습니다(한 곳 확인)."},
 85:{short:"동원몰 상품 상세의 포장 표시(시판 만두·육포·볶음밥·국·탕·찌개)",cite:"동원몰(dongwonmall.com) 상품 상세에 실린 포장 표시 사진(영양정보·원재료명·알레르기 표시)과 상품정보 제공고시. 동원F&B와 입점 업체(사조대림·사조오양·하림·청아냉동식품·오뚜기·오뚜기냉동식품·샘표·코주부B&F·CP·농협목우촌·고삼농협·동추원F&B·한상가득식품 등)의 만두·딤섬·완탕·육포, 냉동 볶음밥·주먹밥·비빔밥·솥밥, 국·탕·찌개(곰탕·삼계탕·찌개·건조 국 등). 2026-10-15 확인.",key:"포장 사진의 총 내용량(또는 표시 기준량)당 영양정보, 원재료명, 알레르기 ‘함유’ 표시를 그대로 옮김. 원재료명에 아질산나트륨(발색제)이 있는 육포는 앱 판정 ‘절대 금지’, 발색제가 없는 육포·육포 바도 가공육이라 ‘피하기’(셀러리 분말을 쓴 제품도 원재료명 기준으로 ‘피하기’). 사진에 영양정보가 없는 9개 제품(청아 갈비 왕교자·튀김중화만두, 동원 교자만두 김치·개성 더 건강한 물만두·더 바삭한 군만두·한입 쏙 만두 2종·딤섬 부추창편 390g, 상상육포 비프앤치즈)은 같은 품목보고번호(없으면 같은 제조사·제품명·중량)의 식약처 가공식품 DB(2026-08-28) 값을 썼고, 영양정보를 찾지 못한 육포 9종(상상육포 8종, 순한한우 육포)은 가공육이라 영양값 없이 원재료로 판정하고, 영양정보를 찾지 못한 만두 3종(동원 고기 교자만두, 청아 물만두·야채두부잎새만두)은 넣지 않음. 볶음밥·국·탕·찌개도 포장 사진이나 상품정보 제공고시의 영양정보·원재료명을 옮겼고, 판매처에 영양정보가 없으면 같은 기준으로 식약처 가공식품 DB 값을 씀(양반 솥밥 3종, 양반 국·탕·찌개 14종, 착한감자탕). 아질산나트륨을 넣은 소시지가 든 부대찌개 2종(사조대림 24/7)은 ‘절대 금지’, 햄·소시지·베이컨이 든 볶음밥·찌개는 ‘피하기’. 물을 부어 먹는 건조 국 블록과 물에 끓이는 건조 국은 포장에 적힌 1인분(블록 하나)을 1회로 봄. 영양정보를 끝내 찾지 못한 국 2종(양반 나주식 곰탕, 하림 냉동 삼계탕)과 원재료가 일부만 적힌 제품(초원식품 즉석탕 등), 밀키트는 넣지 않음. 한 곳에서만 확인."},

  const pickMain=(key,j,date,n,avoid,day)=>{const L=TPL[key];
    const ov=S.swaps?.[`${date}|${n}`];
    if(typeof ov==="string"){const all=menuList(key); const k2=all.findIndex(m=>m.key===ov); if(k2>=0){const m=fit(all[k2]); if(m){m.vi=k2<L.length?k2:(m.vi??0); return m}}}
    const at=order(L.length,j);
    // likedMain: 좋았던 식품이 든 메뉴는 이번 주에 같은 주재료를 썼어도 다시 고를 수 있음
    const strictOK=(a,likedMain)=>{
      if(!pref(a)||usedT.has(a.title)||(n>0&&!likedMain&&usedMain.has(mainFood(a)))||(avoid&&dayKeys(a).some(id=>avoid.has(id)))) return false;
      if(a.items.some(([id])=>bad.has(id))) return false;               // 끼니 평가에서 '나쁨'인 식품
      const t=menuNut(a);
      if(key==="B"&&totals(a.items.map(cap)).p<bMin) return false;      // 아침 단백질 하한(저잔사식 분량 상한을 적용한 양으로, v1.7.0)
      if(t.na>naMax/3*1.25) return false;                               // 한 끼 나트륨이 하루 상한의 1/3을 크게 넘음
      if(day.na+t.na>naMax*[0.4,0.7,0.93][n]) return false;             // 그날 끼니까지 쌓인 나트륨(곁들임 몫을 남김)
      return true};
    const liked=a=>a.items.some(([id])=>good.has(id));
    const passes=[];
    if(good.size&&!day.liked){                                          // 좋았던 식품이 든 메뉴(하루 한 번, 관해기에는 지중해식 먼저)
      if(c.stage===3) passes.push(a=>a.med&&liked(a)&&strictOK(a,true));
      passes.push(a=>liked(a)&&strictOK(a,true)) }
    if(c.stage===3) passes.push(a=>a.med&&strictOK(a));                  // 관해기: 지중해식 메뉴 먼저
    passes.push(strictOK, ()=>true);
    for(const ok of passes) for(let o=0;o<L.length;o++){const idx=at(o); const a=L[idx]; if(!ok(a)) continue;
      const m=fit(a); if(m){m.vi=idx; usedT.add(a.title); if(n>0) usedMain.add(mainFood(a)); if(good.size&&a.items.some(([id])=>good.has(id))) day.liked=true; return m}}
    return null};
  SAMPLE_FIT={fit,pick,pickMain,c,allowed};
  // 목표 열량(체중×30kcal)·단백질(단계별 g/kg)에 맞춰 밥·죽·면(곡류)과 단백질 반찬 양을 조절(ESPEN[1])
  const r5=v=>v>=50?Math.round(v/10)*10:Math.max(5,Math.round(v/5)*5);
  const scaleDay=meals=>{const live=meals.filter(m=>!m.empty); const t=totals(live.flatMap(m=>m.items)); if(!t.k) return null;
    const orig=live.map(m=>m.items);
    const run=w=>{ // w: 늘리는 폭의 비율(1=목표만큼, 0=그대로)
      live.forEach((m,j)=>m.items=orig[j]); let changed=false;
      const apply=(test,f)=>{for(const m of live) m.items=m.items.map(([id,g])=>{if(!test(id)) return [id,g]; const v=cap([id,r5(g*f)])[1]; if(v!==g) changed=true; return [id,v]})};
      // v1.10.0 개발자 7: 단백질 반찬도 양쪽으로 — 목표보다 적으면 늘리고(최대 1.5배), 목표의 115%를 넘으면 110%까지 줄인다(최소 0.7배).
      // 단백질을 먼저 맞춘 뒤 남은 열량을 밥·죽·면으로 맞춘다. 나트륨 때문에 줄이는 폭(w)은 늘릴 때만 쓴다
      const fp0=t.p<tg.p?Math.min(1.5,tg.p/Math.max(1,t.p)):t.p>tg.p*1.15?Math.max(0.7,tg.p*1.1/t.p):1; const fp=fp0<1?fp0:1+(fp0-1)*w;
      if(Math.abs(fp-1)>=0.05) apply(isProtItem,fp);
      const t2=totals(live.flatMap(m=>m.items));
      const fk0=Math.min(1.5,Math.max(0.8,tg.k/Math.max(1,t2.k))); const fk=fk0<1?fk0:1+(fk0-1)*w;
      if(Math.abs(fk-1)>=0.05) apply(isStapleItem,fk);
      return changed?{fk:Math.abs(fk-1)>=0.05?Math.round(fk*100)/100:1,fp:Math.abs(fp-1)>=0.05?Math.round(fp*100)/100:1}:null};
    // 나트륨 하루 상한(2025 KDRI[16])을 넘기면 늘린 폭을 줄임
    let res=null;
    for(const w of [1,0.75,0.5,0.25,0]){ res=run(w); if(w===0||totals(live.flatMap(m=>m.items)).na<=naMax) break }
    const B=meals[0]; if(B&&!B.empty){ const bp=totals(B.items).p; if(bp<bMin){ const before=B.items; const f=Math.min(1.5,bMin/Math.max(1,bp)+0.02);
      B.items=B.items.map(([id,g])=>isProtItem(id)?cap([id,Math.ceil(g*f/5)*5]):[id,g]); if(totals(live.flatMap(m=>m.items)).na>naMax) B.items=before; else res=res||{fk:1,fp:1} } }
    return res};
  const days=[];
  const isFruit=id=>FOOD[id].cat==="과일";
  for(let i=0;i<7;i++){
    let fruitUsed=false; const date=addDays(today(),i); const dn=dayNo(date); const used=new Set(); const day={liked:false,na:0}; let caSum=0; const picked=[];
    const meals=[["B",0],["L",1],["D",2]].map(([k,off],n)=>{
      const main=pickMain(k,dn+off,date,n,used,day); if(main) for(const id of dayKeys(main)) used.add(id);
      if(main&&main.items.some(([id])=>isFruit(id))) fruitUsed=true;
      const sideList=c.fiberStage===1&&fruitUsed?TPL.S.filter(x=>!x.items.some(([id])=>isFruit(id))):TPL.S;
      // 칼슘: 이 끼니까지 쌓인 칼슘이 하루 권장섭취량의 (n+1)/3에 못 미치면 칼슘 100mg 이상인 곁들임을 먼저(2025 KDRI[16])
      const caMain=caSum+(main?menuNut(main).ca:0);
      let side=null;
      if(n===2&&caMain<tg.ca){ // 저녁: 모자란 칼슘을 채우는 곁들임(관해기에는 과일·요거트 같은 지중해식 곁들임 먼저), 없으면 칼슘이 가장 많은 것
        const need=Math.min(tg.ca-caMain,300), at=order(sideList.length,dn*3+n); let best=null,bc=-1;
        const room=naMax*0.95-day.na-(main?menuNut(main).na:0);
        for(const medFirst of c.stage===3?[true,false]:[false]){ for(let o=0;o<sideList.length&&!side;o++){const a=sideList[at(o)]; if(!pref(a)||(medFirst&&!a.med)) continue; const m=fit(a); if(!m||menuNut(m).na>room) continue; const ca=menuNut(m).ca; if(ca>=need) side=m; else if(ca>bc){bc=ca;best=m}} if(side) break }
        if(!side) side=best }
      const naRoom=naMax*[0.42,0.72,0.95][n]-day.na-(main?menuNut(main).na:0); // 곁들임에 남은 나트륨
      if(side&&menuNut(side).na>naRoom) side=null;
      const naOK=sideList.filter(a=>menuNut(a).na<=naRoom); // 나트륨이 남은 몫 안인 곁들임만(없으면 곁들임 없음)
      if(!side&&naOK.length) side=pick(naOK,dn*3+n,caMain<tg.ca*(n+1)/3?(a=>menuNut(a).ca>=100):null);
      if(side&&side.items.some(([id])=>isFruit(id))) fruitUsed=true;
      caSum=caMain+(side?menuNut(side).ca:0); day.na+=(main?menuNut(main).na:0)+(side?menuNut(side).na:0);
      picked[n]={main,side};
      if(!main) return {slot:SLOTS[n],title:"조건에 맞는 예시가 없습니다",rec:[],items:[],tip:"내 정보의 조건(알레르기·의료진 지시·주의 음식)에 맞는 예시 메뉴가 없습니다. 주치의·영양사와 상의해 식단을 정해 주십시오.",refs:[],empty:true};
      return {slot:SLOTS[n],title:main.title,key:main.key,rec:main.rec||[],cook:main.cook||[],vi:main.vi,med:main.med?1:0,user:main.user?1:0,side:side?side.title:"",items:[...main.items,...(side?side.items:[])],tip:main.tip,tip2:side?side.tip:"",refs:[...new Set([...main.refs,...(side?side.refs:[])])]};
    });
    // 칼슘이 여전히 권장섭취량의 90%에 못 미치면 점심·아침 곁들임을 칼슘이 더 많은 것으로 바꿈(나트륨 상한·저잔사식 과일 규칙 안에서)
    { const dayTot=()=>totals(meals.flatMap(m=>m.items||[]));
      for(const n of [2,1,0]){ const t0=dayTot(); if(t0.ca>=tg.ca*0.9) break; const pk=picked[n]; if(!pk||!pk.main) continue;
        const cur=pk.side?menuNut(pk.side):{ca:0,na:0}; let best=null,bc=cur.ca;
        for(const a of TPL.S){ if(!pref(a)) continue; if(c.fiberStage===1&&a.items.some(([id])=>isFruit(id))) continue; const m=fit(a); if(!m||m.items.some(([id])=>pk.main.items.some(([j])=>j===id))) continue; const nt=menuNut(m);
          if(t0.na-cur.na+nt.na>naMax*0.99) continue; if(nt.ca>bc+30){bc=nt.ca;best=m} }
        if(best){ const M=meals[n]; M.items=[...pk.main.items,...best.items]; M.side=best.title; M.tip2=best.tip; M.refs=[...new Set([...pk.main.refs,...best.refs])]; pk.side=best } } }
    const scaled=scaleDay(meals);
    // 관해기: 하루 식이섬유가 충분섭취량(2025 KDRI[16])에 못 미치면 저녁·점심·아침 곁들임을 섬유가 더 많은 것으로 바꿈(나트륨 상한 안, 칼슘은 줄이지 않음)
    if(c.fiberStage===3&&tg.fiber.goal){ const dayTot=()=>totals(meals.flatMap(m=>m.items||[]));
      for(const n of [2,1,0]){ const t0=dayTot(); if(t0.fi>=tg.fiber.goal) break; const pk=picked[n], M=meals[n]; if(!pk||!pk.main||M.empty) continue;
        const oldSide=pk.side?M.items.slice(M.items.length-pk.side.items.length):[]; const mainItems=M.items.slice(0,M.items.length-oldSide.length); const cur=totals(oldSide);
        // 날짜마다 다른 곳부터 돌며 모자란 섬유를 채우는 첫 곁들임, 없으면 섬유가 가장 많은 것
        const caFloor=Math.min(t0.ca,tg.ca*0.9), need=tg.fiber.goal-t0.fi, at=order(TPL.S.length,dn*3+n); let best=null,bf=cur.fi+1;
        for(let o=0;o<TPL.S.length;o++){ const a=TPL.S[at(o)]; if(!pref(a)) continue; const m=fit(a); if(!m||m.items.some(([id])=>mainItems.some(([j])=>j===id))) continue; const nt=menuNut(m);
          if(t0.na-cur.na+nt.na>naMax*0.99||t0.ca-cur.ca+nt.ca<caFloor) continue; if(nt.fi-cur.fi>=need){best=m;break} if(nt.fi>bf){bf=nt.fi;best=m} }
        if(best){ M.items=[...mainItems,...best.items]; M.side=best.title; M.tip2=best.tip; M.refs=[...new Set([...pk.main.refs,...best.refs])]; pk.side=best } } }
    days.push({date:addDays(today(),i),meals,sample:true,...(scaled?{scaled}:{})});
  }
  return {sample:true,start:today(),stage:c.stage,days};
}
// 교체한 메뉴를 날짜·끼니에 기억(키로 저장)
function setSwap(date,n,key){
  S.swaps=S.swaps||{}; S.swaps[`${date}|${n}`]=key;
  const slot=SLOTS[n];
  if(isAte(date,slot)||isRated(date,slot)) setAte(date,slot,false); // 메뉴가 바뀌었으니 이전 '먹음' 표시와 평가는 지움
  for(const k of Object.keys(S.swaps)) if(k.split("|")[0]<today()) delete S.swaps[k];
  S.plan=samplePlan(); save();
}
let PLAN_NOTE="";
function swapMeal(dayIdx,mealIdx){
  const P=S.plan; const d=P?.days[dayIdx]; if(!d) return false;
  samplePlan(); const F=SAMPLE_FIT; const key=["B","L","D"][mealIdx];
  const cur=d.meals[mealIdx]; const L=TPL[key]; const len=L.length; const st=menuStep(len);
  for(let o=0;o<len;o++){
    const idx=((cur.vi??0)+(o+1)*st)%len; const cand=L[idx];
    if(cand.title===cur.title) continue;
    if(!F.fit(cand)) continue;
    setSwap(d.date,mealIdx,cand.key); return true;
  }
  return false;
}
const planSig=p=>p.days.slice(0,3).map(d=>d.meals.map(m=>m.title).join("/")).join("|");
function snapSelDay(){const P=S.plan; if(!P?.days?.length) return; const cur=P.days[S.selDay]; if(!cur||cur.date<today()){const k=P.days.findIndex(d=>d.date===today()); S.selDay=k>=0?k:0}}
/* v1.9.0 P-4: 화면을 그릴 때마다 일주일 식단을 처음부터 다시 고르던 것(1년치 기록·느린 기기에서 약 100ms)을,
   식단을 고르는 데 쓰는 조건이 바뀔 때만 다시 고른다 */
let PLAN_SIG=null;
function planInputSig(){const c=ctx(); return JSON.stringify([today(),c.stage,c.fiberStage,c.gasHeavy,c.allergies,c.words,c.trig.map(t=>[t.name,t.foodId||""]),S.profile,S.orders,S.goals,S.weights,S.swaps,S.myMenus,S.ratings,S.stageMode])}
function refreshPlan(){
  if(S.plan&&!planOK(S.plan)){S.plan=null; PLAN_SIG=null}
  if(!S.plan||S.plan.sample){const sig=planInputSig(); if(S.plan&&S.plan.sample&&sig===PLAN_SIG&&SAMPLE_FIT) return;
    const prevStart=S.plan?.start; const before=S.plan?planSig(S.plan):null; S.plan=samplePlan(); PLAN_SIG=sig;
    const after=planSig(S.plan);
    if(before&&prevStart===S.plan.start&&before!==after&&!PLAN_NOTE) PLAN_NOTE="조건이 바뀌어 예시 식단을 다시 골랐습니다.";
    return}
  const last=S.plan.days[S.plan.days.length-1]?.date;
  if(!last||last<today()){S.plan=samplePlan(); S.selDay=0; PLAN_NOTE="지난 식단 기간이 끝나 앱 규칙 식단으로 바꿨습니다."}
}
function mealIssues(m,c=ctx()){return (m.items||[]).map(x=>x[0]).filter(id=>{const f=FOOD[id]; if(!f) return false; return badLv(foodStatus(f,c).level)})}

  for(const [k,ws] of Object.entries(KW_EXACT)) if(toks.some(tk=>ws.includes(tk))) hit.push(k);

function ruleCheck(item){
  // 앱 규칙: 알레르기·지시·주의 음식·절대 제외 항목을 검사
  const text=item.name+" "+(item.ingr||[]).join(" ")+" "+(item.cook||"");
  const tags=tagsOfText(text,item.ingr||[]); const c=ctx(); const R=[]; let lv="ok";
  const up=(l,r)=>{if(LV_RANK[l]>LV_RANK[lv])lv=l;R.push(r)};
  const okd=(S.okMenus||[]).includes(String(item.name).replace(/\s/g,""));
  for(const a of c.allergies) if(tags.includes(a)) up("avoid",`알레르기 재료 가능성(${allergyLabel(a)})`);
  if(S.profile.lactose&&tags.includes("lactose")) up("avoid","유당 가능성");
  for(const [o,t] of TAGRULE) if(orderOn(o)&&tags.includes(t)) up("avoid",`의료진 지시: ${orderLabel(o)}`);
  const f0=exactFood(item.name);
  if(!f0){
    for(const [t,l] of [["processed","가공육(햄·베이컨 등)"],["upf","초가공식품"],["alcohol","술"]]) if(tags.includes(t)) up("avoid",`${l} 포함 가능성`);
    if(tags.includes("spicy")&&c.stage<3) up(okd?"caution":"avoid",okd?"맵거나 자극적인 양념(내가 괜찮았다고 표시함)":"맵고 자극적인 양념은 피하도록 안내(대한장연구학회·길병원)");
  }
  const x=text.replace(/\s/g,"");
  for(const t of S.triggers){const k=t.name.split("(")[0].replace(/\s/g,""); if(k&&x.includes(k)) up("avoid",`개인 주의 음식(${t.name})`)}
  for(const w of c.words) if(w&&x.includes(w.replace(/\s/g,""))) up("avoid",`알레르기·싫어하는 음식(${w})`);
  if(f0){
    const s=foodStatus(f0,{...c,allergies:[],words:[],trig:[]});
    const soft=okd&&s.level==="avoid"&&f0.tags.includes("spicy")&&f0.ms!==9&&!AVOID_TAG.some(([t])=>f0.tags.includes(t))&&!BAN_TAG.some(([t])=>f0.tags.includes(t));
    if(s.level!=="ok") for(const r of s.reasons) up(soft?"caution":s.level,`${f0.name}: ${r}${soft?" (내가 괜찮았다고 표시함)":""}`);
  } else {
    if(tags.includes("redmeat")) up("caution","붉은 고기");
    if(tags.includes("fatty")) up("caution","기름진 조리");
    if(tags.includes("fodmap")) up("caution","가스를 늘릴 수 있는 재료");
  }
  return {level:lv,reasons:[...new Set(R)]};
}

/* 최근 30일, 어떤 음식을 먹은 날(또는 그 전날) 증상이 나쁜 날이 더 많았는지 (원인 판정이 아니라 참고용)

   ③ 기록한 날의 80% 이상에 나오는 음식(밥처럼 거의 매일 먹는 것)은 비교할 날이 없어 뺌 ④ 증상 기록이 7일 이상일 때만 */
function foodSuspects(days=30){
  const from=addDays(today(),-days+1);
  const eat={};
  const add=(d,name)=>{if(!name||d<addDays(from,-1)||d>today())return;(eat[d]||(eat[d]=new Set())).add(name)};
  for(const r of S.ratings) add(r.date, r.foodId&&FOOD[r.foodId]?FOOD[r.foodId].name:r.name||r.title||"");
  for(const [d,arr] of Object.entries(S.extras)) for(const x of arr) add(d,String(x.name||""));
  for(const [d,day] of Object.entries(S.ateMeals||{})) for(const m of Object.values(day)) for(const [id] of (m.it||[])) if(FOOD[id]&&!FOOD[id].tags.includes("oil")) add(d,FOOD[id].name);
  const badDay=d=>{const l=S.logs[d]; const ds=dangerSignals(l); return !!(activity(l).stage===1||ds.severe.length||ds.urgent.length||(+l.bloody||0)>0)};
  const rows=Object.keys(S.logs).filter(d=>d>=from&&d<=today()).sort().map(d=>({d,bad:badDay(d),foods:new Set([...(eat[d]||[]),...(eat[addDays(d,-1)]||[])])}));
  const out=[]; out.n=rows.length; out.minDays=7;
  if(rows.length<7) return out;
  const nb=rows.filter(r=>r.bad).length; out.base=Math.round(nb/rows.length*100);
  const stat={};
  for(const r of rows) r.sc=sccai(S.logs[r.d]);
  const scAll=rows.reduce((t,r)=>t+r.sc,0);
  for(const r of rows) for(const nm of r.foods){const o=stat[nm]||(stat[nm]={n:0,bad:0,sc:0}); o.n++; o.sc+=r.sc; if(r.bad) o.bad++}
  for(const [name,o] of Object.entries(stat)){
    if(o.n<3||o.bad<2||o.n>=rows.length*0.8) continue;
    const restN=rows.length-o.n, restBad=nb-o.bad; if(restN<3) continue;
    const pct=Math.round(o.bad/o.n*100), rest=Math.round(restBad/restN*100);
    // v1.9.0 F-11: 증상 점수(SCCAI) 평균도 함께 보여 준다(먹은 날 vs 먹지 않은 날)
    if(pct>=rest+20) out.push({name,n:o.n,bad:o.bad,pct,rest,restN,avgE:r1(o.sc/o.n),avgR:r1((scAll-o.sc)/restN)});
  }
  out.sort((a,b)=>(b.pct-b.rest)-(a.pct-a.rest)||b.n-a.n); out.splice(5);
  return out;
}

    rows.push(mineSet?{lv:"caution",title:"알레르기 표시를 직접 확인하십시오",found:["원재료명에서 찾은 항목 없음"],why:"내 정보에 적어 둔 알레르기가 있는데 이 글에서는 해당 원재료를 찾지 못했습니다. 옮겨 적다 빠진 글자가 있으면 놓칠 수 있고, 같은 재료가 다른 이름으로 적혀 있을 수도 있습니다. 먹기 전에 포장의 알레르기 표시를 직접 읽어 주십시오.",refs:[28]}
      :{lv:"info",title:"알레르기 유발 원재료",found:["찾은 항목 없음"],why:"원재료명에서 법정 표시 대상을 찾지 못했습니다. 옮겨 적다 빠진 글자가 있으면 놓칠 수 있으니 포장의 알레르기 표시를 직접 확인하십시오.",refs:[28]})}
  for(const g of ADDITIVES){
    const mp=new Map(); for(const n of g.names){const k=nrm(n); if(x.includes(k)&&!mp.has(k)) mp.set(k,n)}
    const raw=[...mp.values()];
    const hit=raw.filter(h=>!raw.some(o=>nrm(o)!==nrm(h)&&nrm(o).includes(nrm(h))));
    if(!hit.length) continue;
    const fod=["polyol","fructan","hfcs"].includes(g.id);
    let lv="caution";
    if(g.id==="sulfite"&&c.allergies.includes("sulfite")) lv="avoid";
    if(fod&&(orderOn("lowfodmap")||c.gasHeavy)) lv="avoid";
    add(lv,g.label,hit.slice(0,3),g.why,g.refs,g.codes.length?`식약처 원재료코드표(식품첨가물) 등록 명칭 기준`:"코드표에 없는 이름(앱 추가)");
  }
  const myr=["팜유","팜핵유","야자유","코코넛오일","코코넛유","팜올레인유","가공유지(팜"].filter(w=>x.includes(nrm(w)));
  if(myr.length) add("caution","미리스트산이 많은 기름",myr,"팜유·코코넛유 등 미리스트산 급원은 줄이도록 권고됩니다.",[3]);
  const fodKw=KW.fodmap.filter(w=>x.includes(nrm(w)));
  if(fodKw.length) add(orderOn("lowfodmap")||c.gasHeavy?"avoid":"caution","가스 유발 성분(FODMAP)이 많은 원재료",fodKw,"가스·복부팽만을 늘릴 수 있습니다.",[20]);
  { const nit=["아질산나트륨","아질산칼륨","질산나트륨","질산칼륨"].filter(w=>x.includes(w)); if(nit.length) add("ban","아질산염(발색제)",nit,"아질산나트륨 같은 발색제를 넣은 가공육은 앱 기준 절대 금지입니다.",[37,3,50]) }
  if(tags.includes("processed")) add("avoid","가공육",KW.processed.filter(w=>x.includes(w)),"가공육은 줄이거나 피하도록 권고됩니다.",[3,7]);
  if(tags.includes("spicy")&&c.stage<3) add("avoid","매운 양념",KW.spicy.filter(w=>x.includes(w)),"앱 기본 설정으로 활동기에는 맵고 자극적인 양념을 제외합니다(근거 자료의 직접 권고는 아님).",[]);
  for(const [o,t] of TAGRULE) if(orderOn(o)&&tags.includes(t)) add("avoid",`의료진 지시: ${orderLabel(o)}`,KW[t].filter(w=>x.includes(nrm(w))),"의료진 지시에 해당하는 원재료입니다.",[]);
  for(const t of S.triggers){const k=nrm(t.name.split("(")[0]); if(k&&x.includes(k)) add("avoid","개인 주의 음식",[t.name],"먹고 나빠졌다고 기록한 음식입니다.",[])}
  for(const w of c.words){const k=nrm(w); if(k&&x.includes(k)) add("avoid","알레르기·싫어하는 음식",[w],"내 정보에 적은 음식입니다.",[])}
  return {overall,rows};
}
// 영양성분표 판정: 식품등의 표시기준 영양강조표시 기준[29], 저섬유식 1회 기준[26]
function numOrNull(v){if(v===null||v===undefined||v==="")return null;const x=parseFloat(String(v).replace(/[^0-9.]/g,""));return isNaN(x)?null:x}
function nutriCheck(n,eat){
  const out=[]; const c=ctx();
  if(!n) return {rows:out,eat:null};
  const basis=+n.basisAmt;
  if(!isFinite(basis)||basis<0.5||basis>5000) return {rows:[{lv:"info",title:"영양 정보",found:["기준량을 읽지 못했습니다"],why:"영양성분의 기준량(예: 1회 제공량 100g)을 읽지 못했습니다. '읽은 영양정보 고치기'에서 포장에 적힌 기준량을 직접 적어 주십시오.",refs:[]}],eat:null};
  let ate=+eat; if(!isFinite(ate)||ate<=0) ate=basis; ate=Math.min(ate,5000);
  const liquid=n.basisUnit==="ml"; const f100=100/basis; const fe=ate/basis;
  const nv=k=>{if(n[k]==null) return null; const x=+n[k]; return isFinite(x)?x:null};
  const per100=k=>nv(k)==null?null:r1(nv(k)*f100); const perEat=k=>nv(k)==null?null:r1(nv(k)*fe);
  const u=liquid?"ml":"g";
  if(nv("fiber")==null) out.push({lv:"info",title:"식이섬유",found:["표시 없음"],why:"이 제품 표시에 식이섬유가 없어 원재료로만 판단합니다.",refs:[]});
  else if(c.fiberStage===1){
    const fx=perEat("fiber");
    if(fx>=2){const mx=Math.max(1,Math.floor(2/(nv("fiber")/basis)-0.001)); out.push({lv:"caution",title:"식이섬유",found:[`먹을 양 기준 ${fx}g`],why:`저잔사식 단계는 한 번에 2g 미만을 권합니다. ${mx}${u} 이하로 드십시오.`,refs:[26]})}
    else out.push({lv:"ok",title:"식이섬유",found:[`먹을 양 기준 ${fx}g`],why:"한 번에 2g 미만 기준을 지킵니다.",refs:[26]});
  }
  const fat=per100("fat"), na=per100("sodium"), sug=per100("sugar");
  if(orderOn("lowfat")&&fat!=null&&fat>=(liquid?1.5:3)) out.push({lv:"caution",title:"지방",found:[`100${u}당 ${fat}g`],why:`저지방 기준(100${u}당 ${liquid?"1.5":"3"}g 미만)을 넘습니다. 의료진 지시(저지방)에 따라 양을 줄이십시오.`,refs:[29]});
  if(orderOn("lowsalt")&&na!=null&&na>=120) out.push({lv:"caution",title:"나트륨",found:[`100${u}당 ${na}mg`],why:"저나트륨 기준(100g당 120mg 미만)을 넘습니다. 의료진 지시(저염)에 따라 양을 줄이십시오.",refs:[29]});
  if(sug!=null&&sug>=(liquid?2.5:5)) out.push({lv:liquid?"caution":"info",title:"당류",found:[`100${u}당 ${sug}g`],why:liquid?"당을 넣은 음료(첨가당)는 줄이도록 권고됩니다.":`저당류 기준(100g당 5g 미만)을 넘습니다.`,refs:liquid?[2,16,29]:[29]});
  if(nv("polyol")>0){const px=perEat("polyol"); out.push({lv:(orderOn("lowfodmap")||c.gasHeavy)?"avoid":"caution",title:"당알코올",found:[`먹을 양 기준 ${px}g`],why:"당알코올은 종류에 따라 FODMAP으로 작용해 가스·설사를 늘릴 수 있습니다.",refs:[20]})}
  if(nv("trans")>0) out.push({lv:"caution",title:"트랜스지방",found:[`${nv("trans")}g(표시 기준량당)`],why:"트랜스지방은 피하도록 권고됩니다.",refs:[3]});
  const tg=targets(); const k=perEat("kcal"), pr=perEat("protein");
  if(k!=null||pr!=null) out.push({lv:"info",title:"먹을 양의 영양",found:[`${r1(ate)}${u}: ${k??"-"}kcal · 단백질 ${pr??"-"}g`],why:`하루 목표 열량 ${tg.k}kcal, 단백질 ${tg.p}g 기준으로 참고하십시오.`,refs:[1]});
  return {rows:out,eat:{kcal:k||0,p:pr||0,fi:perEat("fiber")||0,ca:perEat("calcium")||0}};
}

/* v1.10.0 사용자 5: 마지막 기록(어제·오늘)까지 3일 연속 증상 점수 5점 이상인지 */
function trend3(){const l=latestLog(1); if(!l) return null; const ds=[2,1,0].map(i=>addDays(l.date,-i)); const ls=ds.map(d=>S.logs[d]);
  if(ls.some(x=>!x)) return null; const sc=ls.map(sccai); return sc.every(v=>v>=5)?{from:ds[0],to:ds[2],sc}:null}
function alertsHTML(){
  const l=S.logs[today()]?{date:today(),...S.logs[today()]}:latestLog(1);
  const ds=dangerSignals(l);
  let h="";
  if(ds.severe.length) h+=`<div class="banner crit" role="alert"><strong>병원 진료가 먼저 필요합니다</strong><br>${esc(md(l.date))} 기록: ${esc(ds.severe.join(", "))}. 국내·유럽 중증 기준에 해당할 수 있습니다${sup([38,12])}. 중증은 입원 치료가 필요한 응급에 가깝습니다${sup([40])}. 오늘 주치의에게 연락하거나 응급실로 가십시오. 피를 많이 흘리거나 어지러워 쓰러질 것 같으면 119에 연락하십시오.</div>`;
  if(ds.urgent.length) h+=`<div class="banner urgent" role="alert"><strong>진료를 미루지 마십시오</strong><br>${esc(md(l.date))} 기록: ${esc(ds.urgent.join(", "))}. 이런 증상이 있으면 치료를 미루지 않도록 안내됩니다${sup([41])}. 오늘 주치의(IBD 진료팀)에게 연락하고, 심해지면 응급실로 가십시오.</div>`;
  const tr=trend3();
  // v1.10.0 사용자 5: 3일 연속 증상 점수 5점 이상(활동기 기준)이면 알린다. 예측이 아니라 기록을 기준과 비교한 것
  if(!ds.severe.length&&!ds.urgent.length&&tr) h+=`<div class="banner warn" role="alert"><strong>3일 연속 활동기 기준입니다</strong><br>${esc(md(tr.from))}~${esc(md(tr.to))} 증상 점수가 ${tr.sc.join("·")}점으로 활동기 기준(5점 이상)이 이어지고 있습니다${sup([11,15])}. 주치의(IBD 진료팀)에 연락하는 것을 고려하십시오. 기록을 기준과 비교한 안내이며, 앞으로의 경과를 예측하지 않습니다.</div>`;
  else if(!ds.severe.length&&!ds.urgent.length&&l&&activity(l).stage===1) h+=`<div class="banner warn" role="alert"><strong>증상이 활동기 기준입니다</strong><br>${esc(md(l.date))} 기록이 악화 기준에 해당합니다${sup([15,38])}. 주치의(IBD 진료팀)에 알리십시오. 스스로 굶지 말고 부드러운 음식을 조금씩 자주 드십시오${sup([40,39])}.</div>`;
  if(ds.watch.length) h+=`<div class="banner warn" role="alert"><strong>주치의와 상의가 필요한 증상</strong><br>${esc(md(l.date))} 기록: ${esc(ds.watch.join(", "))}. 증상이 심해지면 바로 진료를 받으십시오.</div>`;
  h+=glimHTML();
  return h;
}

function eatenTotals(date){
  const t=totals(SLOTS.filter(sl=>isAte(date,sl)).flatMap(sl=>ateItems(date,sl)));
  for(const x of (S.extras[date]||[])){t.k+=x.kcal||0;t.p+=x.p||0;t.fi+=x.fi||0;t.ca+=x.ca||0;t.na+=x.na||0;t.vd+=x.vd||0}
  return t}
const hasEaten=date=>SLOTS.some(sl=>isAte(date,sl))||!!(S.extras[date]||[]).length;
/* 하루 중간에는 적게 먹은 것이 정상이라 중립색, 저녁(19시) 이후나 지난 날만 모자람을 강조한다 */
const shortOK=date=>date<today()||(date===today()&&new Date().getHours()>=19);

/* v1.9.0 D-3: 홈 맨 위 '오늘 할 일' 3가지 — 증상 기록·끼니 표시·물. 각 줄에서 바로 처리한다 */
function tasksHTML(){
  const t=today(); const tl=S.logs[t]; const ll=lastLogBefore(t,7);
  // v1.10.0 디자인 1: 홈의 증상 기록 입구를 이 줄 하나로(예전 '요즘 증상' 안내·바로가기 타일·알림의 버튼을 합침)
  const stale=!tl&&S.stageMode==="auto"&&currentStage().stale; const ll0=stale?lastLogBefore(t,3650):null;
  const mealN=SLOTS.filter(sl=>isAte(t,sl)||isSkipped(t,sl)).length;
  const tg=targets(); const cups=+S.water[t]||0; const goalCups=Math.max(1,Math.round(tg.water/S.cupMl));
  const done=[!!tl,mealN>=SLOTS.length,cups>=goalCups];
  const row=(ok,n,title,sub,acts)=>`<div class="task${ok?" is-done":""}"><span class="tk-main"><span class="tk-n" aria-hidden="true">${ok?ic("check"):n}</span><span class="lt"><b>${title}${ok?'<span class="sr-only"> 완료</span>':""}</b><small>${sub}</small></span></span><span class="tk-act">${acts}</span></div>`;
  return `<section class="card tasks" aria-labelledby="tasksT"><div class="row between"><h2 id="tasksT">오늘 할 일</h2><span class="hint">${done.filter(Boolean).length}/3 완료</span></div>

    ${row(done[1],2,"끼니 표시",`'먹음'·'안 먹음'을 표시한 끼니 ${mealN}/${SLOTS.length}`,`<button class="btn sm" data-act="goMeals">끼니 보기</button>`)}

  </section>`;
}

function applyBad(date,source){
  const added=[];
  if(!BAD) return added;
  for(const x of BAD.list){
    const allergy=x.sym.includes("allergy");
    if(allergy&&x.addAl&&x.alTags.length){S.profile.allergies=[...new Set([...S.profile.allergies,...x.alTags])]}
    if(x.dec==="none") continue;
    if(x.dec==="dislike"){const base=x.name.split("(")[0].trim(); const cur=String(S.profile.dislikes||"").split(/[,\n、]/).map(v=>v.trim()).filter(Boolean); if(!cur.includes(base)) S.profile.dislikes=[...cur,base].join(", "); added.push(x.name); continue}
    const t={name:x.name,date,source,sym:[...x.sym],never:x.dec==="never"||allergy};
    const fid=x.foodId||guessFoodId(x.name); if(fid) t.foodId=fid;
    const k=S.triggers.findIndex(o=>(x.foodId&&o.foodId===x.foodId)||o.name===x.name);
    if(k>=0){const o=S.triggers[k]; S.triggers[k]={...o,...t,foodId:t.foodId||o.foodId,sym:[...new Set([...(o.sym||[]),...t.sym])],never:!!(o.never||t.never)}}
    else S.triggers.push(t);
    added.push(x.name);
  }
  for(const x of BAD.list){const r=[...S.ratings].reverse().find(r=>r.date===date&&r.rating==="bad"&&((x.foodId&&r.foodId===x.foodId)||r.name===x.name)); if(r) r.sym=[...x.sym]}
  BAD=null; return added;
}

function targetNoteHTML(tg){

/* v1.8.0 브라우저에 기록 보존 요청(지원하면). 허용 여부는 브라우저가 정한다 */
async function askPersist(force){
  try{
    if(!navigator.storage?.persist){S.persist="na"; save(); return}
    if(!force&&S.persist) return;
    const already=await navigator.storage.persisted?.();
    const ok=already||await navigator.storage.persist();
    S.persist=ok?"yes":"no"; save(); if(force){render(); toast(ok?"브라우저가 기록 보존을 허용했습니다":"브라우저가 아직 허용하지 않았습니다. 자주 열수록 허용될 수 있습니다")}
  }catch(e){S.persist="na"; save()}
}

/* v1.9.0 A-3·A-4: 초점 위치를 '같은 역할의 버튼'으로 찾아 되살리기 위한 선택자(다시 그리면 요소가 새로 만들어지므로) */
let RET_FOCUS=null;
function focusSig(el){
  if(!el||el===document.body||el===document.documentElement||!el.closest) return null;
  if(!el.closest("#main,#appbar,#sheetRoot")) return null;
  if(el.id) return "#"+CSS.escape(el.id);

  let q=ds.act?`[data-act="${CSS.escape(ds.act)}"]`:ds.go?`[data-go="${CSS.escape(ds.go)}"]`:`[data-tab="${CSS.escape(ds.tab)}"]`;
  for(const k of ["v","k","i","j","id","slot","key","sub","to"]) if(ds[k]!=null) q+=`[data-${k}="${CSS.escape(ds[k])}"]`;
  return q;
}
/* v1.9.0 F-9: 화면이 바뀐 직후(0.4초) 방금 누른 자리에 새로 나타난 버튼은 잠깐 비활성으로 보여 준다.

function coolAfterNav(){

/* ===== 장보기 목록(v1.8.0: 살 때 재료로) =====

   3) 레시피 없는 음식: 레시피가 없거나 쓸 수 없는 완성 음식(빵·떡·김치·사골국 등)은 완성된 음식 무게로 적는다. */
const SHOP=/*@GEN:shop@*/;
const SHOP_ORDER=["곡류","단백질","유제품","채소","과일","지방","영양식","기타"];
function shopData(){const P=S.plan; const days=P.days.filter(d=>d.date>=today()); const c=ctx();
  const ing={}, rec={}, dish={}, okC={};
  const okRec=r=>okC[r]??(okC[r]=!!RECIPES[r]&&!recipeNotes(RECIPES[r],c).some(n=>n.hard));
  const recOf=r=>rec[r]||(rec[r]={meals:new Set(),dishes:{},main:new Set()});
  for(const d of days) for(const m of d.meals){ if(m.empty||isSkipped(d.date,m.slot)) continue;
    const mk=d.date+"|"+m.slot, mr=(m.rec||[]).filter(okRec);
    for(const r of mr) recOf(r).meals.add(mk);
    for(const [id,g] of m.items){const f=FOOD[id]; if(!f||!(g>0)) continue;
      if(wBasis(f).k==="dish"){
        const r=mr.find(x=>RECIPES[x].foods?.includes(id))||Object.keys(RECIPES).find(x=>RECIPES[x].foods?.includes(id)&&okRec(x));
        if(r){const x=recOf(r); x.meals.add(mk); x.dishes[id]=(x.dishes[id]||0)+g}
        else dish[id]=(dish[id]||0)+g;

      const x=ing[k]||(ing[k]={name:k,cat:SHOP_ORDER.includes(f.cat)?f.cat:"기타",eat:0,buy:0,plan:{},conv:false,ref:0,basis:s?"":wBasis(f).l});
      const eat=s?g*s[1]:g, ref=s?s[2]:0;
      x.eat+=eat; x.buy+=ref?eat/(1-ref/100):eat; x.plan[id]=(x.plan[id]||0)+g; if(s&&s[1]!==1) x.conv=true; if(ref) x.ref=ref;
      for(const r of mr) if(RECIPES[r].foods?.includes(id)) recOf(r).main.add(k.split("(")[0]);

  const recs=Object.entries(rec).map(([id,x])=>({id,r:RECIPES[id],n:x.meals.size,dishes:Object.entries(x.dishes),main:[...x.main],notes:recipeNotes(RECIPES[id],c)}))
    .sort((a,b)=>b.n-a.n||a.r.name.localeCompare(b.r.name,"ko"));

const fmtG=g=>g>=1000?`${r1(g/1000)}kg`:`${g}g`;

function shopAmt(x){const from=Object.keys(x.plan).map(id=>FOOD[id].name.split("(")[0]).join("·"), planG=Object.values(x.plan).reduce((a,b)=>a+b,0);

function shopText(){const {days,groups,recs,dishes}=shopData(); const L=[`장보기 목록 (${days.length?md(days[0].date)+"~"+md(days[days.length-1].date):""})`];

const NAV={depth:0,skip:0,t:null};
// v1.9.0 U-4: 홈이 아닌 탭도 뒤로 가기 기록을 하나 남긴다 → 휴대폰 뒤로 가기를 누르면 앱이 닫히지 않고 홈으로 간다
const tabDepth=()=>S.consent&&!onbActive()&&S.tab!=="plan"?1:0;

// v1.8.0: 화면을 빠르게 여닫으면 앞선 history.go가 끝나기 전에 다시 뒤로 가서 앱 밖(이전 페이지)으로 나가던 문제를 막는다.
//  ① 앞선 뒤로 가기가 끝날 때(popstate)까지 기다렸다가 맞추고 ② 앱이 쌓은 기록(ucnav) 수보다 더 뒤로 가지 않는다.
function navSync(){
  if(NAV.t) return;
  const run=()=>{NAV.t=null;
    if(NAV.skip>0&&Date.now()-(NAV.goT||0)<1500){NAV.t=setTimeout(run,40); return}
    NAV.skip=0; const want=navWant();
    try{
      if(NAV.depth>want){const n=Math.min(NAV.depth-want,+(history.state?.ucnav)||0); NAV.depth=want; if(n>0){NAV.skip++; NAV.goT=Date.now(); history.go(-n)}}
      else while(NAV.depth<want){history.pushState({ucnav:NAV.depth+1},""); NAV.depth++}
    }catch(e){NAV.depth=want}
  };
  NAV.t=setTimeout(run,0);
}
