      rep.innerHTML=`<div class="blk">${b}</div>`;
      const cvs=rep.querySelector("canvas[data-chart]"); if(cvs) drawSccaiChart(cvs,from,n,"print");
      const blk=rep.firstChild;
      const cv=await html2canvas(blk,{scale:2,backgroundColor:"#ffffff"});
      const k=(PW-2*M)/cv.width, h=cv.height*k;
      if(h<=PH-2*M){
        if(y+h>PH-M&&!first){pdf.addPage();y=M}
        pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",M,y,PW-2*M,h); y+=h; first=false; continue;
      }
      // 한 쪽보다 긴 블록(아주 긴 메모 등): 행 경계에서 나눠 싣고, 이어지는 쪽에는 표 머리글을 다시 붙인다
      const r0=blk.getBoundingClientRect(), sc=cv.height/r0.height, px=v=>Math.round((v-r0.top)*sc);
      const cuts=[...blk.querySelectorAll("tbody tr")].filter(tr=>!tr.nextElementSibling?.classList.contains("sub")).map(tr=>px(tr.getBoundingClientRect().bottom));
      const th=blk.querySelector("thead"), hs=th?[px(th.getBoundingClientRect().top),px(th.getBoundingClientRect().bottom)]:null;
      let s=0;
      while(s<cv.height){
        const hh=s>0&&hs?hs[1]-hs[0]:0, room=Math.floor((PH-M-y)/k)-hh;
        let e=s+room>=cv.height?cv.height:cuts.filter(c=>c>s&&c<=s+room).pop();
        if(!e){ if(y>M+1){pdf.addPage();y=M;continue} e=s+room }
        const part=document.createElement("canvas"); part.width=cv.width; part.height=hh+e-s;
        const g=part.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,part.width,part.height);

        pdf.addImage(part.toDataURL("image/jpeg",0.92),"JPEG",M,y,PW-2*M,part.height*k); y+=part.height*k; first=false; s=e;
        if(s<cv.height){pdf.addPage();y=M}
      }
    }
    rep.innerHTML="";
    const tot=pdf.internal.getNumberOfPages();
    for(let i=1;i<=tot;i++){pdf.setPage(i);pdf.setFontSize(8);pdf.setTextColor(120);
      pdf.text(today(),M,PH-14);
      pdf.text(`${i} / ${tot}`,PW-M,PH-14,{align:"right"});}
    const blob=pdf.output("blob");
    await DL.save({filename:`진료기록_${today()}.pdf`,data:blob});
    toast("PDF를 저장했어요");

  finally{const b=$("#pdfBtn"); if(b){b.disabled=false;b.textContent=`최근 ${S.reportDays}일 PDF 저장`}}

let TAP={t:0,x:-99,y:-99,act:""};
function tapGuard(e,act){
  if(!e.detail) return false; // 키보드(Enter)로 누른 경우는 그대로 처리
  const now=Date.now(); const x=e.clientX||0, y=e.clientY||0;
  const samePlace=Math.abs(x-TAP.x)<28&&Math.abs(y-TAP.y)<28&&now-TAP.t<600;
  const blocked=samePlace&&act!==TAP.act&&now-NAVT<400;
  TAP={t:now,x,y,act:blocked?TAP.act:act};
  return blocked;
}

const backupJSON=()=>JSON.stringify({...S,app:"uc-table",v:BACKUP_V,exportedAt:new Date().toISOString()});
async function backup(){
  if(!DL){alertMsg("이 화면에서는 파일 저장을 쓸 수 없어요. '백업 내용 복사'를 이용해 주세요.");return}
  try{await DL.save({filename:`식단기록_백업_${today()}.json`,data:backupJSON()}); S.lastBackup=today(); render(); toast("백업 파일을 저장했어요")}
  catch(e){if(e?.code!=="declined") alertMsg("백업을 저장하지 못했어요. '백업 내용 복사'를 이용해 주세요.")}
}
async function backupCopy(){
  const txt=backupJSON();
  try{await navigator.clipboard.writeText(txt); S.lastBackup=today(); render(); toast("백업 내용을 복사했어요. 메모 앱 등에 붙여 넣어 보관하세요")}
  catch(e){openSheet(`<h2>백업 내용</h2><p class="hint">자동 복사가 안 돼요. 아래 내용을 길게 눌러 모두 선택해 복사한 뒤, 메모 앱 등에 붙여 넣어 보관하세요.</p><textarea id="bkText" readonly style="min-height:160px" aria-label="백업 내용">${esc(txt)}</textarea><button class="btn primary full" data-act="bkMark" style="margin-top:10px">복사해서 보관했어요</button>`)}
}
let PENDING_RESTORE=null;
function restoreFromText(txt){
  let cand;
  try{cand=normalizeState(JSON.parse(String(txt).trim()))}catch(e){alertMsg(e?.message==="newer backup"?"더 최신 버전 앱에서 만든 백업이에요. 앱을 새로고침한 뒤 다시 시도해 주세요.":"올바른 백업 내용이 아니에요. 파일이나 붙여 넣은 내용을 확인해 주세요."); closeSheet(); return}
  PENDING_RESTORE=cand;
  openSheet(`<h2>백업으로 바꿀까요?</h2><p style="margin:10px 0">증상 기록 ${Object.keys(cand.logs).length}일, 음식 평가 ${cand.ratings.length}개, 몸무게 ${cand.weights.length}개, 주의 음식 ${cand.triggers.length}개가 들어 있어요.</p><p class="crit-t">지금 이 기기의 기록은 모두 백업 내용으로 바뀌고 되돌릴 수 없어요.</p><div class="grid2" style="margin-top:12px"><button class="btn" data-act="closeSheet">취소</button><button class="btn primary" data-act="restoreApply">바꾸기</button></div>`);
}
function restoreApply(){ LOAD_FAIL=false;
  if(!PENDING_RESTORE) return;
  const prev=S;
  try{S=PENDING_RESTORE; if(!S.consent) S.consent=prev.consent; if(!S.plan) S.plan=samplePlan(); draft=null; SCR=null; PENDING_RESTORE=null; $("#sheetRoot").innerHTML=""; render(); navSync(); toast("백업을 불러왔어요")}
  catch(e){S=prev; PENDING_RESTORE=null; $("#sheetRoot").innerHTML=""; render(); alertMsg("백업을 적용하지 못해 원래 기록을 그대로 뒀어요.")}
}
async function restore(file){
  if(!file) return;
  try{restoreFromText(await file.text())}catch(e){alertMsg("파일을 읽지 못했어요.")}
}
render();
</script>
