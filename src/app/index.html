<title>UC 식탁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#F2F4F6; --bg2:#F2F4F6; --surface:#FFFFFF; --card:#FFFFFF; --surface-2:#EEF1F4; --ink:#191F28; --muted:#5B6573; --line:#E3E7EC; --line-strong:#7A8594;
  --accent:#2462E6; --accent-deep:#1A4DBA; --accent-soft:#E9F0FE; --on-soft:#1A4DBA; --fill:#2462E6; --fill-ink:#FFFFFF; --accent-ink:#FFFFFF;
  --deco:#6A4FD8; --deco-soft:#F0ECFD; --food-tint:#F6F0E7;
  --ok:#0B7A4A; --ok-soft:#E5F5EC; --ok-ink:#0B7A4A; --warn:#945700; --warn-soft:#FFF2DD; --warn-fill:#C27400; --warn-ink:#945700; --later:#4F5D6E; --later-soft:#EDF0F4; --avoid:#C22A2A; --avoid-soft:#FDECEC;
  --crit:#A8001E; --crit-soft:#FDE7EA; --crit-ink:#A8001E;
  --shadow:0 1px 2px rgba(20,28,40,.05),0 6px 18px rgba(20,28,40,.06); --scrim:rgba(12,15,20,.42); --fab-shadow:0 8px 20px rgba(36,98,230,.30);
  --display:"Montserrat","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:20px; color-scheme:light;
}
/* 화면 모드: 앱 설정(data-app-theme)이 뷰어 테마(data-theme)보다 우선 */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-app-theme="light"]){
  --bg:#0F1216; --bg2:#0F1216; --surface:#1A1E24; --card:#1A1E24; --surface-2:#232830; --ink:#E9EDF2; --muted:#9CA6B4; --line:#2B313A; --line-strong:#6B7684;
  --accent:#7EAAFF; --accent-deep:#A9C6FF; --accent-soft:#1B2A45; --on-soft:#A9C6FF; --fill:#2F6BE0; --fill-ink:#FFFFFF; --accent-ink:#FFFFFF;
  --deco:#B7A6FF; --deco-soft:#2A2345; --food-tint:#2A2621;
  --ok:#44D192; --ok-soft:#10301F; --ok-ink:#44D192; --warn:#F0B347; --warn-soft:#372810; --warn-fill:#F0B347; --warn-ink:#F0B347; --later:#A7B3C4; --later-soft:#232A34; --avoid:#FF7A70; --avoid-soft:#3A1716;
  --crit:#FF6B80; --crit-soft:#3F1520; --crit-ink:#FF6B80;
  --shadow:0 0 0 1px #252A31; --scrim:rgba(0,0,0,.6); --fab-shadow:0 8px 20px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-app-theme="light"]),:root[data-app-theme="dark"]{
  --bg:#0F1216; --bg2:#0F1216; --surface:#1A1E24; --card:#1A1E24; --surface-2:#232830; --ink:#E9EDF2; --muted:#9CA6B4; --line:#2B313A; --line-strong:#6B7684;
  --accent:#7EAAFF; --accent-deep:#A9C6FF; --accent-soft:#1B2A45; --on-soft:#A9C6FF; --fill:#2F6BE0; --fill-ink:#FFFFFF; --accent-ink:#FFFFFF;
  --deco:#B7A6FF; --deco-soft:#2A2345; --food-tint:#2A2621;
  --ok:#44D192; --ok-soft:#10301F; --ok-ink:#44D192; --warn:#F0B347; --warn-soft:#372810; --warn-fill:#F0B347; --warn-ink:#F0B347; --later:#A7B3C4; --later-soft:#232A34; --avoid:#FF7A70; --avoid-soft:#3A1716;
  --crit:#FF6B80; --crit-soft:#3F1520; --crit-ink:#FF6B80;
  --shadow:0 0 0 1px #252A31; --scrim:rgba(0,0,0,.6); --fab-shadow:0 8px 20px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 110px;min-height:100%}
.wrap{max-width:560px;margin:0 auto}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;align-items:center;gap:4px;min-height:58px;margin-inline:-16px;padding:6px 10px 6px 16px;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.appbar h1{font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:-.02em}
body.pushed .appbar{padding-left:6px}
body.pushed .appbar h1{font-size:17px}
.grow{flex:1}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;flex:0 0 auto}
.icon-btn:active{background:var(--surface-2)}
.icon-btn.soft{background:var(--surface-2);color:var(--accent)}
.icon-btn:disabled{opacity:.35}
.tab span{line-height:1}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.pad{padding:0 6px}
.sec-title h2{font-size:17px}
.sec-label{font-size:12.5px;font-weight:700;color:var(--muted);margin:6px 8px -6px;letter-spacing:.02em}
.hero .glass{border:1px solid var(--line);color:var(--ink);font-weight:600;font-family:var(--body)}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.lrow,.mrow,.hrow,.swrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:transparent;text-align:left;color:inherit;border-top:1px solid var(--line);min-height:62px;font:inherit}
.list>:first-child{border-top:0}
.list>input[hidden]+*{border-top:1px solid var(--line)}
.lt{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.35}
.lt b{font-size:15px;font-weight:700}
.lt small{font-size:12.5px;color:var(--muted)}
.lr{font-size:13px;color:var(--muted);white-space:nowrap}
.chev{width:18px;height:18px;color:var(--muted);opacity:.7}
.lic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;color:var(--accent)}
.lic .ic{width:21px;height:21px}
.t-warm{background:var(--deco-soft);color:var(--deco)!important} .t-coral{background:var(--avoid-soft);color:var(--avoid)!important} .t-rose{background:var(--accent-soft);color:var(--accent)!important} .t-food{background:var(--food-tint);color:var(--accent)!important} .t-sage{background:var(--deco-soft);color:var(--deco)!important} .t-plain{background:var(--surface-2);color:var(--ink)!important}
.fic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;flex:0 0 auto;color:var(--accent)}
.fic .ic{width:25px;height:25px;stroke-width:1.6}
.fic.lg{width:60px;height:60px;border-radius:18px} .fic.lg .ic{width:30px;height:30px}
.fic.xl{width:84px;height:84px;border-radius:26px} .fic.xl .ic{width:42px;height:42px;stroke-width:1.4}
.lrow,.mrow,.hrow,.fcard,.tile,.aicard,.bigact,.btn,.opts button{transition:transform .12s ease,background .15s,border-color .15s}
button.lrow:active,label.lrow:active,.mrow:active,.hrow:active,.fcard:active,.tile:active,.aicard:active,.bigact:active,.btn:active,.opts button:active{transform:scale(.98)}
.lrow.static{cursor:default}
.lrow:disabled{opacity:.5}
.lrow.danger b{color:var(--crit)}
.done{width:26px;height:26px;border-radius:50%;background:var(--fill);color:var(--fill-ink);display:grid;place-items:center;flex:0 0 auto}
.done .ic{width:15px;height:15px;stroke-width:2.6}
.mrow .slot{align-self:flex-start;margin-bottom:3px}
.refn{width:30px;height:30px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 auto}
.swrow{cursor:pointer}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:0 0 auto;transition:background .2s;margin:0;cursor:pointer;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw:checked{background:var(--fill)}
.sw:checked::after{transform:translateX(20px)}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.aicard{display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:left;color:inherit;background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);font:inherit}
.aicard:disabled{opacity:.55}
.bigacts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigact{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);cursor:pointer}
.bigact .lic{width:48px;height:48px;border-radius:15px}
.bigact small{color:var(--muted);font-size:12px;margin-top:-6px}
.segctl{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.segctl button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px 4px;font-weight:600;font-size:13.5px;color:var(--muted)}
.segctl button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(42,26,28,.12)}
.seg3{display:flex;gap:6px}
.seg3 button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 4px;font-size:13.5px;font-weight:600}
.seg3 button[aria-pressed="true"]{background:var(--fill);border-color:var(--fill);color:var(--fill-ink)}
.seg3 button:disabled{opacity:.4}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:16px;padding:2px 14px;box-shadow:var(--shadow);color:var(--muted)}
.searchbar input{background:transparent!important;border:0!important;padding:11px 0!important}
.bottom-bar{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:4;display:grid;gap:10px;padding-top:8px}
.bottom-bar.two{grid-template-columns:1fr 2fr}
.bottom-bar .btn{padding:15px;font-size:15px;border-radius:16px}
.bottom-bar .btn:not(.primary){background:var(--surface);box-shadow:var(--shadow);border-color:transparent}
.wz-progress{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.wz-progress i{display:block;height:100%;background:var(--fill);border-radius:9px;transition:width .3s}
.wz{display:flex;flex-direction:column;gap:14px;padding:12px 2px 6px;min-height:54vh}
.wz-q{font-family:var(--display);font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.32}
.opts{display:flex;flex-direction:column;gap:10px}
.opts button{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:2px solid transparent;border-radius:18px;padding:17px 18px;font-size:16px;font-weight:600;box-shadow:var(--shadow);text-align:left}
.opts .ck{opacity:0;color:var(--accent);width:20px;height:20px;stroke-width:2.6}
.opts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opts button[aria-pressed="true"] .ck{opacity:1}
.bigstep{display:flex;align-items:center;justify-content:center;gap:22px;padding:26px 0}
.bigstep button{width:66px;height:66px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:30px;color:var(--accent)}
.bigstep output{font-family:var(--display);font-size:66px;font-weight:800;min-width:110px;text-align:center;line-height:1}
.bigstep output small,.bignum small{font-size:18px;color:var(--muted);margin-left:4px;font-weight:600}
.bignum{font-family:var(--display);font-size:66px;font-weight:800;text-align:center;line-height:1;padding:20px 0 4px}
.big-input{font-size:18px!important;padding:15px!important;background:var(--surface)!important;box-shadow:var(--shadow)}
.result{text-align:center;display:flex;flex-direction:column;gap:4px;align-items:stretch}
.result h2{font-family:var(--display);font-size:24px;font-weight:800}
.result p{margin:0 0 8px}
.score{display:flex;flex-direction:column;align-items:center;justify-content:center;width:74px;height:74px;border-radius:50%;background:var(--accent-soft);flex:0 0 auto}
.score b{font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.score small{font-size:10.5px;color:var(--muted)}
.score.big{width:112px;height:112px;margin:4px auto 8px} .score.big b{font-size:44px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;text-align:left}
.kv span{color:var(--muted);flex:0 0 auto}
.kv b{text-align:right}
.today-card{display:flex;flex-direction:column;gap:14px}
.today-card h2{font-size:23px;font-family:var(--display);font-weight:800;margin-top:2px}
.hdate{width:44px;height:48px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;flex:0 0 auto}
.hdate b{font-family:var(--display);font-size:18px} .hdate small{font-size:11px;color:var(--muted)}
.chip-sc{min-width:34px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:14px;padding:0 8px;font-family:var(--display)}
.chip-sc.s1{background:var(--crit-soft);color:var(--crit)} .chip-sc.s2{background:var(--warn-soft);color:var(--warn)} .chip-sc.s3{background:var(--ok-soft);color:var(--ok)}
.empty{padding:24px;text-align:center;color:var(--muted);font-size:14px}
.center-head{align-items:center;text-align:center}
.center-head h2{font-family:var(--display);font-size:22px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);width:100%;gap:8px;margin-top:4px}
.stats div{background:var(--surface-2);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-size:19px;font-weight:800}
.stats small{font-size:11.5px;color:var(--muted)}
.why-card{background:var(--accent-soft);box-shadow:none}
.why-card b{color:var(--accent);font-size:13px}
.why-card p{margin:4px 0 0;font-size:15px;line-height:1.7}
.why-card.inset{border-radius:16px;padding:12px 14px;margin:12px 0}
.rrow{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.rinfo{display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;color:inherit;padding:0;font:inherit}
.jrow{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.jrow p{margin:0;font-size:14px}
.found{font-weight:700}
.tipline{color:var(--accent)!important}
.crit-t{color:var(--crit)!important;font-size:13px} .warn-t{color:var(--warn)!important;font-size:13px}
.preview{width:100%;max-height:240px;object-fit:contain;border-radius:14px;background:var(--surface-2)}
.preview.half{width:48%;height:130px}
.title-input{font-size:18px!important;font-weight:700}
.nutgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px}
.nutgrid div{background:var(--surface-2);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center}
.nutgrid b{font-size:15px} .nutgrid small{font-size:11px;color:var(--muted)}
.profile{display:flex;align-items:center;gap:14px;border:0;width:100%;text-align:left;color:inherit;font:inherit}
.profile .avatar{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:0 0 auto;box-shadow:none}
.profile .avatar .ic{width:26px;height:26px}
.big-n{font-family:var(--display);font-size:22px;font-weight:800} .big-n small{font-size:13px;color:var(--muted);font-weight:600}
.meter .num small{color:var(--muted);font-size:11.5px}
.info-body h2{font-size:19px;font-family:var(--display);font-weight:800} .info-body p{margin:0;font-size:14.5px;line-height:1.7}
details summary{font-size:14px;padding:4px 0}
html{background:var(--bg)}
body{min-height:100vh}
body.pushed .tabs{transform:translateY(140%);visibility:hidden}
.tabs{transition:transform .25s ease,visibility .25s}
body.pushed{padding-block-end:110px}
body.pushed .bottom-bar{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:592px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.wz{min-height:auto}
:root[data-font="lg"]{--z:1.12} :root[data-font="xl"]{--z:1.25}
:root[data-font] :is(.wrap,.tabs,#sheetRoot,.toast){zoom:var(--z)}
:root[data-font] .appbar{margin-inline:calc(-16px / var(--z))}

/* v22 */
html{scroll-padding-bottom:104px;scroll-padding-top:72px}
#foodRes{display:contents} /* 결과만 다시 그리기 위한 감싸개: 화면 세로 간격(gap)은 그대로 */
html,body{overflow-x:clip}
/* v21 */
.mtext{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;font-weight:600;min-height:44px;padding:0 8px;cursor:pointer;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
.linkish{background:none;border:0;display:inline-flex;align-items:center;gap:4px;color:var(--accent-deep);font:inherit;font-size:12.5px;min-height:36px;cursor:pointer}
.linkish svg{width:15px;height:15px}
.f.inline{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.f.inline select{min-height:40px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;padding:0 8px}
/* v20 */
.icon-btn{min-width:44px;min-height:44px}
.glass.chip-btn,.chip-btn{min-height:44px;padding-inline:14px}
.btn.sm{min-height:44px;padding:0 14px}
.cats .chip{min-height:40px}
.day{min-height:52px}
/* v19 */
.mact{display:flex;align-items:center;gap:4px;padding:0 10px 10px 10px;flex-wrap:nowrap}
.mate{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;min-height:44px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.mate svg{width:17px;height:17px;color:var(--ink)}
.mate.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.mate.on svg{color:var(--accent)}
.mact .mswap{margin:0 0 0 auto;padding:0 2px;font-size:13px}
/* v18 */
.copybox{white-space:pre-wrap;word-break:break-word;background:var(--warn-soft);border-radius:12px;padding:12px;font:inherit;font-size:13px;margin:10px 0 0}

.ring-tag{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.mwrap{border-top:1px solid var(--line)}
.list>.mwrap:first-child{border-top:0}
.mwrap .mrow{border-top:0}
.mwrap.skipped .mrow{opacity:.55}
.skip-tag{font-size:12px;font-weight:700;color:var(--muted);background:var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.mswap{display:flex;align-items:center;gap:5px;white-space:nowrap;margin:0 14px 12px auto;background:none;border:0;color:var(--accent);font:inherit;font-size:13px;font-weight:600;min-height:44px;padding:0 6px;cursor:pointer}
.mswap svg{width:16px;height:16px}
.day.past{color:var(--muted)}
.day.past b{font-weight:600;color:var(--muted)}
.hwrap{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.list>.hwrap:first-child{border-top:0}
.hwrap .hrow{flex:1;border-top:0}
.hdel{align-self:center;margin-right:6px;flex:0 0 auto}
.rcard .ingr{margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}


/* v14 */
body{word-break:keep-all;overflow-wrap:anywhere}
.rec-link{min-height:44px!important}
.rcard details summary{min-height:44px;display:flex;align-items:center;cursor:pointer}
.chips .chip{min-height:44px!important}
.mini-sw{min-height:44px}
.opts.compact button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opts.compact button .ck{opacity:0;flex:0 0 auto}
.opts.compact button[aria-pressed="true"] .ck{opacity:1;color:var(--accent)}
.swrow.tight{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--surface-2,rgba(127,127,127,.08))}
/* v13 */
.rcard{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.list>.rcard:first-child{border-top:0}
.rec-link{flex:0 0 auto;text-decoration:none;display:inline-flex;align-items:center;min-height:40px;white-space:nowrap}
.rnotes{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:13.5px}
.rnotes b{font-size:13px}
.rnotes ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{min-height:36px}
.badblk{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.badblk h3{font-size:16px}
.opts.compact button{padding:10px 12px;border-radius:14px;box-shadow:none;border:1.5px solid var(--line)}
.opts.compact button:disabled{opacity:.4}
.mini-sw{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:6px}
.mini-sw .sw{transform:scale(.8);transform-origin:left center}
.trow{align-items:flex-start}
/* v12 */
.hbar{grid-template-columns:auto 1fr auto} .hbar span:first-child{white-space:nowrap;font-size:12px}
.hbar .t i.low,.bar i.low{background:var(--warn-fill)}
.bar i{background:var(--accent)}
.hint{font-size:13px}
.lt small{font-size:13px}
.tab{font-size:11.5px}
.pill{font-size:12.5px}
.pill.ok{color:var(--ok-ink)} .pill.caution{color:var(--warn-ink)} .pill.avoid{color:var(--avoid)} .pill.later{color:var(--later)}
.slot{color:var(--accent-deep)}
.crit-t{color:var(--crit-ink)!important} .warn-t{color:var(--warn-ink)!important}
sup.ref{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:19px;padding:0 5px;margin-inline:2px;border-radius:6px;background:var(--accent-soft);color:var(--accent-deep);font-size:11.5px;font-weight:700;line-height:1;vertical-align:middle;cursor:pointer;border:0;position:relative;z-index:0}
sup.ref::after{content:"";position:absolute;inset:-9px -6px}
.tagx{padding:2px 2px 2px 11px}
.tagx button{width:32px;height:32px;font-size:18px}
body.welcome .tabs{transform:translateY(140%);visibility:hidden}
body.welcome{padding-block-end:110px}
body.welcome .bottom-bar{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:592px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.foot-note{font-size:12.5px;color:var(--muted);text-align:center;margin:6px 8px 0;line-height:1.6}
.note-card{display:flex;align-items:center;gap:12px;box-shadow:none;border:1px dashed var(--line);background:transparent}
.term{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-underline-offset:3px;cursor:help}
.term:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.chip-btn{display:inline-flex;align-items:center;gap:2px;padding-right:6px!important}
.chip-btn .chev{width:14px;height:14px;opacity:.8}
.fgroup{display:flex;flex-direction:column;gap:10px}
.fgroup h3{display:flex;align-items:center;gap:8px;margin:4px 2px 0;font-size:14px}
.fcard{align-items:flex-start}
.fic .emo{font-size:24px;line-height:1}
.fic.lg .emo{font-size:30px} .fic.xl .emo{font-size:44px}
.stepbox{display:inline-flex;align-items:baseline;gap:4px}
.stepbox input{width:110px;text-align:center;font-family:var(--display);font-size:58px;font-weight:800;border:0!important;background:transparent!important;padding:0!important;color:var(--ink)}
.stepbox input:focus{background:var(--surface-2)!important;border-radius:14px}
.stepbox small{font-size:18px;color:var(--muted);font-weight:600}
.mrow:disabled{opacity:1;cursor:default}
.danger-btn{background:var(--crit)!important;border-color:var(--crit)!important;color:#fff!important}
.info-body p b{color:var(--ink)}
@keyframes push{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.a-push,.a-fwd{animation:push .26s cubic-bezier(.2,.8,.2,1)}
.a-bwd{animation:pop .26s cubic-bezier(.2,.8,.2,1)}
.a-fade{animation:fadein .22s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){.a-push,.a-fwd,.a-bwd,.a-fade,.sheet{animation:none}}

h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700} h3{font-size:17px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{padding-block:20px 8px}
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello .date{font-size:13px;color:var(--muted);font-weight:500}
.hello h1{font-size:23px;font-weight:700;margin-top:2px}
.avatar{width:46px;height:46px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;flex:0 0 auto}
.avatar svg{width:22px;height:22px;stroke:var(--accent-deep);fill:none;stroke-width:1.8}
.brandline{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:4px}
.stages{display:flex;gap:4px;margin-top:14px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.stage{flex:1;padding:7px 4px;border-radius:999px;text-align:center;font-size:12px;color:var(--muted);line-height:1.2}
.stage b{font-weight:700;margin-right:3px}
.stage.on{background:var(--fill);color:var(--fill-ink)}
.stage-note{margin:8px 4px 0;font-size:12px;color:var(--muted)}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:4px 8px env(safe-area-inset-bottom,0px)}
.tabs-in{display:flex;justify-content:space-between;gap:2px;max-width:560px;margin:0 auto}
.tab{flex:1;background:none;border:0;border-radius:12px;padding:8px 2px 6px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700}
.tab[aria-selected="true"] svg{stroke-width:2.2}

section.view{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.flat{background:var(--surface-2);border-radius:16px;padding:12px 14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:6px 4px -4px}
.sec-title h2{font-size:18px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 16px;font-weight:600;font-size:14px}
.btn.primary{background:var(--fill);border-color:var(--fill);color:var(--fill-ink)}
.btn.dark{background:var(--fill);border-color:var(--fill);color:var(--fill-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-deep)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.full{width:100%}

.banner{border-radius:18px;padding:12px 14px;border:1px solid}
.banner.crit{background:var(--crit-soft);border-color:var(--crit);border-width:2px;color:var(--ink)}
.banner.urgent{background:var(--warn-soft);border-color:var(--warn,#E8A33D);border-width:2px;color:var(--ink)}
.banner.urgent strong{color:var(--warn-ink,#9A5B00)}
.banner{position:relative;z-index:1}
.banner .b-act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.banner .b-act .btn{min-height:40px;padding:0 14px}
.banner.crit strong{color:var(--crit)}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.info{background:var(--accent-soft);border-color:transparent}

/* hero summary */
.hero{color:var(--ink);padding:2px 0 0}
.cal-head{display:flex;align-items:baseline;gap:14px;margin-bottom:12px}
.cal-head b{font-family:var(--display);font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.cal-head span{font-family:var(--display);font-size:15px;font-weight:600;color:var(--muted)}
.cal-head .glass{margin-left:auto}
.hero .days{gap:4px;justify-content:space-between}
.hero .day{background:transparent;box-shadow:none;color:var(--ink);width:auto;flex:1;min-width:0;border-radius:999px;padding:6px 0}
.hero .day span{color:var(--muted)}
.hero .day[aria-pressed="true"]{background:transparent;color:var(--accent-ink)}
.hero .day[aria-pressed="true"] span{color:var(--accent);opacity:1;font-weight:700}
.hero .day[aria-pressed="true"] b{background:var(--fill);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;margin:2px auto 0;color:var(--accent-ink)}
.hero .day b{width:36px;max-width:100%;aspect-ratio:1;height:auto;display:grid;place-items:center;margin:2px auto 0}
.overlap{position:relative}
.big-date{font-family:var(--display);font-size:25px;font-weight:800;letter-spacing:-.02em}
.big-date small{font-weight:600;color:var(--muted);font-size:15px;margin-left:4px}
.fab{position:fixed;right:20px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--fill);color:var(--fill-ink);box-shadow:var(--fab-shadow);display:grid;place-items:center;z-index:5}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.hero .muted,.hero .small{color:var(--muted)}
.hero-row{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:118px;height:118px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.15}
.ring .v b{font-family:var(--display);font-size:24px;display:block}
.ring .v span{font-size:11px;color:var(--muted)}
.ring .v b{color:var(--ink)}
.hbar{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;font-size:12.5px;padding-block:4px}
.hbar .t{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.hero .sub{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hero .sub h3{font-size:16px;color:var(--ink)}
.hero .glass{background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px}

/* quick tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink);padding:0}
.tile i{width:58px;height:58px;border-radius:18px;background:var(--surface);color:var(--accent);display:grid;place-items:center;font-style:normal;font-size:26px}
.tile svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* day strip */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.day{flex:0 0 auto;width:52px;border:0;background:var(--surface);border-radius:18px;padding:9px 0;text-align:center;line-height:1.25;box-shadow:var(--shadow)}
.day b{display:block;font-size:18px;font-family:var(--display)}
.day span{font-size:11px;color:var(--muted);display:block}
.day[aria-pressed="true"]{background:var(--fill);color:var(--fill-ink)}
.day[aria-pressed="true"] span{color:inherit;opacity:.85}

/* meal cards */
.meal{display:grid;grid-template-columns:58px 1fr;gap:14px;background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.thumb{width:58px;height:58px;border-radius:18px;background:var(--food-tint);display:grid;place-items:center;font-size:28px}
.meal:nth-of-type(3n+2) .thumb{background:var(--deco-soft)} .meal:nth-of-type(3n) .thumb{background:var(--accent-soft)}
.slot{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 9px;font-size:11.5px;font-weight:700}
.meal h4{margin:6px 0 0;font-size:16.5px;font-weight:800;font-family:var(--display)}
.btn.eat{background:var(--fill);border-color:var(--fill);color:var(--fill-ink);font-weight:700}
.items{margin:4px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.items li{display:inline}
.items li+li::before{content:" · "}
.why{margin:10px 0 0;font-size:13.5px;background:var(--surface-2);border-radius:14px;padding:9px 11px}
.why b{color:var(--accent);font-size:12px;display:block;margin-bottom:1px}
sup.ref{font-size:10.5px;color:var(--accent);font-weight:700;cursor:pointer;margin-left:1px;padding:0 2px;background:var(--accent-soft);border-radius:6px}
.eaten{font-size:12px;color:var(--ok);font-weight:700}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.caution{background:var(--warn-soft);color:var(--warn)}
.pill.later{background:var(--later-soft);color:var(--later)}
.pill.avoid{background:var(--avoid-soft);color:var(--avoid)}
.pill::before{content:"";width:9px;height:9px;flex:0 0 auto;background:currentColor}
.pill.ok::before{border-radius:50%}
.pill.caution::before{clip-path:polygon(50% 0,100% 100%,0 100%)}
.pill.later::before{border-radius:2px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.pill.avoid::before{clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.pill.neutral::before,.pill.info::before{display:none}
.pill.neutral{background:var(--accent-soft);color:var(--on-soft)}

/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:14px;padding:10px 13px;color:var(--ink);font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--on-soft);border-color:var(--accent);font-weight:700}
.seg button:disabled{opacity:.4}
.q{display:flex;flex-direction:column;gap:7px;padding-block:12px;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q-t{font-weight:700;font-size:14px}
.stepper{display:inline-flex;align-items:center;background:var(--surface-2);border-radius:14px;overflow:hidden}
.stepper button{border:0;background:transparent;width:44px;height:40px;font-size:20px;color:var(--accent-deep)}
.stepper output{min-width:52px;text-align:center;font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.check:first-child{border-top:0}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.tagx{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:999px;padding:3px 4px 3px 11px;font-size:13px}
.tagx button{border:0;background:none;width:22px;height:22px;border-radius:50%;color:var(--muted)}

/* nutrition */
.meter{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:10px;font-size:13px;padding-block:7px}
.bar{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.low{background:var(--warn-fill)}
.cups{display:flex;flex-wrap:wrap;gap:8px}
.cup{width:32px;height:42px;border:2px solid var(--accent);border-radius:6px 6px 12px 12px;background:transparent;padding:0}
.cup.full{background:linear-gradient(to top,var(--accent) 80%,transparent 80%)}

/* food list rows (details) */
.food{display:flex;justify-content:space-between;gap:10px;padding-block:11px;border-top:1px solid var(--line)}
.food:first-child{border-top:0}
.food p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.food .pill{flex-shrink:0;align-self:flex-start;margin-top:2px}

/* food grid */
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats .chip{flex:0 0 auto;white-space:nowrap}
.subnav{margin-top:0}
.subnav .stage{border:0;background:none;font-weight:600;font-size:13px}
.subnav .stage.on{background:var(--fill);color:var(--fill-ink)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fcard{position:relative;text-align:left;border:0;background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.fcard .thumb{width:50px;height:50px;font-size:25px;border-radius:16px}
.fcard:nth-child(4n+1) .thumb{background:var(--food-tint)} .fcard:nth-child(4n+2) .thumb{background:var(--deco-soft)} .fcard:nth-child(4n+3) .thumb{background:var(--accent-soft)} .fcard:nth-child(4n) .thumb{background:var(--surface-2)}
.fcard .chev{position:absolute;right:12px;bottom:14px;color:var(--muted);font-size:18px;line-height:1}
.fcard b{font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.fcard .dot{position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%}
.dot.ok{background:var(--ok)} .dot.caution{background:var(--warn-fill)} .dot.later{background:var(--later)} .dot.avoid{background:var(--avoid)}

/* table */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:500}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.refitem{padding-block:10px;border-top:1px solid var(--line);font-size:14px}
.refitem:first-of-type{border-top:0}
.refitem .n{display:inline-block;min-width:28px;font-weight:700;color:var(--accent-deep)}
.refitem .cite{font-size:13px;color:var(--muted);margin-top:3px}
.toast{opacity:1;transition:opacity .2s;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:90%}
.toast.out{opacity:0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.progress{font-size:13px;color:var(--muted)}
details summary{cursor:pointer;font-weight:700}

/* report (pdf) */
#report{position:fixed;left:-10000px;top:0;width:760px;background:#fff;color:#111;font-family:var(--body);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
#report .blk{padding:16px 34px}
#report h1{font-family:var(--display);font-size:25px;margin:0 0 4px}

 30:{short:"2025 한국인 영양소 섭취기준 제1권, 식이섬유",cite:"보건복지부·한국영양학회. 2025 한국인 영양소 섭취기준 제1권 에너지와 다량영양소, 식이섬유 장.",key:"수용성 식이섬유는 장내 미생물이 발효해 단쇄지방산을 만들고, 그중 부티르산은 대장 상피세포의 주요 에너지원으로 항염증 효과와 장 점막 항상성 유지에 기여. 부티르산 생산·대사 결함은 궤양성 대장염 등 염증성 장질환과 연관될 수 있음."},
 31:{short:"2025 한국인 영양소 섭취기준 제3권, 칼륨·철",cite:"보건복지부·한국영양학회. 2025 한국인 영양소 섭취기준 제3권 무기질, 칼륨·철 장.",key:"지속적인 구토·설사 등으로 칼륨이 결핍되면 저칼륨혈증(근육 약화, 부정맥 등)이 생길 수 있음. 체내 철은 잘 보존되어 출혈이 없으면 손실이 매우 적음(출혈 시 철 손실 증가)."},
 32:{short:"ESPEN IBD 임상영양 가이드라인(2017)",cite:"Forbes A, Escher J, Hébuterne X, et al. ESPEN guideline: Clinical nutrition in inflammatory bowel disease. Clin Nutr. 2017;36(2):321-347.",key:"IBD 빈혈은 대부분 만성 철 결핍과 만성질환 빈혈이 함께 있음. 활동기에는 단백질 전환이 늘고 스테로이드가 단백질 손실을 늘림. 심한 설사는 체중 감소·영양 결핍·탈수를 일으킬 수 있어 수분 섭취를 배출량에 맞춰 조절. 유당·유제품은 잘 맞지 않는 경우가 많음. 스테로이드 누적 용량은 골밀도 저하 위험 요인."},
 33:{short:"Crohn's & Colitis Foundation, IBD 식사 안내",cite:"Crohn's & Colitis Foundation. What Should I Eat? (IBD diet guide). crohnscolitisfoundation.org.",key:"악화기에는 바나나·사과퓨레·갈아 만든 과일, 호박류·푹 익힌 당근·그린빈, 연어·고등어 등 오메가-3 생선을 권장. 활동기에는 단백질 필요량이 늘고, 묽은 변이 잦으면 수분 섭취를 늘리며, 섬유 식품은 질감을 조절. 관해기에는 식물성 식품을 최대한 넓게 먹도록 권장."},
 34:{short:"MedlinePlus, 설사할 때 식사 안내",cite:"MedlinePlus Medical Encyclopedia (U.S. National Library of Medicine). When you have diarrhea (patient instructions 000121).",key:"설사는 탈수와 기운 없음을 일으킴. 묽은 변을 볼 때마다 물 1컵(240ml) 이상, 국물 등 짠 음식과 바나나·감자 등 칼륨 식품을 먹고, 튀기거나 기름진 음식·카페인·알코올·탄산음료는 피하며, 유제품이 설사를 악화시키면 줄임."},
 35:{short:"UCSF Health, IBD·설사 영양 안내",cite:"UCSF Health. Nutrition Tips for Inflammatory Bowel Disease; Nutrition Tips for Controlling Diarrhea. ucsfhealth.org.",key:"설사로 빠지는 나트륨·칼륨 등 전해질을 보충. 카페인 음료는 배변량을 늘리므로 피함. 유당불내증이면 우유가 가스·팽만·경련·설사를 일으킴. 강한 양념 음식과 기름진 음식은 잘 맞지 않을 수 있음. 스테로이드(프레드니손) 복용 시 칼슘 부족 위험과 단백질 필요량이 증가."},
 16:{short:"보건복지부, 2025 한국인 영양소 섭취기준",cite:"보건복지부·한국영양학회. 2025 한국인 영양소 섭취기준 제1권 에너지와 다량영양소, 제3권 무기질(요약표); 보건복지부 보도자료 「영양소 적정 섭취기준 개정」(2025.12.31).",key:"성인 칼슘 권장섭취량: 남자 800mg, 여자 19–49세 650mg·50세 이상 750mg. 수분(물·음료·우유) 충분섭취량: 남자 19–49세 1,200ml·50–74세 1,000ml·75세 이상 1,100ml, 여자 19–64세 1,000ml·65–74세 900ml·75세 이상 1,000ml. 식이섬유 충분섭취량(1,000kcal당 12.5g 기준): 남자 30g, 여자 19–49세 20g·50세 이상 25g. 성인 칼륨 충분섭취량 3,500mg."},
 26:{short:"MedlinePlus, 저섬유식 안내(2024)",cite:"MedlinePlus Medical Encyclopedia (U.S. National Library of Medicine). Low-fiber diet. A.D.A.M.; reviewed 2024-07-24.",key:"궤양성 대장염·크론병 악화기에 쓰는 식사. 섬유가 많은 음식은 변의 부피를 키우므로, 저섬유 음식은 변의 크기를 줄이고 덜 뭉치게 함. 1회 제공량당 식이섬유 2g 미만인 식품을 고르고, 하루 섭취량은 의료진이 예컨대 10–15g 이하로 정함."},
 27:{short:"식품의약품안전처, 전국통합식품영양성분정보 표준데이터",cite:"식품의약품안전처·농촌진흥청·국립수산과학원. 전국통합식품영양성분정보(원재료성식품/음식/가공식품) 표준데이터, 공공데이터포털(2026 기준); 가공식품 품목별 영양성분 DB(2022.12.31); 원재료코드 현황(2023.01.11).",key:"이 앱의 식품별 100g당 열량·단백질·지방·탄수화물·식이섬유·칼슘·철 값과, 원재료 확인에 쓰는 식품첨가물 공식 명칭·이명의 출처."},
 28:{short:"식품 등의 표시·광고에 관한 법률 시행규칙 별표 2",cite:"식품의약품안전처. 식품 등의 표시·광고에 관한 법률 시행규칙 [별표 2] Ⅰ.1.가. 알레르기 유발물질 표시 대상; 어린이 식생활안전관리 특별법 제11조의2.",key:"표시 대상: 알류(가금류), 우유, 메밀, 땅콩, 대두, 밀, 고등어, 게, 새우, 돼지고기, 복숭아, 토마토, 아황산류(이산화황 10mg/kg 이상), 호두, 닭고기, 쇠고기, 오징어, 조개류(굴·전복·홍합 포함), 잣."},
 36:{short:"서울아산병원, 궤양성대장염식(식사요법)",cite:"서울아산병원 건강정보 > 의료정보 > 식사요법 > 궤양성대장염식. amc.seoul.kr (추천 식단 포함).",key:"소량씩 잦은(하루 6회 이상) 식사로 자극을 줄이고 흡수를 높임. 저잔사식으로 대변량 감소. 설사로 인한 탈수를 막기 위해 체중 kg당 30cc 수분 섭취. 유당불내성이면 우유·유제품 제한. MCT 오일과 영양음료로 부족한 열량 보충. 증상과 개인 순응도에 따라 점차 일반식으로 이행. 약물-영양소 상호작용: 코티코스테로이드는 칼슘·단백질, 설파살라진은 엽산, 콜레스티라민은 지방·비타민 흡수를 저해. 추천 식단 예: 흰죽, 국물, 연두부찜, 병어조림, 애호박나물, 가자미찜, 계란찜, 가지나물, 불고기, 새우살찜, 물김치 국물, 간식으로 영양음료·오렌지주스·두유."},
 37:{short:"대한장연구학회, 염증성 장질환 영양과 식이요법(IBD 브로셔 No.6)",cite:"대한장연구학회. 염증성 장질환 영양과 식이요법, KASID IBD brochure No.6 (도움말·사진: 이대목동병원 영양사 강병진). 2017.",key:"활동기: 섭취량을 줄여 소량씩 자주, 부드러운 죽에 살코기·연두부·달걀·굴 등을 더해 영양 밀도를 높임. 기름은 줄이고 등푸른 생선 기름도 소화가 어려울 수 있어 담백한 흰살생선이 나을 수 있음. 자극적인 음식·탄산을 피하고 채소는 푹 익힌 것도 피하는 것이 좋음. 부족한 열량은 처방 영양액으로 보충. 관해기: 엄격한 제한은 필요 없고, 감자·고구마·꿀로 열량을 보충하며 생선·계란·수육·살코기를 기름 줄이는 조리법으로 먹음. 고등어·삼치·꽁치 같은 등푸른 생선을 주 3회 이상, 볶음·무침에는 신선한 들기름. 우유·유제품은 칼슘 공급원이며 질병을 악화시킨다는 근거가 없고, 불편하면 유당 분해 우유. 증상을 일으키기 쉬운 음식: 기름진 음식, 조개·소라, 고기 힘줄 같은 질긴 음식, 탄산음료, 자극성 향신료, 인공 감미료, 질긴 산나물·해초·견과류·팝콘, 당분이 많은 음식, 음주·폭식, 카페인. 육가공품은 되도록 먹지 않고 보이는 지방은 떼어냄. 관해기에도 익혀도 질긴 채소는 피하고 푹 익히거나 잘게·갈아서 조리."},
 39:{short:"가천대 길병원 염증성장질환센터, 식이 안내",cite:"가천대 길병원 염증성장질환센터. 일상생활 > 식이·식단표·저잔사식(ibd.gilhospital.com/life01_01, life01_02, life01_04).",key:"일반적으로 적용할 식이 지침은 없고 섬유소가 적고 부드러운 음식, 소량씩 자주 식사, 식이 일지로 먹을 수 있는 음식을 찾기. 급성기(설사·혈변·복통이 심할 때): 부드러운 죽·미음, 저섬유소식·저잔사식, 지방이 적은 단백질 반찬(흰살생선, 계란찜, 연두부, 두부), 간식이나 영양 보충 음료. 관해기: 아침식사 꼭, 생선 주 2~3회, 매 식사 두부·생선·살코기·계란 반찬, 부드러운 채소, 과일, 불편하지 않으면 유제품, 충분한 수분. 피할 음식: 과도한 지방(튀김·빵·라면), 단당류(콜라·사이다·아이스크림·초콜릿), 과도한 카페인·탄산, 섭취 시 불편했던 음식. 증상 악화를 잘 일으키는 음식: 콩, 야채, 절인 채소, 오렌지·레몬, 과일 주스, 시거나 맵고 짠 음식, 기름진 음식, 마가린, 설탕, 카페인 음료, 과도한 술. 저잔사식 허용: 흰밥·찹쌀밥·면류·부드러운 빵·백설기·감자, 껍질 뺀 생선·계란·두부·새우·게살·살코기, 애호박·오이·무·가지·배추·양파·시금치·양송이·양상추·배추김치·깍두기·물김치, 우유·발효유·두유·푸딩·치즈, 식용유·참기름·들기름·올리브유, 저잔사 영양보충음료. 제한: 보리·현미·율무·팥 등 잡곡, 고구마, 옥수수, 통밀빵, 도넛, 찰떡, 팝콘, 떡국떡, 기름지고 질긴 육류, 가공육, 조개류, 익히지 않은 동물성 식품, 미나리·도라지·고사리·콩나물·우엉·숙주·당근·셀러리·질긴 버섯·말린 나물·해조류·열무김치·갓김치·파김치, 감류·설익은 과일·파인애플·말린 과일·키위·토마토·딸기처럼 씨와 껍질째 먹는 과일, 건더기가 든 유제품, 땅콩·잣·아몬드·호두·해바라기씨, 김밥, 민간요법, 탄산·카페인 음료, 지나치게 매운 음식. 퇴원 후 1~2주는 죽에서 진밥으로 진행하며 하루 4~6회 소량씩, 고기·생선은 작게 자르거나 갈아서 부드럽게 익힘. 채소는 껍질·줄기를 없애고 무르게 조리해 한 끼 1가지 1/2분량(35g)을 꼭꼭 씹어 먹음. 과일 하루 양: 사과 중 1/2개, 배 1/4개, 복숭아 1/2개, 포도 19알, 수박 중 1쪽, 멜론 1조각, 귤 소 2개, 맑은 과일주스, 잘 익은 바나나 소 1/2개."},
 40:{short:"대한장연구학회 IBD 연구회, 궤양성 대장염 치료 가이드라인 개정판(2017)",cite:"최창환, 문원, 김유선 외, 대한장연구학회 IBD 연구회. 궤양성 대장염 치료 가이드라인 개정판. 대한소화기학회지. 2017;69(1):1-28.",key:"전신 독성 증상을 동반한 중증 궤양성 대장염은 입원 치료가 필요하며 내과적 응급상황에 가까움. 탈수와 전해질 이상을 교정해야 함. 중등도-중증 궤양성 대장염의 영양 공급은 가능하면 경구 식이 또는 경장 영양을 권장하고, 금식이 중증 궤양성 대장염의 경과를 호전시킨다는 증거는 없음. 완전 비경구 영양은 주 치료법으로 효과가 없음."},
 41:{short:"대한장연구학회, 환자용 염증성 장질환 브로셔(2022–2024)",cite:"대한장연구학회. KASID IBD brochure No.1–10(궤양성 대장염이란, 환자의 일상생활, 영양과 식이요법, 임신과 수유, 그것이 궁금해요 FAQ 등). 2022–2024.",key:"궤양성 대장염은 심한 경우 식욕부진, 오심, 구토, 발열, 체중 감소가 생길 수 있음. 고열(37.5℃ 이상), 오한, 다량의 혈성 설사, 지속적인 심한 복통이 있으면 치료를 미루지 않음. 금주·금연은 필수. 스트레스·불안·우울로 2주 이상 일상생활이 방해되면 정신건강의학 전문의 상담. 식이조절: 스테로이드 치료 중에는 저염식이 붓기를 막아 줌, 염증이 심할 때 섬유질 많은 음식(생야채·잡곡·씨앗·견과류)은 설사를 늘리므로 저섬유식, 유제품으로 설사하면 피함, 체중이 많이 빠지면 고칼로리 식사, 기름지거나 튀긴 음식·당분 많은 음료·카페인은 설사나 가스를 악화, 담백하고 부드러운 음식을 적게 자주, 음식 일지로 악화 음식 찾기. 병원에 갈 때 알릴 것: 약을 제대로 못 먹은 적, 최근 1주 설사 횟수와 양, 혈변, 몸 상태, 피부 반점·염증, 관절 통증, 눈 문제, 항문·서혜부·회음부 문제, 우울감이나 죽고 싶다는 생각, 한약이나 항생제 복용. 예방접종: 진단 때 주치의와 계획을 세우고, 독감은 매년, 면역억제 치료 중에는 생백신 금기이며 생백신은 치료 최소 2주 전에 접종."},
 42:{short:"ACG 임상 가이드라인: IBD 예방 관리(2025)",cite:"Farraye FA, Melmed GY, Lichtenstein GR, et al. ACG Clinical Guideline Update: Preventive Care in Inflammatory Bowel Disease. Am J Gastroenterol. 2025;120:1447-1473.",key:"모든 성인 IBD 환자는 매년 독감 백신. 면역조절 치료 중에는 생백신을 맞지 않음. 50세 이상은 폐렴구균·대상포진 백신, 19세 이상도 면역조절 치료 중이면 고려. B형간염 면역이 없으면 접종. 우울·불안은 진단 때와 매년 선별하고 양성이면 상담 연결. 흑색종 검진 매년, 면역조절제 사용 중 비흑색종 피부암 검진 매년. 면역조절 치료 중인 여성은 자궁경부암 검진 강화. 골밀도 저하 위험 요인이 있으면 골밀도 검사. 흡연자는 금연 상담."},
 38:{short:"대한장연구학회 IBD 연구회, 궤양성 대장염 진단 가이드라인(2009)",cite:"최창환, 정성애, 이보인, 이강문, 김주성, 한동수, 대한장연구학회 IBD 연구회. 궤양성 대장염 진단 가이드라인. 대한소화기학회지. 2009;53(3):145-160.",key:"임상 중증도(Truelove·Witts): 관해는 배변 하루 3회 이하, 혈변과 대변절박증이 없는 경우. 경도는 하루 4회 이하, 혈변은 간헐적·소량, 전신 증상 없음. 중등도는 하루 4회 이상 배변과 혈변, 경미한 전신 증상. 중증은 하루 6회 이상 설사와 육안적 혈변을 항상 동반하고, 발열(저녁 평균 체온 37.5℃ 이상 또는 4일 중 2일 이상 37.8℃ 이상)과 빈맥(평균 맥박 90회/분 이상) 중 하나를 포함해 전신 증상(발열·빈맥·빈혈·ESR 상승) 2개 이상. 전격성은 중증 기준에 더해 하루 15회 이상 설사, 지속 출혈, 수혈이 필요한 빈혈, 38.0℃ 이상 고열 등."},
 43:{short:"Cohen 등, IBD 환자의 식이와 증상 자가보고 연구(2013)",cite:"Cohen AB, Lee D, Long MD, Kappelman MD, Martin CF, Sandler RS, Lewis JD. Dietary patterns and self-reported associations of diet with symptoms of inflammatory bowel disease. Dig Dis Sci. 2013;58(5):1322-1328.",key:"IBD 환자 2,329명(궤양성 대장염 597명 포함)의 자유응답 분석. 요구르트·쌀·바나나는 증상을 좋게 한다는 응답이 많았고, 잎채소가 아닌 채소·매운 음식·과일·견과·잎채소·튀김·우유·붉은 고기·탄산음료·팝콘·유제품·술·고섬유 식품·옥수수·기름진 음식·씨앗·커피·콩은 증상을 악화시킨다는 응답이 많았음. 환자 자가보고라 인과관계를 뜻하지는 않음."},
 44:{short:"Chassaing 등, 유화제 CMC 무작위 급식 시험(2022)",cite:"Chassaing B, Compher C, Bonhomme B, et al. Randomized Controlled-Feeding Study of Dietary Emulsifier Carboxymethylcellulose Reveals Detrimental Impacts on the Gut Microbiota and Metabolome. Gastroenterology. 2022;162(3):743-756.",key:"건강한 성인에게 첨가물 없는 식단과 여기에 유화제 카복시메틸셀룰로스(CMC)를 더한 식단을 11일간 제공한 무작위 급식 시험. CMC를 먹은 군에서 장내 미생물 구성이 바뀌고 유익한 대사산물(단쇄지방산 등)이 줄었으며, 일부 참가자에서는 미생물이 장 점막 가까이 침투함."},
 45:{short:"Chen 등, 궤양성 대장염 SCD 대 지중해식 무작위 급식 시험(2026)",cite:"Chen AS-Y, Nguyen LH, Gray B, et al. Specific carbohydrate diet versus Mediterranean diet in adult patients with mild to moderate ulcerative colitis: a randomized controlled-feeding trial. Front Nutr. 2026;13:1838160.",key:"경증~중등도 궤양성 대장염 성인 17명을 특정 탄수화물 식단(SCD)과 지중해식에 무작위 배정해 6주간 식사를 제공. 부분 Mayo 점수 변화는 SCD −0.8, 지중해식 −1.3으로 차이가 없었고(p=0.499), 탈락률이 52.9%로 높아 해석에 한계가 있음."},
 46:{short:"세브란스병원 영양팀, 염증성장질환의 식사요법(2024)",cite:"세브란스병원 영양팀. 염증성장질환의 식사요법 Inflammatory bowel disease (IBD). 세브란스병원 건강정보, 2024-08-04. sev.severance.healthcare.",key:"활동기에는 영양죽·으깬 감자·삶은 계란 같은 음식으로 영양 상태를 개선. 관해기에는 비교적 제한 없이 다양한 식품 섭취. 우유로 설사가 생기면 피하되, 떠먹는 요구르트·치즈 같은 발효 제품이나 유당을 제거한 우유는 괜찮은 경우도 있음. 철은 붉은 육류·생선·간·굴·달걀노른자 같은 동물성 식품에 많고 흡수율이 좋음. 과일·채소의 줄기·껍질·씨앗, 통곡물, 견과류, 육류의 껍질처럼 섬유가 많은 음식은 피하고, 식사 중에는 커피·차·탄산음료를 마시지 않음."}

const CHO_L="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
function choOf(t){let o="";for(const ch of String(t)){const c=ch.charCodeAt(0);o+=(c>=0xAC00&&c<=0xD7A3)?CHO_L[Math.floor((c-0xAC00)/588)]:ch}return o}
const isChoQuery=k=>k.length>=2&&[...k].every(ch=>CHO_L.includes(ch));
function foodKeys(f){return [f.name,f.name.split("(")[0],...(ALIAS[f.id]||[])].map(x=>String(x).replace(/\s/g,"")).filter(Boolean)}
function splitWords(t){const out=new Set(); for(const part of String(t).normalize("NFC").split(/[,，、\n\/·;]+/)){const x=part.trim(); if(!x) continue; out.add(x); const toks=x.split(/\s+/); if(toks.length>1) for(const k of toks) out.add(k)} return [...out]}
function nameHit(f,w){
  const k=String(w).normalize("NFC").replace(/\s/g,"").toLowerCase(); if(!k) return false;
  const keys=foodKeys(f).map(n=>n.toLowerCase());

  if(keys.some(n=>n.includes(k)||(n.length>=2&&k.includes(n)))) return true;
  if(isChoQuery(k)&&keys.some(n=>choOf(n).includes(k))) return true;
  return false;
}
// 한글을 기본 자모 열로 푼다(검색 전용): '웅'→'ㅇㅜㅇ', 'ㅘ'→'ㅗㅏ', 'ㄺ'→'ㄹㄱ'
const J_JUNG="ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ", J_JONG=" ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ";
const J_SPLIT={"ㄳ":"ㄱㅅ","ㄵ":"ㄴㅈ","ㄶ":"ㄴㅎ","ㄺ":"ㄹㄱ","ㄻ":"ㄹㅁ","ㄼ":"ㄹㅂ","ㄽ":"ㄹㅅ","ㄾ":"ㄹㅌ","ㄿ":"ㄹㅍ","ㅀ":"ㄹㅎ","ㅄ":"ㅂㅅ","ㅘ":"ㅗㅏ","ㅙ":"ㅗㅐ","ㅚ":"ㅗㅣ","ㅝ":"ㅜㅓ","ㅞ":"ㅜㅔ","ㅟ":"ㅜㅣ","ㅢ":"ㅡㅣ"};
function jamoOf(t){let o="";for(const ch of String(t).normalize("NFC")){const c=ch.charCodeAt(0); if(c>=0xAC00&&c<=0xD7A3){const i=c-0xAC00; o+=CHO_L[Math.floor(i/588)]+J_JUNG[Math.floor(i%588/28)]+(i%28?J_JONG[i%28]:"")} else o+=ch} let r=""; for(const ch of o) r+=J_SPLIT[ch]||ch; return r}
// 검색창 전용 일치: 이름·동의어·초성에 더해, 글자 경계에서 시작하는 자모 열 일치
function searchHit(f,q){
  const k=String(q).normalize("NFC").replace(/\s/g,"").toLowerCase(); if(!k) return false;
  if(nameHit(f,k)) return true;
  const keys=foodKeys(f).map(n=>n.toLowerCase());
  const kc=[...k].map(ch=>/[ㄱ-ㅎ]/.test(ch)&&J_SPLIT[ch]?J_SPLIT[ch]:ch).join(""); // 자음이 겹받침 모양(ㄵ 등)으로 합쳐 들어온 초성 검색
  if(kc!==k&&isChoQuery(kc)&&keys.some(n=>choOf(n).includes(kc))) return true;
  if(!/[ㄱ-ㅣ가-힣]/.test(k)) return false;

// 검색어에 가장 잘 맞는 음식 하나: 정확히 같은 이름 > 검색어를 품은 이름(짧을수록) > 검색어 속 이름(길수록)
function bestFood(q){
  const k=String(q).normalize("NFC").replace(/\s/g,"").toLowerCase(); if(!k) return null;
  let best=null,score=-1;
  for(const f of FOODS) for(const n of foodKeys(f).map(x=>x.toLowerCase())){
    const sc=n===k?1000:(k.length>=2&&n.includes(k))?500-(n.length-k.length):(n.length>=2&&k.includes(n))?100+n.length:-1;
    if(sc>score){score=sc;best=f}
  }
  return score>=0?best:null;
}
// 이름·별명이 정확히 같은 음식(외식 메뉴 이름을 음식 목록 판정과 맞출 때만 씀)
function exactFood(q){const k=String(q||"").normalize("NFC").replace(/\s/g,"").toLowerCase(); if(k.length<2) return null; const f=bestFood(k); return f&&foodKeys(f).some(n=>n.toLowerCase()===k)?f:null}
function guessFoodId(name){
  const k=String(name).replace(/\s/g,""); if(k.length<2) return null;

  const byAlias=FOODS.filter(x=>(ALIAS[x.id]||[]).some(a=>a.replace(/\s/g,"")===k));

const CAUTION_TAG=[["legume","콩류는 증상 악화를 잘 일으키는 음식(길병원)"],["citrus","오렌지·레몬 같은 신 과일은 증상 악화를 잘 일으키는 음식(길병원)"],["juice","과일주스는 증상 악화를 잘 일으키는 음식(길병원)"],["pickled","절인 채소는 증상 악화를 잘 일으키는 음식(길병원)"],["sour","신 음식은 증상 악화를 잘 일으키는 음식(길병원)"],["marg","마가린은 증상 악화 음식(길병원), 트랜스지방은 피하기(IOIBD)"],["sugar","당분이 많은 음식은 증상을 일으키기 쉬움(대한장연구학회·길병원)"],["shell","조개·소라는 증상을 일으키기 쉬운 음식(대한장연구학회)"],["tough","질긴 음식·산나물·해초·견과·팝콘은 증상을 일으키기 쉬움(대한장연구학회)"],["raw","익히지 않은 동물성 식품은 저잔사식 제한(길병원), 먹는다면 신선한 것으로"],["upf2","초가공식품은 줄이도록 권고(AGA)"]];
function foodStatus(f,c=ctx()){
  const R=[]; let lv="ok";
  const set=(l,r)=>{const rank={ok:0,caution:1,later:2,avoid:3};if(rank[l]>rank[lv])lv=l;R.push([l,r])};
  const av=AVOID_TAG.filter(([t])=>f.tags.includes(t)); for(const [,r] of av) set("avoid",r);
  if(f.ms===9&&!av.length) set("avoid","근거 자료에서 피하도록 권고");
  for(const a of c.allergies) if(f.tags.includes(a)) set("avoid",`알레르기(${allergyLabel(a)})`);
  if(S.profile.lactose&&f.tags.includes("lactose")) set("avoid","유당불내증");
  for(const [o,t] of TAGRULE) if(orderOn(o)&&f.tags.includes(t)) set("avoid",`의료진 지시: ${orderLabel(o)}`);
  if(c.trig.some(t=>t.foodId===f.id||(!t.foodId&&nameHit(f,t.name)))) set("avoid","개인 주의 음식(먹고 나빠짐)");
  if(c.words.some(w=>nameHit(f,w))) set("avoid","알레르기·싫어하는 음식에 적음");
  if(c.gasHeavy&&f.tags.includes("fodmap")) set("avoid","최근 가스가 심해 FODMAP 식품 제외");
  if(f.tags.includes("spicy")) set(c.stage<3?"avoid":"caution",c.stage<3?"맵고 자극적인 양념(앱 기본 설정: 활동기 제외)":"맵고 자극적인 음식은 증상을 일으키기 쉬움(대한장연구학회·길병원)");
  if(orderOn("liquid")&&!f.tags.includes("liq")) set("later","의료진 지시: 유동식·죽 위주");
  if(f.ms!==9&&f.ms>c.stage) set("later",`${STAGES[f.ms].name} 단계부터 권장`);
  else if(c.fiberStage===1&&f.fi>0){
    const mg=maxLowFiberG(f);
    if(mg<30) set("later",`섬유가 많아(100g당 ${f.fi}g) ${orderOn("lowres")?"저잔사 지시 중":"저잔사식 단계"}에는 제외`);
    else if(mg<300&&!((f.cat==="채소"||f.tags.includes("veg"))&&mg>VEG_CAP)&&!(FRUIT_CAP[f.id]&&FRUIT_CAP[f.id]<mg)) set("caution",`한 번에 ${mg}g 미만(먹는 양의 섬유 2g 미만 기준)`);
  }
  if(c.fiberStage===1&&f.tags.includes("gil")) set("later","저잔사식 제한 식품(길병원 안내)");
  if(c.fiberStage===1&&(f.cat==="채소"||f.tags.includes("veg"))) set("caution","채소는 푹 익혀 한 끼 1가지, 35g 정도만(길병원 저잔사식)");
  if(c.fiberStage===1&&FRUIT_CAP[f.id]) set("caution",`과일은 하루 ${FRUIT_CAP[f.id]}g 정도까지(길병원 저잔사식)`);
  if(c.stage===1&&f.tags.includes("oily")) set("caution","활동기에는 등푸른 생선 기름도 소화가 어려울 수 있어 흰살생선이 나을 수 있음");
  if(f.tags.includes("redmeat")) set("caution","붉은 고기는 줄이도록 권고");
  if(f.fod==="high") set("caution","가스 유발 성분(FODMAP)이 많아 가스·복부팽만을 늘릴 수 있음");
  if(f.fod==="amount") set("caution",`가스 유발 성분(FODMAP)은 양에 따라 다름(${f.fodNote})`);
  if(f.tags.includes("salty")) set("caution","짠 음식이라 소량만(길병원: 짠 음식은 증상 악화 음식)");
  if(f.tags.includes("fatty")) set("caution","기름진 음식이라 소량만(길병원: 기름진 음식은 증상 악화 음식)");
  for(const [t,r] of CAUTION_TAG) if(f.tags.includes(t)&&!(t==="sour"&&f.tags.includes("citrus"))) set("caution",r);
  if(c.gasHeavy&&f.tags.includes("allium")&&f.fod!=="high") set("caution","양파·마늘·파 양념은 가스를 늘릴 수 있음(FODMAP)");
  if(f.tags.includes("caffeine")) set("caution","카페인(앱 설정: 마신 뒤 설사가 늘면 줄이기)");
  if(S.profile.budget==="알뜰"&&f.cost===3) set("caution","가격 부담이 큰 편");
  return {level:lv,reasons:[...new Set(R.filter(x=>x[0]===lv).map(x=>x[1]))]};
}
// 길병원 저잔사식 하루 과일 양(대략의 무게)[39]
const FRUIT_CAP={banana:50,applesauce:100,peach:100,melon:100,mandarin:120,apple:100,pear:100,grape:80,watermelon:150,canned_peach:100,hallabong:120};
const VEG_CAP=35;
// 김치·장아찌 등 짠 식품은 한 끼 소량만(길병원: 시거나 짠 음식 주의)[39]
const SALTY_CAP=40;
const LV={ok:"먹어도 좋음",caution:"주의해서",later:"지금은 보류",avoid:"피하기"};
function planFoods(){
  const c=ctx();
  return FOODS.filter(f=>{if(f.lib) return false; const s=foodStatus(f,c);if(s.level==="ok")return true;if(s.level!=="caution")return false;return !(S.profile.budget==="알뜰"&&f.cost===3)});
}

/* ===== 영양 계산 ===== */
function totals(items){const t={k:0,p:0,f:0,c:0,fi:0,ca:0,fe:0,kal:0};for(const [id,g] of items){const f=FOOD[id];if(!f)continue;for(const k in t)t[k]+=f[k]*g/100}return t}
function dayItems(day){return day.meals.flatMap(m=>m.items)}
const STOOL_L=["기록 안 함","1형 딱딱한 덩어리","2형 울퉁불퉁","3형 갈라진 소시지","4형 매끈한 소시지","5형 부드러운 덩어리","6형 흐물흐물","7형 물 같은 변"];
const MED_L=["기록 안 함","처방대로 먹음","일부 거름","못 먹음","약 복용 안 함"];
function isSkipped(date,slot){return (S.skips?.[date]||[]).includes(slot)}
function isRated(date,slot){return S.ratings.some(r=>r.date===date&&r.slot===slot)}
function isAte(date,slot){return (S.ate?.[date]||[]).includes(slot)||isRated(date,slot)}
function ateMenu(date,slot){return S.ateMeals?.[date]?.[slot]||null}
function planMeal(date,slot){const d=S.plan?.days?.find(x=>x.date===date); return d?d.meals.find(m=>m.slot===slot):null}
function setAte(date,slot,on,snap){
  const a=S.ate[date]||(S.ate[date]=[]); const i=a.indexOf(slot);
  if(on){
    if(i<0) a.push(slot);
    const m=snap||planMeal(date,slot);
    if(m&&!m.empty){ S.ateMeals[date]=S.ateMeals[date]||{}; S.ateMeals[date][slot]={t:String(m.title||""),it:(m.items||[]).map(([id,g])=>[id,g])} }
    const sk=S.skips[date]; if(sk){const j=sk.indexOf(slot); if(j>=0) sk.splice(j,1); if(!sk.length) delete S.skips[date]}
  } else {
    if(i>=0) a.splice(i,1);
    S.ratings=S.ratings.filter(r=>!(r.date===date&&r.slot===slot));
    if(S.ateMeals[date]){delete S.ateMeals[date][slot]; if(!Object.keys(S.ateMeals[date]).length) delete S.ateMeals[date]}
  }
  if(!a.length) delete S.ate[date]; save();
}
/* 그날 먹은 끼니의 식품 목록(기록 당시 스냅샷 우선) */
function ateItems(date,slot){const m=ateMenu(date,slot); if(m&&m.it?.length) return m.it.filter(([id])=>FOOD[id]); const pm=planMeal(date,slot); return pm&&!pm.empty?pm.items:[]}
function toggleSkip(date,slot){const a=S.skips[date]||(S.skips[date]=[]); const i=a.indexOf(slot); i>=0?a.splice(i,1):a.push(slot); if(!a.length) delete S.skips[date]; save()}
// 2025 한국인 영양소 섭취기준[16]: 칼슘 권장섭취량(mg), 수분 중 액체 충분섭취량(ml)
// [나이 상한, 칼슘 권장섭취량 mg, 액체 충분섭취량 ml, 식이섬유 충분섭취량 g] — 2025 KDRI 1권·3권 요약표
const KDRI={M:[[29,800,1200,30],[49,800,1200,30],[64,800,1000,30],[74,800,1000,30],[200,800,1100,30]],F:[[29,650,1000,20],[49,650,1000,20],[64,750,1000,25],[74,750,900,25],[200,750,1000,25]]};
function kdri(){
  const sx=S.profile.sex, age=+S.profile.age;
  if(!sx||!age||age<19) return null;
  const row=(KDRI[sx]||[]).find(r=>age<=r[0]); if(!row) return null;
  return {ca:row[1],water:row[2],fiber:row[3]};
}
function targets(){
  const st=currentStage().stage; const w=bodyWeight()||60;
  const pk=orderOn("highprotein")?1.5:st<3?1.2:1.0;
  const kd=kdri();
  const docWater=orderOn("fluid")&&+S.orders.fluidMl;
  return {w,hasW:!!bodyWeight(),k:Math.round(w*30),kHi:Math.round(w*35),p:Math.round(w*pk),pk,
    water:docWater?+S.orders.fluidMl:bodyWeight()?Math.round(bodyWeight()*30/10)*10:(kd?kd.water:1000),waterSrc:docWater?"doc":bodyWeight()?"kg":kd?"kdri":"default",
    ca:kd?kd.ca:800,caSrc:kd?"kdri":"default",
    fiber:(orderOn("lowres")||st===1)?{lo:10,hi:15,src:"low"}:st===3?(kd?{goal:kd.fiber,src:"kdri"}:{src:"needinfo"}):{src:"mid"}};
}

/* ===== 예시 식단 ===== */
let SAMPLE_FIT=null, SWAP_CLEARED="";
function samplePlan(){
  const allowed=new Set(planFoods().map(f=>f.id)); const c=ctx();
  const clone=m=>JSON.parse(JSON.stringify(m));
  const cap=([id,g])=>{const f=FOOD[id]; let v=g;
    if(c.fiberStage===1){ if(f.fi*v/100>=2) v=Math.min(v,maxLowFiberG(f)); if(f.cat==="채소") v=Math.min(v,VEG_CAP); if(FRUIT_CAP[id]) v=Math.min(v,FRUIT_CAP[id]) }
    if(f.tags.includes("salty")) v=Math.min(v,SALTY_CAP);
    return [id,v]};
  const fit=m=>{const x=clone(m); if(!x.items.every(([id])=>allowed.has(id))) return null;
    if((x.rec||[]).some(r=>!recipeOK(r,allowed,c))) return null;
    x.items=x.items.map(cap); return x};
  const pick=(arr,j)=>{for(let o=0;o<arr.length;o++){const m=fit(arr[(j+o)%arr.length]); if(m) return m} return null};
  const pickMain=(key,j,date,n)=>{const ov=S.swaps?.[`${date}|${n}`];
    if(ov!=null&&TPL[key][ov]){const m=fit(TPL[key][ov]); if(m){m.vi=ov; return m}}
    for(let o=0;o<TPL[key].length;o++){const idx=(j+o)%TPL[key].length; const m=fit(TPL[key][idx]); if(m){m.vi=idx; return m}} return null};
  SAMPLE_FIT={fit,pick,pickMain,c,allowed};
  const days=[];
  const isFruit=id=>FOOD[id].cat==="과일";
  for(let i=0;i<7;i++){
    let fruitUsed=false;
    const meals=[["B",0],["L",1],["D",2]].map(([k,off],n)=>{
      const main=pickMain(k,i+off,addDays(today(),i),n);
      if(main&&main.items.some(([id])=>isFruit(id))) fruitUsed=true;
      const sideList=c.fiberStage===1&&fruitUsed?TPL.S.filter(x=>!x.items.some(([id])=>isFruit(id))):TPL.S;
      const side=pick(sideList,i*3+n); if(side&&side.items.some(([id])=>isFruit(id))) fruitUsed=true;
      if(!main) return {slot:SLOTS[n],title:"조건에 맞는 예시가 없어요",rec:[],items:[],tip:"내 정보의 조건(알레르기·의료진 지시·주의 음식)에 맞는 예시 메뉴가 없어요. 주치의·영양사와 상의해 식단을 정해 주세요.",refs:[],empty:true};
      return {slot:SLOTS[n],title:main.title,rec:main.rec||[],vi:main.vi,side:side?side.title:"",items:[...main.items,...(side?side.items:[])],tip:main.tip,tip2:side?side.tip:"",refs:[...new Set([...main.refs,...(side?side.refs:[])])]};
    });
    days.push({date:addDays(today(),i),meals,sample:true});
  }
  return {sample:true,start:today(),stage:c.stage,days};
}
let PLAN_NOTE="";
function swapMeal(dayIdx,mealIdx){
  const P=S.plan; const d=P?.days[dayIdx]; if(!d) return false;
  samplePlan(); const F=SAMPLE_FIT; const key=["B","L","D"][mealIdx];
  const cur=d.meals[mealIdx]; const start=(cur.vi??0)+1;
  for(let o=0;o<TPL[key].length;o++){
    const idx=(start+o)%TPL[key].length; const cand=TPL[key][idx];
    if(cand.title===cur.title) continue;
    if(!F.fit(cand)) continue;
    S.swaps=S.swaps||{}; S.swaps[`${d.date}|${mealIdx}`]=idx;
    if(isAte(d.date,cur.slot)||isRated(d.date,cur.slot)) setAte(d.date,cur.slot,false); // 메뉴가 바뀌었으니 이전 '먹었어요'와 평가는 지움
    SWAP_CLEARED=isSkipped(d.date,cur.slot)?"":"prev";
    for(const k of Object.keys(S.swaps)) if(k.split("|")[0]<today()) delete S.swaps[k];
    S.plan=samplePlan(); save(); return true;
  }
  return false;
}
const planSig=p=>p.days.slice(0,3).map(d=>d.meals.map(m=>m.title).join("/")).join("|");
function snapSelDay(){const P=S.plan; if(!P?.days?.length) return; const cur=P.days[S.selDay]; if(!cur||cur.date<today()){const k=P.days.findIndex(d=>d.date===today()); S.selDay=k>=0?k:0}}
function refreshPlan(){
  if(!S.plan||S.plan.sample){const prevStart=S.plan?.start; const before=S.plan?planSig(S.plan):null; S.plan=samplePlan();
    const after=planSig(S.plan);
    if(before&&prevStart===S.plan.start&&before!==after&&!PLAN_NOTE) PLAN_NOTE="조건이 바뀌어 예시 식단을 다시 골랐어요.";
    return}
  const last=S.plan.days[S.plan.days.length-1]?.date;
  if(!last||last<today()){S.plan=samplePlan(); S.selDay=0; PLAN_NOTE="지난 식단 기간이 끝나 예시 식단으로 바꿨어요. 새 식단을 만들어 보세요."}
}
function mealIssues(m,c=ctx()){return (m.items||[]).map(x=>x[0]).filter(id=>{const f=FOOD[id]; if(!f) return false; const l=foodStatus(f,c).level; return l==="avoid"||l==="later"})}
</script>

const ERR={not_granted:"AI 사용이 허용되지 않았어요. 다시 열어 허용하면 사용할 수 있어요.",sampling_disabled:"이 계정에서는 AI 기능을 쓸 수 없어요.",rate_limited:"요청이 많거나 사용 한도에 도달했어요. 잠시 뒤 다시 눌러 주세요.",session_expired:"claude.ai에 다시 로그인해 주세요.",invalid_json:"AI 응답 형식이 맞지 않았어요. 다시 눌러 주세요.",refused:"AI가 이 요청에 답하지 않았어요. 조건을 바꿔 다시 시도해 주세요.",prompt_too_large:"보낼 정보가 너무 많아요. 기타 지시 사항을 줄여 주세요."};
// AI가 쓴 자유 문장 검사: 내 알레르기·주의 음식·지시 위반 재료를 권하는 문장은 화면에 내보내지 않음
function safeAIText(t,fallback="앱 규칙에 맞지 않는 내용이 있어 AI 설명을 감췄어요."){
  t=String(t||""); if(!t) return "";
  const c=ctx(); const NEG=/피하|피해|빼|제외|말고|마세요|않|없이|대신|금지|주의|삼가|줄이|안 ?드|안 ?먹|넣지/;
  const bad=(x)=>{const tags=tagsOfText(x);

    for(const [o,tg] of TAGRULE) if(orderOn(o)&&tags.includes(tg)) return true;
    const y=x.replace(/\s/g,""); for(const w of c.words) if(w&&y.includes(w.replace(/\s/g,""))) return true;

function checkDay(raw){
  const probs=[]; const allowedFoods=planFoods(); const allowed=new Set(allowedFoods.map(f=>f.id)); const oilMax=orderOn("lowfat")?10:15; const c=ctx();
  const meals=Array.isArray(raw?.meals)?raw.meals:[];
  if(meals.length!==SLOTS.length) probs.push(`끼니가 ${meals.length}개입니다. ${SLOTS.length}개여야 합니다.`);
  const clean=meals.slice(0,SLOTS.length).map((m,i)=>{
    const items=[];
    for(const it of (Array.isArray(m?.items)?m.items:[])){
      const id=String(it?.id||""), g=Math.round(+it?.g||0);
      if(!FOOD[id]){probs.push(`'${id}'는 목록에 없는 식품입니다.`);continue}
      if(!allowed.has(id)){probs.push(`${FOOD[id].name}은(는) 현재 조건에서 제외 대상입니다(${foodStatus(FOOD[id]).reasons.join(", ")}).`);continue}
      if(g<5||g>400){probs.push(`${FOOD[id].name} ${g}g은 범위를 벗어났습니다.`);continue}
      if(items.some(x=>x[0]===id)){continue}
      let v=g;
      if(c.fiberStage===1&&FOOD[id].fi*v/100>=2){const mg=maxLowFiberG(FOOD[id]);probs.push(`${SLOTS[i]}의 ${FOOD[id].name} ${v}g은 섬유가 2g 이상입니다(최대 ${mg}g).`);v=mg}
      if(c.fiberStage===1&&FOOD[id].cat==="채소"&&v>VEG_CAP){probs.push(`${SLOTS[i]}의 ${FOOD[id].name}은 ${VEG_CAP}g 이하여야 합니다.`);v=VEG_CAP}
      if(c.fiberStage===1&&FRUIT_CAP[id]&&v>FRUIT_CAP[id]){probs.push(`${SLOTS[i]}의 ${FOOD[id].name}은 ${FRUIT_CAP[id]}g 이하여야 합니다.`);v=FRUIT_CAP[id]}
      if(FOOD[id].tags.includes("salty")&&v>SALTY_CAP){probs.push(`${SLOTS[i]}의 ${FOOD[id].name}은 짠 식품이라 ${SALTY_CAP}g 이하여야 합니다.`);v=SALTY_CAP}
      items.push([id,v]);
    }
    if(c.fiberStage===1){const veg=items.filter(([id])=>FOOD[id].cat==="채소"); if(veg.length>1){probs.push(`${SLOTS[i]}의 채소가 ${veg.length}가지입니다. 한 가지만 씁니다.`); for(const x of veg.slice(1)) items.splice(items.indexOf(x),1)}}
    for(const x of items){const f=FOOD[x[0]]; const cap=f.tags.includes("salty")?40:f.id==="honey"?15:f.tags.includes("sweet")?60:null; if(cap&&x[1]>cap){probs.push(`${SLOTS[i]}의 ${f.name} ${x[1]}g은 한 끼 상한 ${cap}g을 넘습니다.`); x[1]=cap}}
    const oil=items.filter(([id])=>FOOD[id].tags.includes("oil")).reduce((a,[,g])=>a+g,0);
    if(oil>oilMax){probs.push(`${SLOTS[i]}의 기름이 ${oil}g입니다(최대 ${oilMax}g).`);for(const x of items) if(FOOD[x[0]].tags.includes("oil")) x[1]=Math.min(x[1],oilMax)}
    // 요리: 레시피 목록에서만
    let rec=(Array.isArray(m?.recipes)?m.recipes:[]).map(String).filter((x,k,arr)=>arr.indexOf(x)===k).slice(0,3);
    const badRec=rec.filter(r=>!recipeOK(r,allowed,c)); if(badRec.length) probs.push(`${SLOTS[i]}의 요리 ${badRec.join(", ")}은(는) 목록에 없거나 지금 조건에 맞지 않습니다.`);
    rec=rec.filter(r=>recipeOK(r,allowed,c));
    for(const r of rec) for(const f of RECIPES[r].foods) if(!items.some(x=>x[0]===f)) probs.push(`${SLOTS[i]}의 요리 ${RECIPES[r].name}의 주재료 ${FOOD[f].name}이(가) items에 없습니다.`);
    if(!rec.length) probs.push(`${SLOTS[i]}에 레시피 목록의 요리가 없습니다.`);
    if(!items.length) probs.push(`${SLOTS[i]}에 유효한 식품이 없습니다.`);
    const refs=(Array.isArray(m?.refs)?m.refs:[]).map(Number).filter(n=>REFS[n]).slice(0,3);
    const title=rec.length?rec.map(r=>RECIPES[r].name).join("과 "):String(m?.title||"식사");
    return {slot:SLOTS[i],title:title.slice(0,40),rec,items,tip:safeAIText(String(m?.tip||"").slice(0,160),""),refs:refs.length?refs:[...new Set(items.flatMap(([id])=>FOOD[id].refs))].slice(0,2)};
  });
  if(c.fiberStage===1){const fr=clean.flatMap(m=>m.items.filter(([id])=>FOOD[id].cat==="과일")); if(fr.length>1){probs.push(`저잔사식 단계에서는 과일을 하루 한 번(한 가지)만 넣습니다. 지금 ${fr.length}번입니다.`); for(const m of clean){ m.items=m.items.filter(x=>!(FOOD[x[0]].cat==="과일"&&x!==fr[0])) }}}
  const t=totals(clean.flatMap(m=>m.items)), tg=targets();
  if(t.p<tg.p*0.9) probs.push(`단백질 합계가 ${Math.round(t.p)}g으로 목표 ${tg.p}g보다 적습니다.`);
  if(t.k<tg.k*0.75||t.k>tg.k*1.3) probs.push(`열량 합계가 ${Math.round(t.k)}kcal로 목표 ${tg.k}kcal와 차이가 큽니다.`);
  return {probs,clean,complete:clean.length===SLOTS.length&&clean.every(m=>m.items.length&&m.rec.length)};
}
async function makeDay(date,avoidTitles,signal,onStep){
  let problems=null,last=null;
  for(let attempt=0;attempt<2;attempt++){
    onStep?.(attempt?"조건 위반을 고치는 중":"식단을 만드는 중");
    const raw=await SAMPLE.json(dayPrompt(date,avoidTitles,problems),{signal,cache:false});
    const r=checkDay(raw); last=r;
    if(!r.probs.length) return {date,meals:r.clean,checked:"통과"};
    problems=r.probs;
  }
  if(!last.complete) throw {code:"invalid_json",message:"incomplete"};
  const nutri=last.probs.filter(p=>p.startsWith("단백질")||p.startsWith("열량"));
  return {date,meals:last.clean,checked:nutri.length?"영양 목표 미달: "+nutri.join(" "):"위반 식품 자동 제거"};
}

function tagsOfText(t,ingr=[]){const x=String(t).normalize("NFC").replace(/\s/g,"");const toks=ingr.map(i=>String(i).normalize("NFC").replace(/\s/g,""));
  const hit=Object.entries(KW).filter(([k,ws])=>{const y=KW_EXCL[k]?x.replace(KW_EXCL[k],""):x; return ws.some(w=>y.includes(w))}).map(([k])=>k);
  for(const [k,ws] of Object.entries(KW_EXACT)) if(toks.some(tk=>ws.includes(tk))) hit.push(k);
  return [...new Set(hit)]}
function ruleCheck(item){
  // 앱 규칙: AI 판정과 별개로 코드가 알레르기·지시·주의 음식·절대 제외 항목을 검사
  const text=item.name+" "+(item.ingr||[]).join(" ")+" "+(item.cook||"");
  const tags=tagsOfText(text,item.ingr||[]); const c=ctx(); const R=[]; let lv="ok";
  const up=(l,r)=>{const rank={ok:0,caution:1,later:2,avoid:3};if(rank[l]>rank[lv])lv=l;R.push(r)};
  const okd=(S.okMenus||[]).includes(String(item.name).replace(/\s/g,""));
  for(const a of c.allergies) if(tags.includes(a)) up("avoid",`알레르기 재료 가능성(${allergyLabel(a)})`);
  if(S.profile.lactose&&tags.includes("lactose")) up("avoid","유당 가능성");
  for(const [o,t] of TAGRULE) if(orderOn(o)&&tags.includes(t)) up("avoid",`의료진 지시: ${orderLabel(o)}`);
  const f0=exactFood(item.name);
  if(!f0){
    for(const [t,l] of [["processed","가공육(햄·베이컨 등)"],["upf","초가공식품"],["alcohol","술"]]) if(tags.includes(t)) up("avoid",`${l} 포함 가능성`);
    if(tags.includes("spicy")&&c.stage<3) up(okd?"caution":"avoid",okd?"맵거나 자극적인 양념(내가 괜찮았다고 표시함)":"맵고 자극적인 양념(앱 기본 설정: 증상이 남은 단계에서는 제외)");
  }
  const x=text.replace(/\s/g,"");
  for(const t of S.triggers){const k=t.name.split("(")[0].replace(/\s/g,""); if(k&&x.includes(k)) up("avoid",`개인 주의 음식(${t.name})`)}
  for(const w of c.words) if(w&&x.includes(w.replace(/\s/g,""))) up("avoid",`알레르기·싫어하는 음식(${w})`);
  if(f0){
    const s=foodStatus(f0,{...c,allergies:[],words:[],trig:[]});
    const soft=okd&&s.level==="avoid"&&f0.tags.includes("spicy")&&f0.ms!==9&&!AVOID_TAG.some(([t])=>f0.tags.includes(t));
    if(s.level!=="ok") for(const r of s.reasons) up(soft?"caution":s.level,`${f0.name}: ${r}${soft?" (내가 괜찮았다고 표시함)":""}`);
  } else {
    if(tags.includes("redmeat")) up("caution","붉은 고기");
    if(tags.includes("fatty")) up("caution","기름진 조리");
    if(tags.includes("fodmap")) up("caution","가스를 늘릴 수 있는 재료");
  }
  return {level:lv,reasons:[...new Set(R)]};
}

function foodSuspects(days=30){
  const from=addDays(today(),-days+1);
  const dayFoods={};
  const add=(d,name)=>{if(d<from||d>today())return;(dayFoods[d]||(dayFoods[d]=new Set())).add(name)};
  for(const r of S.ratings) add(r.date, r.foodId&&FOOD[r.foodId]?FOOD[r.foodId].name:r.name||r.title||"");
  for(const [d,arr] of Object.entries(S.extras)) for(const x of arr) add(d,String(x.name||""));
  for(const [d,day] of Object.entries(S.ateMeals||{})) for(const m of Object.values(day)) for(const [id] of (m.it||[])) if(FOOD[id]&&!FOOD[id].tags.includes("oil")) add(d,FOOD[id].name);
  const badDay=d=>{const l=S.logs[d]; if(!l) return null; const ds=dangerSignals(l); return activity(l).stage===1||ds.severe.length||ds.urgent.length||(+l.bloody||0)>0};
  const stat={};
  for(const [d,set] of Object.entries(dayFoods)){
    const bad=badDay(d); if(bad===null) continue;
    for(const nm of set){ if(!nm) continue; const o=stat[nm]||(stat[nm]={n:0,bad:0}); o.n++; if(bad) o.bad++ }
  }
  return Object.entries(stat).filter(([,o])=>o.n>=3&&o.bad>=2).map(([name,o])=>({name,...o,pct:Math.round(o.bad/o.n*100)}))
    .sort((a,b)=>b.pct-a.pct||b.n-a.n).slice(0,5);
}

  if(sug!=null&&sug>=(liquid?2.5:5)) out.push({lv:liquid?"caution":"info",title:"당류",found:[`100${u}당 ${sug}g`],why:liquid?"가당 음료는 줄이도록 권고돼요.":`저당류 기준(100g당 5g 미만)을 넘어요.`,refs:liquid?[2,16,29]:[29]});

function keepFieldVisible(){
  const el=document.activeElement; if(!el||!(el.tagName==="TEXTAREA"||(el.tagName==="INPUT"&&/^(text|search|number|date)$/.test(el.type)))) return;

  for(const bar of document.querySelectorAll(".bottom-bar,.tabs")){const st=getComputedStyle(bar); if(st.position!=="fixed"||st.visibility==="hidden"||st.display==="none") continue; const br=bar.getBoundingClientRect(); if(br.height>0&&br.top<limit) limit=Math.min(limit,br.top)}
  const over=Math.min(r.bottom+8-limit, r.top-72); if(over>0){window.scrollBy(0,over);return}
  const ab=$("#appbar")?.getBoundingClientRect(); const t=ab&&ab.bottom>0?ab.bottom:0; if(r.top<t+4) window.scrollBy(0,r.top-t-8); // 위쪽 제목 막대에 가린 경우
}

function applyBad(date,source){
  const added=[];
  if(!BAD) return added;
  for(const x of BAD.list){
    const allergy=x.sym.includes("allergy");
    if(allergy&&x.addAl&&x.alTags.length){S.profile.allergies=[...new Set([...S.profile.allergies,...x.alTags])]}
    if(x.dec==="none") continue;
    if(x.dec==="dislike"){const base=x.name.split("(")[0].trim(); const cur=String(S.profile.dislikes||"").split(/[,\n、]/).map(v=>v.trim()).filter(Boolean); if(!cur.includes(base)) S.profile.dislikes=[...cur,base].join(", "); added.push(x.name); continue}
    const t={name:x.name,date,source,sym:[...x.sym],never:x.dec==="never"||allergy};
    const fid=x.foodId||guessFoodId(x.name); if(fid) t.foodId=fid;
    const k=S.triggers.findIndex(o=>(x.foodId&&o.foodId===x.foodId)||o.name===x.name);
    if(k>=0){const o=S.triggers[k]; S.triggers[k]={...o,...t,foodId:t.foodId||o.foodId,sym:[...new Set([...(o.sym||[]),...t.sym])],never:!!(o.never||t.never)}}
    else S.triggers.push(t);
    added.push(x.name);
  }
  for(const x of BAD.list){const r=[...S.ratings].reverse().find(r=>r.date===date&&r.rating==="bad"&&((x.foodId&&r.foodId===x.foodId)||r.name===x.name)); if(r) r.sym=[...x.sym]}
  BAD=null; return added;
}

  if(n==="set-orders") return `<p class="hint pad">켠 항목은 식단 생성과 검증에 가장 먼저 반영돼요.</p>

  if(n==="set-data") return `<p class="hint pad">아이폰 사파리는 앱을 한동안 열지 않거나 저장 공간이 부족하면 저장된 기록을 지울 수 있어요. 2주에 한 번은 백업 파일을 저장하거나 백업 내용을 복사해 두세요. 모든 기록은 이 기기의 브라우저에만 저장돼요. 사이트 데이터를 지우거나 휴대폰을 바꾸면 사라져요. 백업에는 건강 기록이 암호화되지 않은 채 들어 있으니 다른 사람과 공유하지 마세요.</p>
    <div class="card row between"><span>마지막 백업</span><b>${S.lastBackup?md(S.lastBackup):"없음"}</b></div>
    <div class="list">${listRow({icon:"cloud",tint:"t-warm",title:"백업 파일 저장",sub:"파일로 내려받아요",attr:`data-act="backup" ${DL?"":"disabled"}`})}
    ${listRow({icon:"doc",tint:"t-warm",title:"백업 내용 복사",sub:"메모 앱 등에 붙여 넣어 보관해요",attr:'data-act="backupCopy"'})}

    ${listRow({icon:"refresh",tint:"t-rose",title:"복사한 내용 붙여 넣어 불러오기",attr:'data-act="restorePaste"'})}

  if(n==="set-privacy") return `<div class="card stack info-body">
    <h2>개인정보 처리 안내</h2>
    <p><b>저장 위치</b> · 모든 기록은 이 기기의 브라우저 저장소에만 있어요. 앱이 따로 서버로 보내지 않아요.</p>
    <p><b>저장 항목</b> · 키·나이·성별·몸무게, 의료진 지시, 알레르기·유당불내증, 복용 약, 싫어하는 음식, 증상 기록, 음식 평가, 수분 기록, 식단.</p>

    <p><b>삭제</b> · 내 정보 → 데이터 백업 → 전체 초기화로 이 기기의 모든 기록을 지울 수 있어요.</p>

  <div class="list">${swRow("AI 기능 사용 동의",'id="c_ai2"',!!S.consent?.ai,"끄면 AI 기능을 쓰기 전에 다시 물어봐요")}</div>`;
  if(n==="set-refs") return `<div class="list">${Object.entries(REFS).sort((a,b)=>a[0]-b[0]).map(([k,r])=>`<button class="lrow" data-act="ref1" data-v="${k}"><span class="refn num">${k}</span><span class="lt"><b>${esc(r.short)}</b></span>${ic("chev","chev")}</button>`).join("")}</div>`;

    <div class="sec-label">앱 안내</div>
    ${infoBody("me")}`;
  return "";
}
function infoBody(tab){
  const c={
   plan:`<h2>식단은 이렇게 만들어져요</h2><p>의료진 지시 → 알레르기·유당·개인 주의 음식 → 식단 단계 순서로 식품을 거른 뒤, 예시 식단은 앱 규칙이, AI 식단은 AI가 골라요. AI 식단도 앱이 다시 검사해 조건에 맞지 않는 식품을 빼요. 하루 세 끼 기준이에요.</p><p>요리는 만개의레시피·모두의레시피에서 고른 것만 쓰고, 끼니 화면의 '레시피 보기'로 원문을 열 수 있어요. 레시피 재료 중 앱 기준에 안 맞는 것은 바꿔 만들도록 알려 줘요.</p><p>작은 숫자는 근거 자료 번호예요. 눌러서 원문 정보를 볼 수 있어요.</p><p>식단 단계: ${term("lowres","저잔사식")} → ${term("transition","이행식")} → ${term("med","지중해식")}</p><p>${NUTRI_NOTE}${sup([27])}</p><p class="muted">이 식단은 참고용이며 진단이나 처방을 대신하지 않아요.</p>`,
   log:`<h2>증상 점수와 경고 기준</h2><p>${term("sccai","SCCAI")} 활동도 지수${sup([11])}를 쓰며, 환자가 직접 작성해도 정확하다고 검증됐어요${sup([15])}. 5점 이상은 활동기(재발) 기준이에요.</p><p>하루 6회 이상 혈변과 함께 체온 37.5℃ 이상이나 맥박 90회 이상이 있으면 국내 진단 가이드라인의 중증 기준${sup([38])}으로 병원 진료를 안내해요. 국내 기준의 발열은 저녁 체온으로 판단하므로 저녁에 재 주세요.</p><p>식단 단계는 하루 배변 3회 이하이면서 혈변·급박감이 없으면 지중해식 단계, SCCAI 5점 이상이거나 혈변이 잦으면 저잔사식 단계로 정해요${sup([38,15])}.</p>`,
   food:`<h2>판정 기준</h2><p>음식 판정은 현재 식단 단계와 내 정보(지시·알레르기·주의 음식)를 함께 봐요. 사진 인식은 음식 종류는 대체로 맞히지만 숨은 재료는 놓칠 수 있어요${sup([19])}.</p><p>편의점 제품은 영양성분 표시 기준${sup([29])}, 식약처 첨가물 이름표${sup([27])}, 알레르기 표시 대상${sup([28])}으로 앱 규칙이 판정해요. 알레르기 재료는 꼭 포장과 가게에 확인하세요.</p>`,
   nutri:`<h2>목표값의 근거</h2><p>열량 체중 1kg당 30–35kcal, 단백질 활동기 1.2–1.5g/kg${sup([1])}. 칼슘·수분·식이섬유는 2025 한국인 영양소 섭취기준${sup([16])}, 저섬유식 기준은 MedlinePlus${sup([26])}를 따라요.</p><p>${NUTRI_NOTE}</p>`,
   me:`<h2>UC 식탁</h2><p>궤양성 대장염 환자를 위한 지중해식 식단·증상 기록 도구예요. 개인 정보는 내 정보에서만 입력하고, 모든 기록은 이 기기에만 저장돼요.</p><p class="muted">이 앱은 참고용이며 의학적 진단·치료를 대신하지 않아요. 식이 변경은 주치의·영양사와 상의하세요.</p>`
  };
  return `<div class="card stack info-body">${c[tab]||""}</div>`;
}

function careDone(k){const d=S.care?.[k]; if(!d) return false; return !CARE_YEARLY.includes(k)||d>addDays(today(),-365)}

function scrCare(){
  return `<p class="hint pad">대상과 시기는 사람마다 달라요. 진료 때 주치의와 확인하고, 확인한 항목을 표시해 두세요. 진료용 PDF에도 들어가요.</p>

// PDF용 SCCAI 선 그래프: 한 계열, 5점 기준선, 기록 없는 날은 끊김
function drawSccaiChart(cv,from,n,theme){
  const g=cv.getContext("2d"), Z=2, W=cv.width/Z, H=cv.height/Z;
  const cs=getComputedStyle(document.documentElement);
  const cv1=(k,d)=>{const v=cs.getPropertyValue(k).trim(); return v||d};
  const C=theme==="print"?{bg:"#fff",grid:"#E7E9ED",mute:"#6A717D",line:"#2F6FED",ink:"#171A1F"}
    :{bg:cv1("--surface","#fff"),grid:cv1("--line","#E7E9ED"),mute:cv1("--muted","#6A717D"),line:cv1("--accent","#2F6FED"),ink:cv1("--ink","#171A1F")};
  const pad={l:34,r:40,t:14,b:30};
  const pts=[...Array(n)].map((_,i)=>{const d=addDays(from,i);const l=S.logs[d];return {d,v:l?sccai(l):null}});
  const vmax=Math.max(12,...pts.map(p=>p.v||0));
  const x=i=>pad.l+(n<=1?0:i*(W-pad.l-pad.r)/(n-1)), y=v=>pad.t+(1-v/vmax)*(H-pad.t-pad.b);
  g.setTransform(Z,0,0,Z,0,0); g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  g.font="500 11px 'Noto Sans KR',sans-serif"; g.textBaseline="middle";
  for(let v=0;v<=vmax;v+=vmax>15?5:3){g.strokeStyle=C.grid;g.lineWidth=1;g.beginPath();g.moveTo(pad.l,y(v));g.lineTo(W-pad.r,y(v));g.stroke();g.fillStyle=C.mute;g.textAlign="right";g.fillText(String(v),pad.l-6,y(v))}
  g.setLineDash([5,4]); g.strokeStyle=C.mute; g.lineWidth=1.2; g.beginPath(); g.moveTo(pad.l,y(5)); g.lineTo(W-pad.r,y(5)); g.stroke(); g.setLineDash([]);
  g.fillStyle=C.mute; g.textAlign="left"; g.fillText("5점",W-pad.r+4,y(5));
  g.strokeStyle=C.line; g.lineWidth=2; g.lineJoin="round"; g.beginPath(); let on=false;
  pts.forEach((p,i)=>{if(p.v==null){on=false;return} if(!on){g.moveTo(x(i),y(p.v));on=true}else g.lineTo(x(i),y(p.v))}); g.stroke();
  pts.forEach((p,i)=>{if(p.v==null)return; g.fillStyle=C.bg; g.beginPath(); g.arc(x(i),y(p.v),5,0,7); g.fill(); g.fillStyle=C.line; g.beginPath(); g.arc(x(i),y(p.v),4,0,7); g.fill()});
  const last=[...pts].reverse().find(p=>p.v!=null); if(last){const i=pts.indexOf(last); g.fillStyle=C.ink; g.textAlign="left"; g.font="700 12px 'Noto Sans KR',sans-serif"; g.fillText(String(last.v),Math.min(x(i)+8,W-pad.r+4),y(last.v)-10)}
  g.fillStyle=C.mute; g.font="500 11px 'Noto Sans KR',sans-serif"; g.textBaseline="top";
  [0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i).forEach(i=>{g.textAlign=i===0?"left":i===n-1?"right":"center"; g.fillText(pts[i].d.slice(5).replace("-","/"),x(i),H-pad.b+8)});
}
// 표 행을 실제 높이로 재서 한 쪽(A4 본문 높이)에 들어가게 나눈다. 제목·설명은 첫 조각에만 붙인다.
function packTable(title,head,rows,note,attrs=""){
  const rep=$("#report"), MAXH=1060, out=[];
  const html=(rs,i)=>`${i===0?title:""}<table${attrs}>${head}<tbody>${rs.join("")}</tbody></table>${i===0&&note?note:""}`;
  const hOf=x=>{rep.innerHTML=`<div class="blk">${x}</div>`; return rep.firstChild.offsetHeight};
  let cur=[];
  for(const r of rows){const t=[...cur,r]; if(cur.length&&hOf(html(t,out.length))>MAXH){out.push(html(cur,out.length));cur=[r]} else cur=t}
  if(cur.length) out.push(html(cur,out.length));
  rep.innerHTML="";
  return out;
}

    blocks.push(`<div style="font-size:11px;color:#555">본 문서는 환자가 앱(UC 식탁)에 직접 기록한 내용이며, SCCAI는 환자 자가 작성 점수이고 식단 단계는 앱의 참고용 분류입니다. 음식 평가는 환자의 주관적 판단입니다.</div>`);
